name: Task14 R6 B29 validation

on:
  push:
    branches: [ task14-r6-b1-final ]

permissions:
  contents: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[r6-b29-validated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r6-b1-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate perception and runtime retention
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-desertbatfly-r5-retention.sh
          bash scripts/check-desertbatfly-r6-b1.sh
          ! grep -n -E '\bdanger[[:space:]]*=' src/Creatures/DesertBatfly/Perception/DB_CreaturePerception.cs
          grep -q 'if (distance < fearDistance) Danger = player;' src/Creatures/DesertBatfly/Perception/DB_CreaturePerception.cs
          git diff --check
      - name: Mark validation complete
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/task14-r6-b29-validation.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R6 B29 perception fix validated [r6-b29-validated]'
          git push origin HEAD:task14-r6-b1-final
