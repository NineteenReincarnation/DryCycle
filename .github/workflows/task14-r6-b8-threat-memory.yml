name: Task14 R6 B8 Threat memory migration

on:
  push:
    branches:
      - task14-r6-b1-final

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[r6-b8-threat-memory]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r6-b1-final
          fetch-depth: 0

      - name: Capture baseline source
        shell: bash
        run: |
          set -euo pipefail
          cp src/Creatures/DesertBatfly/ThreatSignature/DesertBatflyThreatMemory.cs /tmp/ThreatMemory.before.cs

      - name: Migrate Threat memory identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/Creatures/DesertBatfly/Threat
          git mv src/Creatures/DesertBatfly/ThreatSignature/DesertBatflyThreatMemory.cs src/Creatures/DesertBatfly/Threat/DB_ThreatMemory.cs
          python3 - <<'PY'
          from pathlib import Path
          mappings = [
              ('DesertBatflyPlayerThreatMemory','DB_PlayerThreatMemory'),
              ('DesertBatflyThreatMemorySet','DB_ThreatMemorySet'),
              ('DesertBatflyThreatMemoryStore','DB_ThreatMemoryStore'),
              ('DesertBatflyThreatDimension','DB_ThreatDimension'),
          ]
          for base in (Path('src'), Path('tests'), Path('scripts')):
              if not base.exists():
                  continue
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix not in {'.cs','.sh'}:
                      continue
                  text=p.read_text(encoding='utf-8')
                  changed=text
                  for old,new in mappings:
                      changed=changed.replace(old,new)
                  if changed != text:
                      p.write_text(changed,encoding='utf-8')
          PY

      - name: Validate behavior-preserving source equivalence and save identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          before=Path('/tmp/ThreatMemory.before.cs').read_text(encoding='utf-8')
          mappings = [
              ('DesertBatflyPlayerThreatMemory','DB_PlayerThreatMemory'),
              ('DesertBatflyThreatMemorySet','DB_ThreatMemorySet'),
              ('DesertBatflyThreatMemoryStore','DB_ThreatMemoryStore'),
              ('DesertBatflyThreatDimension','DB_ThreatDimension'),
          ]
          for old,new in mappings:
              before=before.replace(old,new)
          after=Path('src/Creatures/DesertBatfly/Threat/DB_ThreatMemory.cs').read_text(encoding='utf-8')
          if before != after:
              raise SystemExit('DB_ThreatMemory differs from legacy source beyond identity substitution')
          PY
          test -f src/Creatures/DesertBatfly/Threat/DB_ThreatMemory.cs
          ! test -e src/Creatures/DesertBatfly/ThreatSignature/DesertBatflyThreatMemory.cs
          ! grep -RIn --include='*.cs' -E 'DesertBatfly(PlayerThreatMemory|ThreatMemorySet|ThreatMemoryStore|ThreatDimension)' src tests
          grep -q 'internal const string SaveKey = "DCDesertBatflyThreatV1";' src/Creatures/DesertBatfly/Threat/DB_ThreatMemory.cs
          grep -q 'slots\[0\] = "1";' src/Creatures/DesertBatfly/Threat/DB_ThreatMemory.cs
          grep -q 'SignatureDecayPerCycle = 0.80f' src/Creatures/DesertBatfly/Threat/DB_ThreatMemory.cs
          grep -q 'ConfidenceDecayPerCycle = 0.86f' src/Creatures/DesertBatfly/Threat/DB_ThreatMemory.cs

      - name: Run existing retention audits
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-desertbatfly-r5-retention.sh
          bash scripts/check-desertbatfly-r6-b1.sh
          git diff --check

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R6 B8 migrate Threat memory identity'
          git rm .github/workflows/task14-r6-b8-threat-memory.yml
          git commit -m 'Remove temporary R6 B8 migration workflow'
          git push origin HEAD:task14-r6-b1-final
