name: Task14 R6 B16 leaf identities

on:
  push:
    branches: [ task14-r6-b1-final ]

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[r6-b16-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r6-b1-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace leaf identifiers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'DesertBatflyTerrainExtensions': 'DB_TerrainExtensions',
              'DesertBatflyDebugTrace': 'DB_Trace',
              'DesertBatflyThreatTrace': 'DB_ThreatTrace',
          }
          roots = [Path('src'), Path('tests'), Path('scripts')]
          suffixes = {'.cs', '.sh', '.py', '.md'}
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in suffixes:
                      continue
                  text = path.read_text(encoding='utf-8')
                  new = text
                  for old, replacement in replacements.items():
                      new = new.replace(old, replacement)
                  if new != text:
                      path.write_text(new, encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'DesertBatflyTerrainExtensions|DesertBatflyDebugTrace|DesertBatflyThreatTrace' -- src tests scripts; then
            echo 'Old B16 identity remains.' >&2
            exit 1
          fi
          grep -q 'class DB_TerrainExtensions' src/Creatures/DesertBatfly/Runtime/DB_TerrainExtensions.cs
          grep -q 'class DB_Trace' src/Creatures/DesertBatfly/Debug/DB_Trace.cs
          grep -q 'class DB_ThreatTrace' src/Creatures/DesertBatfly/Debug/DB_ThreatTrace.cs
          git grep -q 'DCDesertBatflyV1' -- src tests
          git grep -q 'DCDesertBatflyThreatV1' -- src tests
          git grep -q 'DCBATCOLONY09<svB>' -- src tests
          git grep -q 'DESERTSWARMROOM' -- src tests
          bash scripts/check-desertbatfly-r5-retention.sh
          bash scripts/check-desertbatfly-r6-b1.sh
          git diff --check
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/task14-r6-b16-leaf-identities.yml
          git add -A
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R6 B16 finish trace and terrain leaf identities [r6-b16-done]'
          git push origin HEAD:task14-r6-b1-final
