name: DevTool Sound Click Frame Finalize

on:
  push:
    paths:
      - '.github/workflows/devtool-sound-click-frame-finalize.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified Sound click-frame cleanup
        shell: python
        run: |
          from pathlib import Path

          hook = Path('src/DevUI/DevTool/Compatibility/SoundPageConstructorOptimization.cs')
          text = hook.read_text(encoding='utf-8')
          text = text.replace(
              '    private static bool patchInstalled;\n',
              '    private static bool constructorPatchInstalled;\n    private static bool refreshHookInstalled;\n',
              1)

          old = '''        enabled = true;\n        try\n        {\n            IL.DevInterface.SoundPage.ctor += PatchConstructor;\n            On.DevInterface.SoundPage.RefreshFilesPage += SoundPage_RefreshFilesPage;\n            patchInstalled = true;\n        }\n        catch (Exception error)\n        {\n            patchInstalled = false;\n            Plugin.Logger?.LogWarning("DevTool SoundPage constructor optimization unavailable: " + error);\n        }\n'''
          new = '''        enabled = true;\n        try\n        {\n            IL.DevInterface.SoundPage.ctor += PatchConstructor;\n            constructorPatchInstalled = true;\n            On.DevInterface.SoundPage.RefreshFilesPage += SoundPage_RefreshFilesPage;\n            refreshHookInstalled = true;\n        }\n        catch (Exception error)\n        {\n            // Hook installation is transactional. Never leave only half of the optimization alive;\n            // an isolated constructor IL patch without the matching lazy-materialization hook would\n            // violate the legacy fallback contract.\n            if (refreshHookInstalled)\n            {\n                try { On.DevInterface.SoundPage.RefreshFilesPage -= SoundPage_RefreshFilesPage; }\n                catch { }\n                refreshHookInstalled = false;\n            }\n            if (constructorPatchInstalled)\n            {\n                try { IL.DevInterface.SoundPage.ctor -= PatchConstructor; }\n                catch { }\n                constructorPatchInstalled = false;\n            }\n            enabled = false;\n            Plugin.Logger?.LogWarning("DevTool SoundPage constructor optimization unavailable: " + error);\n        }\n'''
          if old not in text:
              raise SystemExit('Sound hook Enable anchor not found')
          text = text.replace(old, new, 1)

          old = '''        enabled = false;\n        if (!patchInstalled) return;\n        try\n        {\n            On.DevInterface.SoundPage.RefreshFilesPage -= SoundPage_RefreshFilesPage;\n            IL.DevInterface.SoundPage.ctor -= PatchConstructor;\n        }\n        catch (Exception error)\n        {\n            Plugin.Logger?.LogWarning("DevTool SoundPage constructor optimization could not be removed cleanly: " + error.Message);\n        }\n        patchInstalled = false;\n'''
          new = '''        enabled = false;\n\n        if (refreshHookInstalled)\n        {\n            try { On.DevInterface.SoundPage.RefreshFilesPage -= SoundPage_RefreshFilesPage; }\n            catch (Exception error)\n            {\n                Plugin.Logger?.LogWarning("DevTool SoundPage refresh optimization could not be removed cleanly: " + error.Message);\n            }\n            refreshHookInstalled = false;\n        }\n\n        if (constructorPatchInstalled)\n        {\n            try { IL.DevInterface.SoundPage.ctor -= PatchConstructor; }\n            catch (Exception error)\n            {\n                Plugin.Logger?.LogWarning("DevTool SoundPage constructor optimization could not be removed cleanly: " + error.Message);\n            }\n            constructorPatchInstalled = false;\n        }\n'''
          if old not in text:
              raise SystemExit('Sound hook Disable anchor not found')
          hook.write_text(text.replace(old, new, 1), encoding='utf-8')

          pipeline = Path('src/DevUI/DevTool/Sound/SoundActivationPipeline.cs')
          text = pipeline.read_text(encoding='utf-8')

          old = '''        if (rebuiltFrontendOwnsPresentation &&\n            (session.ToolMode != EditorToolMode.Sound || session.Owner.activePage is not SoundPage))\n        {\n            StepPrewarm();\n            return;\n        }\n'''
          new = '''        if (rebuiltFrontendOwnsPresentation &&\n            (session.ToolMode != EditorToolMode.Sound || session.Owner.activePage is not SoundPage))\n        {\n            if (!ShouldPausePrewarm(session))\n                StepPrewarm();\n            return;\n        }\n'''
          if old not in text:
              raise SystemExit('prewarm gate anchor not found')
          text = text.replace(old, new, 1)

          old = '''        if (!ReferenceEquals(requestedPage, page))\n        {\n            BeginActivation(page);\n            if (phase == SoundActivationPhase.Ready)\n            {\n                CompleteActivation(session);\n                return;\n            }\n        }\n'''
          new = '''        if (!ReferenceEquals(requestedPage, page))\n        {\n            BeginActivation(page);\n            if (phase == SoundActivationPhase.Ready)\n                CompleteActivation(session);\n\n            // Never charge the first Sound click for foreground bootstrap work. The page/shell is\n            // published this frame; any unfinished 0.85 ms activation slice starts next frame.\n            return;\n        }\n'''
          if old not in text:
              raise SystemExit('first activation anchor not found')
          text = text.replace(old, new, 1)

          needle = '''    private static void StepPrewarm()\n    {\n'''
          insert = '''    private static bool ShouldPausePrewarm(EditorSession session)\n    {\n        if (session == null) return true;\n        if (session.LegacyTransactions.HasPendingTransaction ||\n            session.Owner?.draggedNode != null ||\n            session.PlacementActive)\n            return true;\n\n        // Background Sound preparation is opportunistic. Yield completely while the developer is\n        // actively pressing a key or mouse button so an indivisible filesystem/XML unit can never\n        // land on top of a drag, edit or shortcut frame.\n        return global::UnityEngine.Input.anyKey;\n    }\n\n'''
          if needle not in text:
              raise SystemExit('StepPrewarm insertion anchor not found')
          text = text.replace(needle, insert + needle, 1)
          pipeline.write_text(text, encoding='utf-8')

      - name: Commit and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/devtool-sound-click-frame-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DevUI/DevTool/Compatibility/SoundPageConstructorOptimization.cs src/DevUI/DevTool/Sound/SoundActivationPipeline.cs .github/workflows/devtool-sound-click-frame-finalize.yml
          git commit -m "DevTool Sound: keep cold work off interaction frames"
          git push origin HEAD:main
