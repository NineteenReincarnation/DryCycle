name: DevTool Self-Hook Guard

on:
  push:
    paths:
      - 'src/DevUI/DevTool/**'
      - '.github/workflows/devtool-self-hook-guard.yml'
  pull_request:
    paths:
      - 'src/DevUI/DevTool/**'
      - '.github/workflows/devtool-self-hook-guard.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject new DevTool RuntimeDetour sites
        shell: python
        run: |
          from pathlib import Path
          import sys

          root = Path('src/DevUI/DevTool')

          # Exact baseline of pre-existing RuntimeDetour sites. RuntimeDetour is still legitimate at
          # vanilla/third-party compatibility boundaries, so this guard deliberately does not call
          # every site a DryCycle self-hook. The baseline prevents new sites from appearing while
          # Native migrations retire DryCycle-on-DryCycle hooks; whenever a site disappears, remove
          # it here in the same change so the debt can only shrink.
          allowed = {
              'Map/PlayerMap/PlayerMapConfigBuildPipeline.cs',
              'Map/PlayerMap/PlayerMapDerivedLayoutBridge.cs',
              'Map/PlayerMap/PlayerMapDisabledConfigFilter.cs',
              'Map/PlayerMap/PlayerMapGroupCommandRuntime.cs',
              'Map/PlayerMap/PlayerMapIncrementalRender.cs',
              'Map/PlayerMap/PlayerMapLayerMutationFilter.cs',
              'Map/PlayerMap/PlayerMapMigrationCommandBridge.cs',
              'Map/PlayerMap/PlayerMapMigrationDirtyBridge.cs',
              'Map/PlayerMap/PlayerMapPlacementBootstrap.cs',
              'Map/PlayerMap/PlayerMapRenderOutputValidator.cs',
              'Map/PlayerMap/PlayerMapRenderPreparation.cs',
              'Map/PlayerMap/PlayerMapRenderRevisionGuard.cs',
              'Map/PlayerMap/PlayerMapTerrainBakeBridge.cs',
              'Preview/EffectPreviewBootstrap.cs',
              'RWImGui/DevToolUserFacingCopyCleanupPlugin.cs',
              'RWImGui/PlayerMapCanvasAuthoringPlugin.cs',
              'RWImGui/PlayerMapConditionalVisibilityInfo.cs',
              'RWImGui/PlayerMapGroupLayerControls.cs',
              'RWImGui/PlayerMapGroupLayoutControls.cs',
              'RWImGui/PlayerMapGroupPlacementControls.cs',
              'RWImGui/PlayerMapLayoutAssistPlugin.cs',
              'RWImGui/PlayerMapLiveOverlapPreview.cs',
              'RWImGui/PlayerMapMigrationStreamView.cs',
              'RWImGui/PlayerMapMultiPipeConnectionPlugin.cs',
              'RWImGui/PlayerMapMultiSelectionPlugin.cs',
              'RWImGui/PlayerMapPreflightPanelPlugin.cs',
              'RWImGui/PlayerMapRenderProgressPlugin.cs',
              'RWImGui/PlayerMapWorkspaceIntegrationPlugin.cs',
              'RWImGui/ScopedScrollChromePlugin.cs',
              'RWImGui/WorldInspectorReadabilityPlugin.cs',
              'RWImGui/WorldSubregionSelector.cs',
              'RWImGui/WorldWorkspaceAsciiDirectionPlugin.cs',
              'World/WorldCreatureLiveReload.cs',
              'World/WorldTopologyLiveTraversalFixPlugin.cs',
          }

          marker = 'MonoMod.RuntimeDetour.Hook'
          actual = set()
          for path in root.rglob('*.cs'):
              text = path.read_text(encoding='utf-8', errors='ignore')
              if marker in text:
                  actual.add(path.relative_to(root).as_posix())

          unexpected = sorted(actual - allowed)
          retired = sorted(allowed - actual)

          if unexpected:
              print('New DevTool RuntimeDetour sites are forbidden. Prefer a direct interface/service/event for DryCycle-owned code:')
              for path in unexpected:
                  print(f'  + {path}')
              sys.exit(1)

          if retired:
              print('RuntimeDetour debt was removed but the guard baseline was not tightened:')
              for path in retired:
                  print(f'  - {path}')
              print('Remove retired entries from devtool-self-hook-guard.yml in the same change.')
              sys.exit(1)

          print(f'Guarded existing RuntimeDetour baseline: {len(actual)} files; no new sites added.')
