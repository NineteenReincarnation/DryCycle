name: DevTool Self-Hook Guard

on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/devtool-self-hook-guard.yml'
  pull_request:
    paths:
      - 'src/DevUI/DevTool/**'
      - '.github/workflows/devtool-self-hook-guard.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject new DevTool RuntimeDetour sites
        shell: python
        run: |
          from pathlib import Path
          import sys

          root = Path('src')

          # Exact baseline of repository source files that contain the RuntimeDetour Hook installation marker.
          # Read-only HookGen discovery is not an installation site. DryCycle-owned code must prefer
          # direct interfaces/services/events; any future external compatibility detour must be added
          # deliberately and reviewed rather than appearing implicitly.
          allowed = set()

          marker = 'MonoMod.RuntimeDetour.Hook'
          actual = set()
          for path in root.rglob('*.cs'):
              text = path.read_text(encoding='utf-8', errors='ignore')
              if marker in text:
                  actual.add(path.relative_to(root).as_posix())

          unexpected = sorted(actual - allowed)
          retired = sorted(allowed - actual)

          if unexpected:
              print('New RuntimeDetour sites are forbidden by default. Prefer a direct interface/service/event for DryCycle-owned code; external compatibility detours require explicit review:')
              for path in unexpected:
                  print(f'  + {path}')
              sys.exit(1)

          if retired:
              print('RuntimeDetour debt was removed but the guard baseline was not tightened:')
              for path in retired:
                  print(f'  - {path}')
              print('Remove retired entries from devtool-self-hook-guard.yml in the same change.')
              sys.exit(1)

          print(f'Guarded repository RuntimeDetour baseline: {len(actual)} files; no new sites added.')
