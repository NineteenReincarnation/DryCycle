name: DevTool Numeric Relationship Migration

on:
  push:
    paths:
      - '.github/workflows/devtool-numeric-relationship-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply relationship migration
        run: python scripts/devtool-numeric-relationship-migrate.py
      - name: Verify shared numeric widget usage
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'DevToolNumericWidgets.SliderFloat' src/DevUI/DevTool/RWImGui/RelationshipEditorView.cs
          ! grep -Fq 'IntensityEdits' src/DevUI/DevTool/RWImGui/RelationshipEditorView.cs
      - name: Commit migration and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/devtool-numeric-relationship-migrate.py .github/workflows/devtool-numeric-relationship-migrate.yml
          git add src/DevUI/DevTool/RWImGui/RelationshipEditorView.cs
          git commit -m 'DevTool: route relationship numeric edits through shared widgets'
          git push origin HEAD:main
