name: Task14 R6 B29 Creature perception extraction

on:
  push:
    branches: [ task14-r6-b1-final ]

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[r6-b29-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r6-b1-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract creature perception scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('src/Creatures/DesertBatfly/DesertBatflyAI.cs')
          text = path.read_text(encoding='utf-8')

          scan_start = text.index('    internal bool Valid(Creature creature)')
          scan_end = text.index('    internal bool IsRememberedPlayer(Player player)')
          scan_block = textwrap.dedent(text[scan_start:scan_end]).rstrip()
          valid_end = scan_block.index('private void ScanCreatures()')
          valid_block = scan_block[:valid_end].rstrip()
          scan_method = scan_block[valid_end:].rstrip()

          perception_lines = [
              'using RWCustom;',
              'using UnityEngine;',
              '',
              'namespace DryCycle.Creatures.DesertBatfly;',
              '',
              '/// <summary>',
              '/// Realized-room creature perception for the Desert Batfly brain.',
              '/// Owns scan cadence, current ordinary danger observation and approach pursuit evidence;',
              '/// it does not own locomotion or behavior arbitration.',
              '/// </summary>',
              'internal sealed class DB_CreaturePerception',
              '{',
              '    private readonly DesertBatflyAI brain;',
              '    private readonly DesertBatfly fly;',
              '    private int scan, pursuit;',
              '',
              '    internal Creature Danger { get; private set; }',
              '',
              '    internal DB_CreaturePerception(DesertBatflyAI brain, DesertBatfly fly)',
              '    {',
              '        this.brain = brain;',
              '        this.fly = fly;',
              '    }',
              '',
              '    internal void Reset()',
              '    {',
              '        Danger = null;',
              '        scan = pursuit = 0;',
              '    }',
              '',
              '    internal void UpdateScan()',
              '    {',
              '        if (++scan < 8) return;',
              '        scan = 0;',
              '        ScanCreatures();',
              '    }',
              ''
          ]

          scan_method = scan_method.replace('danger = null;', 'Danger = null;', 1)
          scan_method = scan_method.replace('combat.BeginCandidateScan();', 'brain.Combat.BeginCandidateScan();')
          scan_method = scan_method.replace('danger = creature;', 'Danger = creature;')
          scan_method = scan_method.replace('IsTraumatizedPlayer(player)', 'brain.IsTraumatizedPlayer(player)')
          scan_method = scan_method.replace('IsRememberedPlayer(player)', 'brain.IsRememberedPlayer(player)')
          scan_method = scan_method.replace('DisturbedByApproach(player);', 'brain.DisturbedByApproach(player);')
          scan_method = scan_method.replace('combat.ConsiderCandidate(creature, distance);', 'brain.Combat.ConsiderCandidate(creature, distance);')
          scan_method = scan_method.replace('combat.CompleteCandidateScan(retreat > 0);', 'brain.Combat.CompleteCandidateScan(brain.RetreatActive);')

          body = textwrap.indent(valid_block + '\n\n' + scan_method, '    ')
          perception_text = '\n'.join(perception_lines) + body + '\n}\n'
          Path('src/Creatures/DesertBatfly/Perception/DB_CreaturePerception.cs').write_text(
              perception_text, encoding='utf-8')

          text = text[:scan_start] + '    internal bool Valid(Creature creature) => perception.Valid(creature);\n\n' + text[scan_end:]
          text = text.replace(
              '    private readonly DB_CombatRuntime combat;\n    internal DB_CombatRuntime Combat => combat;\n',
              '    private readonly DB_CombatRuntime combat;\n    private readonly DB_CreaturePerception perception;\n    internal DB_CombatRuntime Combat => combat;\n    internal DB_CreaturePerception Perception => perception;\n', 1)
          text = text.replace(
              '    internal bool HasImmediateDanger => danger != null || retreat > 0 || Mode == Activity.Escape;\n',
              '    internal bool HasImmediateDanger => perception.Danger != null || retreat > 0 || Mode == Activity.Escape;\n', 1)
          text = text.replace('    private Creature danger;\n    private int retreat, ticks, scan, pursuit;\n', '    private int retreat, ticks;\n', 1)
          text = text.replace(
              '        combat = new DB_CombatRuntime(this, fly);\n',
              '        combat = new DB_CombatRuntime(this, fly);\n        perception = new DB_CreaturePerception(this, fly);\n', 1)
          text = text.replace('        danger = null;\n        retreat = pursuit = 0;\n', '        perception.Reset();\n        retreat = 0;\n', 1)
          text = text.replace(
              '        if (++scan >= 8)\n        {\n            scan = 0;\n            ScanCreatures();\n        }\n',
              '        perception.UpdateScan();\n', 1)
          text = text.replace('danger != null', 'perception.Danger != null')
          text = text.replace('danger == null', 'perception.Danger == null')
          text = text.replace('danger.mainBodyChunk', 'perception.Danger.mainBodyChunk')
          text = text.replace('    private void DisturbedByApproach(Creature source)', '    internal void DisturbedByApproach(Creature source)', 1)
          marker = '    internal Creature Target => combat.Target;\n'
          text = text.replace(marker, marker + '    internal bool RetreatActive => retreat > 0;\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate perception boundary
        shell: bash
        run: |
          set -euo pipefail
          ai=src/Creatures/DesertBatfly/DesertBatflyAI.cs
          perception=src/Creatures/DesertBatfly/Perception/DB_CreaturePerception.cs
          test -f "$perception"
          grep -q 'internal sealed class DB_CreaturePerception' "$perception"
          grep -q 'internal Creature Danger' "$perception"
          grep -q 'internal void UpdateScan' "$perception"
          grep -q 'DB_RoomContext context' "$perception"
          grep -q 'DB_VisibilityPolicy.CanObserve' "$perception"
          grep -q 'brain.Combat.BeginCandidateScan' "$perception"
          grep -q 'brain.Combat.CompleteCandidateScan(brain.RetreatActive)' "$perception"
          grep -q 'private readonly DB_CreaturePerception perception' "$ai"
          grep -q 'perception = new DB_CreaturePerception(this, fly)' "$ai"
          grep -q 'perception.UpdateScan()' "$ai"
          grep -q 'perception.Danger' "$ai"
          ! grep -q 'private void ScanCreatures' "$ai"
          ! grep -q 'DB_RoomContext context' "$ai"
          ! grep -q 'DB_VisibilityPolicy.CanObserve' "$ai"
          ! grep -n 'mainBodyChunk.vel[[:space:]]*=' "$perception"
          ! grep -n '\.localGoal[[:space:]]*=' "$perception"
          git grep -q 'DCDesertBatflyV1' -- src tests
          git grep -q 'DCDesertBatflyThreatV1' -- src tests
          git grep -q 'DCBATCOLONY09<svB>' -- src tests
          git grep -q 'DESERTSWARMROOM' -- src tests
          bash scripts/check-desertbatfly-r5-retention.sh
          bash scripts/check-desertbatfly-r6-b1.sh
          git diff --check
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/task14-r6-b29-creature-perception.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R6 B29 extract Creature perception [r6-b29-done]'
          git push origin HEAD:task14-r6-b1-final
