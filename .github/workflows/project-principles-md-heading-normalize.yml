name: Project principles Markdown heading normalization

on:
  push:
    branches:
      - task14-r6-b1-final

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize Markdown heading hierarchy
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('docs/项目原则/DryCycle_项目结构与代码原则.md')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'^# ([1-8]\. .+)$', r'## \1', text, flags=re.MULTILINE)
          text = re.sub(r'^## ([1-8]\.\d+ .+)$', r'### \1', text, flags=re.MULTILINE)
          text = text.replace('### 单文件叶子目录', '#### 单文件叶子目录')
          path.write_text(text, encoding='utf-8', newline='\n')

          lines = text.splitlines()
          h1 = [line for line in lines if line.startswith('# ') and not line.startswith('## ')]
          if h1 != ['# DryCycle 项目结构与代码原则']:
              raise SystemExit(f'Expected exactly one document H1, got: {h1}')

      - name: Commit Markdown hierarchy
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'docs/项目原则/DryCycle_项目结构与代码原则.md'
          git commit -m 'docs: normalize project principles Markdown hierarchy'
          git push origin HEAD:task14-r6-b1-final
