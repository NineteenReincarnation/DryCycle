name: DevTool Frontend Work Gate Pass
on:
  push:
    paths:
      - '.github/workflows/devtool-workgate-pass.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/devtool-frontend-stable-frame
      - name: Apply work gates and retained scene geometry
        shell: python
        run: |
          from pathlib import Path

          bridge = Path('src/DevUI/DevTool/RWImGui/BridgePlugin.cs')
          s = bridge.read_text()
          old = '''                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.FontSettings))
                        FontSettingsWindow.Draw(io.DisplaySize);
                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.Overlay))
                        DevToolOverlay.Draw(snapshot);
                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.SceneWorkspace))
                        SceneWorkspaceWindow.Draw(snapshot, io.DisplaySize);
                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.ScenePlacement))
                        ScenePlacementWindow.Draw(snapshot, io.DisplaySize);
                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.ActionToast))
                        ActionToastOverlay.Draw(snapshot, io.DisplaySize);'''
          new = '''                    // Gate optional surfaces before entering their measurement scopes. Besides avoiding the
                    // draw call itself, this keeps the stable frame free of stopwatch/timing work for windows
                    // that are structurally unable to render in the current presentation state.
                    if (snapshot.Hydrated && snapshot.ToolMode != EditorToolMode.Map)
                    {
                        using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.FontSettings))
                            FontSettingsWindow.Draw(io.DisplaySize);
                    }
                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.Overlay))
                        DevToolOverlay.Draw(snapshot);
                    if (!snapshot.FocusMode && DevToolUiSettings.SceneInCenter && ScenePlacementWindow.Supports(snapshot.ToolMode))
                    {
                        using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.SceneWorkspace))
                            SceneWorkspaceWindow.Draw(snapshot, io.DisplaySize);
                    }
                    if (!snapshot.FocusMode && ScenePlacementWindow.Supports(snapshot.ToolMode))
                    {
                        using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.ScenePlacement))
                            ScenePlacementWindow.Draw(snapshot, io.DisplaySize);
                    }
                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.ActionToast))
                        ActionToastOverlay.Draw(snapshot, io.DisplaySize);'''
          assert old in s
          bridge.write_text(s.replace(old, new))

          scene = Path('src/DevUI/DevTool/RWImGui/SceneWorkspaceWindow.cs')
          s = scene.read_text()
          anchor = '''    private static string statusText = string.Empty;\n'''
          fields = '''    private static string statusText = string.Empty;

    // Window geometry and stable presentation strings depend only on display size, UI scale and
    // language. Retain them across stable frames instead of repeating layout math and localization.
    private static bool windowProjectionValid;
    private static Num.Vector2 projectedWindowDisplay;
    private static float projectedWindowScale;
    private static bool projectedWindowChinese;
    private static Num.Vector2 projectedWindowPosition;
    private static Num.Vector2 projectedWindowSize;
    private static Num.Vector2 projectedWindowMinSize;
    private static Num.Vector2 projectedWindowMaxSize;
    private static float projectedWindowFontScale;
    private static string projectedWindowTitle = string.Empty;
'''
          assert anchor in s
          s = s.replace(anchor, fields, 1)
          old_geom = '''        float scale = Math.Max(0.78f, Math.Min(2.2f, DevToolUiSettings.UiScale));
        float width = Math.Min(
            Math.Max(500f, display.X * 0.34f),
            Math.Max(420f, Math.Min(760f * Math.Min(1.20f, scale), display.X - 32f)));
        float height = Math.Min(
            Math.Max(420f, display.Y * 0.56f),
            Math.Max(320f, Math.Min(680f * Math.Min(1.12f, scale), display.Y - 80f)));
        Num.Vector2 pos = new(
            Math.Max(8f, (display.X - width) * 0.5f),
            Math.Max(62f, (display.Y - height) * 0.52f));

        ImGui.SetNextWindowPos(pos, ImGuiCond.FirstUseEver);
        ImGui.SetNextWindowSize(new Num.Vector2(width, height), ImGuiCond.FirstUseEver);
        ImGui.SetNextWindowSizeConstraints(
            new Num.Vector2(420f, 300f),
            new Num.Vector2(Math.Max(420f, display.X - 16f), Math.Max(300f, display.Y - 16f)));
        ImGui.SetNextWindowBgAlpha(DevToolUiSettings.WindowAlpha);

        string title = DevToolUiSettings.T("场景###DevToolSceneWorkspace", "Scene###DevToolSceneWorkspace");
        if (!ImGui.Begin(title, ImGuiWindowFlags.NoCollapse))'''
          new_geom = '''        EnsureWindowProjection(display);

        ImGui.SetNextWindowPos(projectedWindowPosition, ImGuiCond.FirstUseEver);
        ImGui.SetNextWindowSize(projectedWindowSize, ImGuiCond.FirstUseEver);
        ImGui.SetNextWindowSizeConstraints(projectedWindowMinSize, projectedWindowMaxSize);
        ImGui.SetNextWindowBgAlpha(DevToolUiSettings.WindowAlpha);

        if (!ImGui.Begin(projectedWindowTitle, ImGuiWindowFlags.NoCollapse))'''
          assert old_geom in s
          s = s.replace(old_geom, new_geom, 1)
          s = s.replace('''        ImGui.SetWindowFontScale(DevToolUiSettings.IsChinese ? 1.18f : 1.12f);''', '''        ImGui.SetWindowFontScale(projectedWindowFontScale);''', 1)
          reset_anchor = '''        statusText = string.Empty;\n    }\n\n    private static void DrawObjectScene'''
          reset_new = '''        statusText = string.Empty;
        windowProjectionValid = false;
        projectedWindowTitle = string.Empty;
    }

    private static void EnsureWindowProjection(Num.Vector2 display)
    {
        float scale = Math.Max(0.78f, Math.Min(2.2f, DevToolUiSettings.UiScale));
        bool chinese = DevToolUiSettings.IsChinese;
        if (windowProjectionValid && projectedWindowDisplay == display &&
            Math.Abs(projectedWindowScale - scale) < 0.0001f && projectedWindowChinese == chinese)
            return;

        float width = Math.Min(
            Math.Max(500f, display.X * 0.34f),
            Math.Max(420f, Math.Min(760f * Math.Min(1.20f, scale), display.X - 32f)));
        float height = Math.Min(
            Math.Max(420f, display.Y * 0.56f),
            Math.Max(320f, Math.Min(680f * Math.Min(1.12f, scale), display.Y - 80f)));

        projectedWindowDisplay = display;
        projectedWindowScale = scale;
        projectedWindowChinese = chinese;
        projectedWindowPosition = new Num.Vector2(
            Math.Max(8f, (display.X - width) * 0.5f),
            Math.Max(62f, (display.Y - height) * 0.52f));
        projectedWindowSize = new Num.Vector2(width, height);
        projectedWindowMinSize = new Num.Vector2(420f, 300f);
        projectedWindowMaxSize = new Num.Vector2(Math.Max(420f, display.X - 16f), Math.Max(300f, display.Y - 16f));
        projectedWindowFontScale = chinese ? 1.18f : 1.12f;
        projectedWindowTitle = DevToolUiSettings.T("场景###DevToolSceneWorkspace", "Scene###DevToolSceneWorkspace");
        windowProjectionValid = true;
    }

    private static void DrawObjectScene'''
          assert reset_anchor in s
          scene.write_text(s.replace(reset_anchor, reset_new, 1))
      - name: Remove bootstrap workflow
        run: rm .github/workflows/devtool-workgate-pass.yml
      - name: Commit pass
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Gate inactive frontend work and cache scene geometry"
          git push origin HEAD:perf/devtool-frontend-stable-frame