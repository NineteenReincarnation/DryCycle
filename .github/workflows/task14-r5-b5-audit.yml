name: Task14 R5 B5 retention audit

on:
  push:
    branches:
      - task14-r5-b5-working

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r5-b5-working
          fetch-depth: 0

      - name: Audit remaining bridge files
        run: |
          echo '=== DesertBatfly *Bridge.cs ==='
          find src/Creatures/DesertBatfly -type f -name '*Bridge.cs' -print | sort || true
          echo '=== Bridge identifiers ==='
          grep -RIn --include='*.cs' 'class .*Bridge\|DesertBatfly.*Bridge' src/Creatures/DesertBatfly || true

      - name: Audit RuntimeDetour and Reflection
        run: |
          echo '=== RuntimeDetour imports ==='
          grep -RIl --include='*.cs' 'MonoMod.RuntimeDetour' src/Creatures/DesertBatfly | sort || true
          echo '=== Reflection imports ==='
          grep -RIl --include='*.cs' 'System.Reflection' src/Creatures/DesertBatfly | sort || true
          echo '=== RuntimePatch callers ==='
          grep -RIn --include='*.cs' 'DesertBatflyRuntimePatch' src/Creatures/DesertBatfly || true

      - name: Verify B1-B4 deleted types stay absent
        run: |
          for name in \
            DesertBatflyEnvironmentalDenseFogBridge \
            DesertBatflyEnvironmentalVengeanceBridge \
            DesertBatflyThreatVengeanceBridge \
            DesertBatflyEnvironmentalIntegration \
            DesertBatflyEnvironmentalSocialBridge \
            DesertBatflyEnvironmentalTask09Bridge \
            DesertBatflyEnvironmentalSurvivalBridge \
            DesertBatflySignalIntegration \
            DesertBatflySignalAcuteBridge \
            DesertBatflySignalDirectWitnessBridge \
            DesertBatflySignalThreatBridge \
            DesertBatflySignalVengeanceBridge; do
            if grep -RIn --include='*.cs' "$name" src tests; then
              echo "stale deleted type reference: $name"
              exit 1
            fi
          done

      - name: Verify B3 function retention
        run: |
          grep -q 'ApplySecondaryLightRainMoisture(bat, state, tick)' src/Creatures/DesertBatfly/Environmental/DesertBatflyEnvironmentalBehavior.cs
          grep -q 'ApplyNativeHomeAndBurrow(bat, state.Influence)' src/Creatures/DesertBatfly/Environmental/DesertBatflyEnvironmentalBehavior.cs
          grep -q 'ObserveLocalShelterFailure(state)' src/Creatures/DesertBatfly/Environmental/DesertBatflyEnvironmentalRoomRuntime.cs
          grep -q 'DB_EnvironmentalPolicy.ShouldSuppressNewMigration(world, source)' src/Creatures/DesertBatfly/DesertBatflyColonyRuntime.cs
          grep -q 'DB_EnvironmentalPolicy.ShouldRecallHomeForSandstorm' src/Creatures/DesertBatfly/DesertBatflyTravelNavigation.cs
          grep -q 'DB_EnvironmentalPolicy.CanConsiderSandstormOutwardRefuge' src/Creatures/DesertBatfly/DesertBatflyRefuge.cs
          grep -q 'DB_EnvironmentalPolicy.AcceptSandstormEmergencyRefuge' src/Creatures/DesertBatfly/DesertBatflyRefuge.cs
          ! grep -RIn --include='*.cs' 'LeaveRoom(' src/Creatures/DesertBatfly/Environmental
          ! grep -RIn --include='*.cs' 'new TravelIntent\|RequestPermanentMigration\|ConvertToReturnHome' src/Creatures/DesertBatfly/Environmental

      - name: Verify B4 function retention
        run: |
          grep -q 'ThreatenedAt(' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          grep -q 'DesertBatflySignalRuntime.EmitAlarm' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          grep -q 'receiver.DesertAI.ThreatenedAt(threat, packet.Origin, false, false)' src/Creatures/DesertBatfly/Signals/DesertBatflySignalRuntime.cs
          grep -q 'DesertBatflyThreatMemoryStore.For(receiver.DesertState, slot)' src/Creatures/DesertBatfly/Signals/DesertBatflySignalRuntime.cs
          grep -q 'DesertBatflySignalRuntime.EmitAcuteAlarm' src/Creatures/DesertBatfly/ThreatSignature/DesertBatflyThreatRuntime.cs
          grep -q 'DesertBatflySignalRuntime.EmitDistress' src/Creatures/DesertBatfly/Runtime/DB_EventConsumers.cs
          grep -q 'DesertBatflySignalRuntime.EmitAlarm' src/Creatures/DesertBatfly/Runtime/DB_EventConsumers.cs
          grep -q 'DesertBatflySignalRuntime.TryGetInfluence(fly' src/Creatures/DesertBatfly/Combat/DB_CombatRuntime.cs
          grep -q 'DesertBatflySignalRuntime.TryGetInfluence(bat' src/Creatures/DesertBatfly/Social/DesertBatflySocialLife.cs
          grep -q 'IsDirectDeathWitness(observer, victim, killer)' src/Creatures/DesertBatfly/DesertBatflySocialBond.cs
          grep -q 'DesertBatflySignalRuntime.EmitRally' src/Creatures/DesertBatfly/DesertBatflyIntimidation.cs
          ! grep -RIn --include='*.cs' 'DesertBatflyThreatMemoryStore.AddEvidence' src/Creatures/DesertBatfly/Signals
          ! grep -RIn --include='*.cs' 'LeaveRoom(' src/Creatures/DesertBatfly/Signals

      - name: Verify RuntimePatch external-compatibility boundary
        run: |
          mapfile -t callers < <(grep -RIl --include='*.cs' 'DesertBatflyRuntimePatch' src/Creatures/DesertBatfly | sort)
          printf '%s\n' "${callers[@]}"
          test "${#callers[@]}" -eq 2
          printf '%s\n' "${callers[@]}" | grep -qx 'src/Creatures/DesertBatfly/DesertBatflyRuntimePatch.cs'
          printf '%s\n' "${callers[@]}" | grep -qx 'src/Creatures/DesertBatfly/DesertBatflyWarpCompatibility.cs'
          grep -q 'DesertBatflyWarpCompatibility.Enable()' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          grep -q 'DesertBatflyWarpCompatibility.Disable()' src/Creatures/DesertBatfly/DesertBatflyHooks.cs

      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD || true
