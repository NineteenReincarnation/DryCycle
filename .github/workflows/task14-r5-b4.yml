name: Task14 R5 B4 direct signals

on:
  push:
    branches:
      - task14-r5-b4-working

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Trigger R5 B4 direct signals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r5-b4-working
          fetch-depth: 0

      - name: Apply guarded migration
        run: python scripts/task14_r5_b4_apply.py

      - name: Validate direct Task12 architecture
        run: |
          git diff --check
          test ! -e scripts/task14_r5_b4_apply.py
          test ! -e .github/workflows/task14-r5-b4.yml
          test ! -e src/Creatures/DesertBatfly/Signals/DesertBatflySignalIntegration.cs
          test ! -e src/Creatures/DesertBatfly/Signals/DesertBatflySignalAcuteBridge.cs
          test ! -e src/Creatures/DesertBatfly/Signals/DesertBatflySignalDirectWitnessBridge.cs
          test ! -e src/Creatures/DesertBatfly/Signals/DesertBatflySignalThreatBridge.cs
          test ! -e src/Creatures/DesertBatfly/Signals/DesertBatflySignalVengeanceBridge.cs
          ! grep -RIn --include='*.cs' 'DesertBatflySignalIntegration\|DesertBatflySignalAcuteBridge\|DesertBatflySignalDirectWitnessBridge\|DesertBatflySignalThreatBridge\|DesertBatflySignalVengeanceBridge' src tests
          ! grep -RIn --include='*.cs' 'MonoMod.RuntimeDetour\|System.Reflection\|System.Reflection.Emit' src/Creatures/DesertBatfly/Signals
          grep -q 'receiver.DesertAI.ThreatenedAt(threat, packet.Origin, false, false)' src/Creatures/DesertBatfly/Signals/DesertBatflySignalRuntime.cs
          grep -q 'DesertBatflyThreatMemoryStore.For(receiver.DesertState, slot)' src/Creatures/DesertBatfly/Signals/DesertBatflySignalRuntime.cs
          grep -q 'DesertBatflySignalRuntime.TryGetInfluence(fly' src/Creatures/DesertBatfly/Combat/DB_CombatRuntime.cs
          grep -q 'DesertBatflySignalRuntime.TryGetInfluence(bat' src/Creatures/DesertBatfly/Social/DesertBatflySocialLife.cs
          grep -q 'IsDirectDeathWitness' src/Creatures/DesertBatfly/DesertBatflySocialBond.cs
          grep -q 'DesertBatflySignalRuntime.EmitRally' src/Creatures/DesertBatfly/DesertBatflyIntimidation.cs
          grep -q 'DesertBatflySignalRuntime.EmitAcuteAlarm' src/Creatures/DesertBatfly/ThreatSignature/DesertBatflyThreatRuntime.cs

      - name: Verify Task12 information boundary
        run: |
          ! grep -RIn --include='*.cs' 'DesertBatflyThreatMemoryStore.AddEvidence' src/Creatures/DesertBatfly/Signals
          ! grep -RIn --include='*.cs' 'BodyChunk.vel\|mainBodyChunk.vel[[:space:]]*=' src/Creatures/DesertBatfly/Signals
          ! grep -RIn --include='*.cs' 'UnityEngine.Input' src/Creatures/DesertBatfly/Signals
          ! grep -RIn --include='*.cs' 'new TravelIntent\|LeaveRoom(' src/Creatures/DesertBatfly/Signals

      - name: Audit remaining R5 debt
        run: |
          echo '--- remaining DesertBatfly Bridge files ---'
          find src/Creatures/DesertBatfly -type f -name '*Bridge.cs' | sort || true
          echo '--- remaining DesertBatfly RuntimeDetour imports ---'
          grep -RIl --include='*.cs' 'MonoMod.RuntimeDetour' src/Creatures/DesertBatfly | sort || true
          echo '--- remaining DesertBatfly reflection imports ---'
          grep -RIl --include='*.cs' 'System.Reflection' src/Creatures/DesertBatfly | sort || true

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+NineteenReincarnation@users.noreply.github.com'
          rm -f .github/task14-r5-b4-trigger
          git add -A
          git commit -m 'Replace signal detours with direct domain APIs'
          git push origin HEAD:task14-r5-b4-working
