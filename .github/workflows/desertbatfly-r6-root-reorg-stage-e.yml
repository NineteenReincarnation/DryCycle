name: DesertBatfly R6 Root Reorg Stage E

on:
  push:
    branches:
      - task14-r6-b1-final
    paths:
      - '.github/workflows/desertbatfly-r6-root-reorg-stage-e.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Relocate creature host without type or behavior changes
        shell: bash
        run: |
          set -euo pipefail
          old='src/Creatures/DesertBatfly/DesertBatfly.cs'
          new='src/Creatures/DesertBatfly/Core/DB_Creature.cs'
          test -f "$old"
          test ! -e "$new"

          before_hash="$(sha256sum "$old" | awk '{print $1}')"
          before_bytes="$(wc -c < "$old")"
          before_lines="$(wc -l < "$old")"
          echo "creature host before: hash=$before_hash bytes=$before_bytes lines=$before_lines"

          mkdir -p "$(dirname "$new")"
          mv "$old" "$new"

          after_hash="$(sha256sum "$new" | awk '{print $1}')"
          after_bytes="$(wc -c < "$new")"
          after_lines="$(wc -l < "$new")"
          test "$before_hash" = "$after_hash"
          test "$before_bytes" = "$after_bytes"
          test "$before_lines" = "$after_lines"

          # Retention scripts follow the file relocation only. The C# type deliberately remains
          # DesertBatfly in this tranche so namespace/external identity cannot be accidentally rewritten.
          python3 - <<'PY'
          from pathlib import Path
          old = 'src/Creatures/DesertBatfly/DesertBatfly.cs'
          new = 'src/Creatures/DesertBatfly/Core/DB_Creature.cs'
          for path in Path('scripts').rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  print('updated retention path:', path)
          PY

          test ! -e "$old"
          test -f "$new"

          # Exact host/lifecycle surface retained.
          grep -q 'internal sealed class DesertBatfly : Fly, IPlayerEdible' "$new"
          grep -q 'internal readonly DB_AI DesertAI;' "$new"
          grep -q 'internal readonly DB_Runtime Runtime;' "$new"
          grep -q 'internal readonly DB_SandSpitRuntime SandSpit;' "$new"
          grep -q 'public override void NewRoom(Room newRoom)' "$new"
          grep -q 'public override void PlaceInRoom(Room placeRoom)' "$new"
          grep -q 'public override void Update(bool eu)' "$new"
          grep -q 'public override void Violence(' "$new"
          grep -q 'public override void Grabbed(Grasp grasp)' "$new"
          grep -q 'void IPlayerEdible.BitByPlayer' "$new"
          grep -q 'public override void Die()' "$new"
          grep -q 'public override void Destroy()' "$new"

          # Rock non-finishing semantics and canonical mortality/capture event ownership stay present.
          grep -q 'RockSurvivalHealthFloor = 0.01f' "$new"
          grep -q 'resolvingRockViolence' "$new"
          grep -q 'DB_EventHub.RecordConsumptionAttribution' "$new"
          grep -q 'DB_FearRuntime.IsSupportedLethalThreat' "$new"
          grep -q 'DB_FearRuntime.Forget(this)' "$new"

          # The external species identity is intentionally untouched in this tranche.
          grep -q 'namespace DryCycle.Creatures.DesertBatfly;' "$new"
          grep -q 'internal sealed class DesertBatfly' "$new"

          # Earlier Fear/Vengeance and AI migrations must remain intact.
          test -f src/Creatures/DesertBatfly/Behavior/DB_AI.cs
          test -f src/Creatures/DesertBatfly/Behavior/Fear/DB_FearRuntime.cs
          test -f src/Creatures/DesertBatfly/Behavior/Vengeance/DB_VengeanceRuntime.cs
          test ! -e src/Creatures/DesertBatfly/DesertBatflyAI.cs
          test ! -e src/Creatures/DesertBatfly/DesertBatflyIntimidation.cs

          bash scripts/check-desertbatfly-r6-b1.sh

          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          patterns = (
              re.compile(r'\bTask\s*[-_]?\s*\d+\b', re.IGNORECASE),
              re.compile(r'\bTask-number\b', re.IGNORECASE),
          )
          bad=[]
          for path in sorted(Path('src/Creatures/DesertBatfly').rglob('*.cs')):
              for no,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if any(p.search(line) for p in patterns): bad.append((path,no,line.strip()))
          if bad:
              for row in bad: print(f'{row[0]}:{row[1]}: {row[2]}')
              sys.exit(1)
          PY

          # Root now contains domain directories only; no production C# stragglers.
          echo 'Root production C# files:'
          find src/Creatures/DesertBatfly -maxdepth 1 -type f -name '*.cs' -printf '%f\n' | sort
          test "$(find src/Creatures/DesertBatfly -maxdepth 1 -type f -name '*.cs' | wc -l)" -eq 0

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts
          git commit -m 'R6 B37 relocate creature host to Core [r6-b37-done]'
          git push origin HEAD:task14-r6-b1-final
