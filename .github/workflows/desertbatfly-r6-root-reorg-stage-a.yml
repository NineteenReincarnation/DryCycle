name: DesertBatfly R6 Root Reorg Stage A

on:
  push:
    branches:
      - task14-r6-b1-final
    paths:
      - '.github/workflows/desertbatfly-r6-root-reorg-stage-a.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move Intimidation to Fear domain without behavior changes
        shell: bash
        run: |
          set -euo pipefail
          old='src/Creatures/DesertBatfly/DesertBatflyIntimidation.cs'
          new='src/Creatures/DesertBatfly/Behavior/Fear/DB_FearRuntime.cs'
          test -f "$old"
          test ! -e "$new"
          mkdir -p "$(dirname "$new")"
          git mv "$old" "$new"

          python3 - <<'PY'
          from pathlib import Path
          roots = [Path('src'), Path('tests')]
          changed = []
          for root in roots:
              for path in root.rglob('*.cs'):
                  text = path.read_text(encoding='utf-8')
                  new = text.replace('DesertBatflyIntimidation', 'DB_FearRuntime')
                  new = new.replace('Task12LegacyIndirectFearSuppressed', 'LegacyIndirectFearSuppressed')
                  if new != text:
                      path.write_text(new, encoding='utf-8')
                      changed.append(path.as_posix())
          print('updated files:', len(changed))
          for path in changed:
              print(path)
          PY

          test ! -e "$old"
          test -f "$new"
          grep -q 'internal static class DB_FearRuntime' "$new"
          if git grep -n 'DesertBatflyIntimidation' -- 'src/**/*.cs' 'tests/**/*.cs'; then
            echo 'old Intimidation identity remains' >&2
            exit 1
          fi
          if git grep -n 'Task12LegacyIndirectFearSuppressed' -- 'src/**/*.cs'; then
            echo 'legacy Task trace key remains' >&2
            exit 1
          fi
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'R6 B35a move intimidation runtime into Fear domain [r6-b35a-done]'
          git push origin HEAD:task14-r6-b1-final
