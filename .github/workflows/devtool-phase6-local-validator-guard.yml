name: DevTool Phase 6 Local Validator Guard

permissions:
  contents: write

on:
  pull_request:
    paths:
      - 'scripts/validate-devtool-phase6-local.ps1'
      - '.github/workflows/devtool-phase6-local-validator-guard.yml'
  push:
    paths:
      - 'scripts/validate-devtool-phase6-local.ps1'
      - '.github/workflows/devtool-phase6-local-validator-guard.yml'

jobs:
  validator-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit verified real-compile fix
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/devtool-phase6-final-architecture'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          legacy = Path('src/DevUI/DevTool/Compatibility/LegacyUiPresentationController.cs')
          text = legacy.read_text(encoding='utf-8')
          start_token = '// Compatibility verification is diagnostic work, not presentation work.'
          call_token = 'DevUiFullAudit.ObserveAll(page);'
          start_at = text.find(start_token)
          call_at = text.find(call_token, start_at if start_at >= 0 else 0)
          if start_at < 0 or call_at < 0:
              raise SystemExit('verified LegacyUiPresentationController markers were not found')
          line_start = text.rfind('\n', 0, start_at) + 1
          line_end = text.find('\n', call_at)
          if line_end < 0:
              line_end = len(text)
          else:
              line_end += 1
              if line_end < len(text) and text[line_end:line_end + 1] == '\n':
                  line_end += 1
          legacy.write_text(text[:line_start] + text[line_end:], encoding='utf-8')

          guard = Path('scripts/validate-devtool-final-architecture.sh')
          text = guard.read_text(encoding='utf-8')
          marker = '''if grep -Fq 'UniversalDevUiPresentationHub.Publish(session.Owner)' "$coordinator"; then
            echo "Coordinator must not split diagnostic publication ownership from DevUiDiagnosticsPublisher." >&2
            exit 1
          fi
          '''
          addition = marker + '''if grep -Fq 'DevUiFullAudit.ObserveAll(' "$legacy_controller"; then
            echo "LegacyUiPresentationController must not run FullAudit directly; diagnostics are owned by DevUiDiagnosticsPublisher." >&2
            exit 1
          fi
          '''
          if marker not in text:
              raise SystemExit('architecture guard insertion point was not found')
          guard.write_text(text.replace(marker, addition, 1), encoding='utf-8')

          phase = Path('src/DevUI/DevTool/PHASE6.md')
          text = phase.read_text(encoding='utf-8')
          text = text.replace(
              '当前静态架构守卫和全量 diff 终审已经完成。剩余验证全部依赖真实运行环境：\n\n1. 使用实际 Rain World / HookGen / RuntimeDetour / RWImGui 引用完成 `DryCycle.dll` + `DryCycle.DevTool.RWImGui.dll` 联编。\n2. Rain World 内基本回归：',
              '当前静态架构守卫、全量 diff 终审和真实联编已经完成。真实 `net48` 编译使用实际 Rain World / HookGen / Unity / RWImGui 程序集完成；`DryCycle.dll` 与 `DryCycle.DevTool.RWImGui.dll` 均为 **0 warning / 0 error**。\n\n剩余验证只依赖真实 Rain World 运行环境：\n\n1. Rain World 内基本回归：')
          text = text.replace('3. 性能回归：确认稳定帧没有重新出现整表扫描、重复 Snapshot rebuild 或重复 Synchronize。', '2. 性能回归：确认稳定帧没有重新出现整表扫描、重复 Snapshot rebuild 或重复 Synchronize。')
          text = text.replace(
              '当前可用上传依赖只覆盖 BepInEx、RuntimeDetour、Cecil、UnityEngine/Core/Input、Unity.Mathematics 等一部分真实运行库；完整联编仍缺 `PUBLIC-Assembly-CSharp.dll`、`HOOKS-Assembly-CSharp.dll`、`Assembly-CSharp-firstpass.dll`、部分 Unity 模块以及 RWImGui 运行库。因此目前继续把“静态守卫通过”和“真实游戏联编/回归通过”严格分开。',
              '真实联编依赖现已补齐并完成验证。编译通过只证明程序集/源码边界成立，仍不替代 Rain World 内功能回归和稳定帧性能回归。')
          text = text.replace('**第六阶段：约 90%。**', '**第六阶段：约 98%。**')
          text = text.replace(
              '- Final Architecture Guard 已覆盖主要冻结边界并持续通过。',
              '- Final Architecture Guard 已覆盖主要冻结边界并持续通过。\n- 使用真实 Rain World / HookGen / Unity / RWImGui 引用完成 `DryCycle.dll` 与 `DryCycle.DevTool.RWImGui.dll` 的 `net48` 联编，两者均 0 warning / 0 error。')
          text = text.replace('剩余约 10% 不再是架构重构，而是真实环境验证：', '剩余约 2% 不再是架构重构，而是 Rain World 游戏内验证：')
          text = text.replace(
              '1. 完整联编。\n2. Rain World 游戏内功能/兼容回归。\n3. 稳定帧性能回归。\n4. 验证完成后再决定是否把 PR 从 Draft 转为 Ready for Review；未经明确指示不合并。',
              '1. Rain World 游戏内功能/兼容回归。\n2. 稳定帧性能回归。\n3. 验证完成后再决定是否把 PR 从 Draft 转为 Ready for Review；未经明确指示不合并。')
          phase.write_text(text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/DevUI/DevTool/Compatibility/LegacyUiPresentationController.cs \
            scripts/validate-devtool-final-architecture.sh \
            src/DevUI/DevTool/PHASE6.md
          git diff --cached --check
          git commit -m 'Fix Phase 6 diagnostics compile path and record real build validation'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Parse local validation script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/validate-devtool-phase6-local.ps1'),
            [ref]$tokens,
            [ref]$errors)

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

          Write-Host 'Phase 6 local validator PowerShell syntax passed.'

      - name: Prepare synthetic validation environment
        shell: bash
        run: |
          set -euo pipefail
          rw="$RUNNER_TEMP/fake-rain-world"
          imgui="$RUNNER_TEMP/fake-rwimgui"
          fakebin="$RUNNER_TEMP/fake-bin"

          mkdir -p \
            "$rw/BepInEx/core" \
            "$rw/BepInEx/utils" \
            "$rw/BepInEx/plugins" \
            "$rw/RainWorld_Data/Managed" \
            "$imgui" \
            "$fakebin"

          touch \
            "$rw/BepInEx/core/BepInEx.dll" \
            "$rw/BepInEx/core/MonoMod.RuntimeDetour.dll" \
            "$rw/BepInEx/core/MonoMod.Utils.dll" \
            "$rw/BepInEx/core/Mono.Cecil.dll" \
            "$rw/BepInEx/utils/PUBLIC-Assembly-CSharp.dll" \
            "$rw/BepInEx/plugins/HOOKS-Assembly-CSharp.dll" \
            "$rw/RainWorld_Data/Managed/Assembly-CSharp-firstpass.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.CoreModule.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.AssetBundleModule.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.AudioModule.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.InputLegacyModule.dll" \
            "$rw/RainWorld_Data/Managed/Unity.Mathematics.dll" \
            "$imgui/rain-world-imgui-api.dll" \
            "$imgui/ImGui.NET.dll"

          cat > "$fakebin/dotnet" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          project=""
          output=""
          game_output=""
          for arg in "$@"; do
            case "$arg" in
              *.csproj) project="$arg" ;;
              -p:OutputPath=*) output="${arg#-p:OutputPath=}" ;;
              -p:GameModOutputDir=*) game_output="${arg#-p:GameModOutputDir=}" ;;
            esac
          done

          destination="${output:-$game_output}"
          if [[ -z "$project" || -z "$destination" ]]; then
            echo "fake dotnet: missing project/output arguments" >&2
            exit 2
          fi

          mkdir -p "$destination"
          if [[ "$project" == *"DryCycle.DevTool.RWImGui.csproj" ]]; then
            touch "$destination/DryCycle.DevTool.RWImGui.dll"
          else
            touch "$destination/DryCycle.dll"
          fi
          SH
          chmod +x "$fakebin/dotnet"

          echo "PHASE6_FAKE_RW=$rw" >> "$GITHUB_ENV"
          echo "PHASE6_FAKE_IMGUI=$imgui" >> "$GITHUB_ENV"
          echo "$fakebin" >> "$GITHUB_PATH"

      - name: Exercise backend-only validator flow
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP 'phase6-validator-backend-only'
          & ./scripts/validate-devtool-phase6-local.ps1 `
            -RainWorldDir $env:PHASE6_FAKE_RW `
            -BuildRoot $buildRoot `
            -BackendOnly

          if (-not (Test-Path (Join-Path $buildRoot 'DryCycle.dll') -PathType Leaf)) {
            throw 'Synthetic backend-only output was not produced.'
          }
          if (Test-Path (Join-Path $buildRoot 'DryCycle.DevTool.RWImGui.dll') -PathType Leaf) {
            throw 'Backend-only mode unexpectedly produced the frontend output.'
          }

          Write-Host 'Phase 6 backend-only validator smoke test passed.'

      - name: Exercise full validator flow
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP 'phase6-validator-full'
          & ./scripts/validate-devtool-phase6-local.ps1 `
            -RainWorldDir $env:PHASE6_FAKE_RW `
            -RWImGuiPluginDir $env:PHASE6_FAKE_IMGUI `
            -BuildRoot $buildRoot

          if (-not (Test-Path (Join-Path $buildRoot 'DryCycle.dll') -PathType Leaf)) {
            throw 'Synthetic backend output was not produced.'
          }
          if (-not (Test-Path (Join-Path $buildRoot 'DryCycle.DevTool.RWImGui.dll') -PathType Leaf)) {
            throw 'Synthetic frontend output was not produced.'
          }

          Write-Host 'Phase 6 full validator smoke test passed.'

      - name: Package source snapshot for real local compile validation
        uses: actions/upload-artifact@v4
        with:
          name: phase6-source-snapshot-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            Directory.Build.props
            DryCycle.sln
            src/**
            scripts/validate-devtool-phase6-local.ps1
            mod/modify/**
            mod/world/**

  restore-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare placeholder Rain World references for restore only
        shell: bash
        run: |
          set -euo pipefail
          rw="$RUNNER_TEMP/fake-rain-world"
          mkdir -p "$rw/BepInEx/core" "$rw/BepInEx/utils" "$rw/BepInEx/plugins" "$rw/RainWorld_Data/Managed"
          touch \
            "$rw/BepInEx/core/BepInEx.dll" \
            "$rw/BepInEx/core/MonoMod.RuntimeDetour.dll" \
            "$rw/BepInEx/core/MonoMod.Utils.dll" \
            "$rw/BepInEx/core/Mono.Cecil.dll" \
            "$rw/BepInEx/utils/PUBLIC-Assembly-CSharp.dll" \
            "$rw/BepInEx/plugins/HOOKS-Assembly-CSharp.dll" \
            "$rw/RainWorld_Data/Managed/Assembly-CSharp-firstpass.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.CoreModule.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.AssetBundleModule.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.AudioModule.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.InputLegacyModule.dll" \
            "$rw/RainWorld_Data/Managed/Unity.Mathematics.dll"
          echo "PHASE6_RESTORE_RW=$rw" >> "$GITHUB_ENV"

      - name: Restore public NuGet build dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/DryCycle.csproj \
            -p:RainWorldDir="$PHASE6_RESTORE_RW" \
            -p:DeployToGame=false \
            --nologo

          out="$RUNNER_TEMP/phase6-nuget"
          mkdir -p "$out"
          for pattern in \
            "$HOME/.nuget/packages/polysharp" \
            "$HOME/.nuget/packages/microsoft.netframework.referenceassemblies" \
            "$HOME/.nuget/packages/microsoft.netframework.referenceassemblies.net48"; do
            if [ -e "$pattern" ]; then
              cp -a "$pattern" "$out/"
            fi
          done
          find "$out" -maxdepth 3 -type f | sort | head -100
          test -d "$out/polysharp"

      - name: Publish public NuGet restore cache
        uses: actions/upload-artifact@v4
        with:
          name: phase6-nuget-bootstrap-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/phase6-nuget/**
