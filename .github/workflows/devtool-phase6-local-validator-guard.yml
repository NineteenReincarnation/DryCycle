name: DevTool Phase 6 Local Validator Guard

on:
  pull_request:
    paths:
      - 'scripts/validate-devtool-phase6-local.ps1'
      - '.github/workflows/devtool-phase6-local-validator-guard.yml'
  push:
    paths:
      - 'scripts/validate-devtool-phase6-local.ps1'
      - '.github/workflows/devtool-phase6-local-validator-guard.yml'

jobs:
  validator-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse local validation script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/validate-devtool-phase6-local.ps1'),
            [ref]$tokens,
            [ref]$errors)

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

          Write-Host 'Phase 6 local validator PowerShell syntax passed.'

      - name: Prepare synthetic validation environment
        shell: bash
        run: |
          set -euo pipefail
          rw="$RUNNER_TEMP/fake-rain-world"
          imgui="$RUNNER_TEMP/fake-rwimgui"
          fakebin="$RUNNER_TEMP/fake-bin"

          mkdir -p \
            "$rw/BepInEx/core" \
            "$rw/BepInEx/utils" \
            "$rw/BepInEx/plugins" \
            "$rw/RainWorld_Data/Managed" \
            "$imgui" \
            "$fakebin"

          touch \
            "$rw/BepInEx/core/BepInEx.dll" \
            "$rw/BepInEx/core/MonoMod.RuntimeDetour.dll" \
            "$rw/BepInEx/core/MonoMod.Utils.dll" \
            "$rw/BepInEx/core/Mono.Cecil.dll" \
            "$rw/BepInEx/utils/PUBLIC-Assembly-CSharp.dll" \
            "$rw/BepInEx/plugins/HOOKS-Assembly-CSharp.dll" \
            "$rw/RainWorld_Data/Managed/Assembly-CSharp-firstpass.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.CoreModule.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.AssetBundleModule.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.AudioModule.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.InputLegacyModule.dll" \
            "$rw/RainWorld_Data/Managed/Unity.Mathematics.dll" \
            "$imgui/rain-world-imgui-api.dll" \
            "$imgui/ImGui.NET.dll"

          cat > "$fakebin/dotnet" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          project=""
          output=""
          game_output=""
          for arg in "$@"; do
            case "$arg" in
              *.csproj) project="$arg" ;;
              -p:OutputPath=*) output="${arg#-p:OutputPath=}" ;;
              -p:GameModOutputDir=*) game_output="${arg#-p:GameModOutputDir=}" ;;
            esac
          done

          destination="${output:-$game_output}"
          if [[ -z "$project" || -z "$destination" ]]; then
            echo "fake dotnet: missing project/output arguments" >&2
            exit 2
          fi

          mkdir -p "$destination"
          if [[ "$project" == *"DryCycle.DevTool.RWImGui.csproj" ]]; then
            touch "$destination/DryCycle.DevTool.RWImGui.dll"
          else
            touch "$destination/DryCycle.dll"
          fi
          SH
          chmod +x "$fakebin/dotnet"

          echo "PHASE6_FAKE_RW=$rw" >> "$GITHUB_ENV"
          echo "PHASE6_FAKE_IMGUI=$imgui" >> "$GITHUB_ENV"
          echo "$fakebin" >> "$GITHUB_PATH"

      - name: Exercise backend-only validator flow
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP 'phase6-validator-backend-only'
          & ./scripts/validate-devtool-phase6-local.ps1 `
            -RainWorldDir $env:PHASE6_FAKE_RW `
            -BuildRoot $buildRoot `
            -BackendOnly

          if (-not (Test-Path (Join-Path $buildRoot 'DryCycle.dll') -PathType Leaf)) {
            throw 'Synthetic backend-only output was not produced.'
          }
          if (Test-Path (Join-Path $buildRoot 'DryCycle.DevTool.RWImGui.dll') -PathType Leaf) {
            throw 'Backend-only mode unexpectedly produced the frontend output.'
          }

          Write-Host 'Phase 6 backend-only validator smoke test passed.'

      - name: Exercise full validator flow
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP 'phase6-validator-full'
          & ./scripts/validate-devtool-phase6-local.ps1 `
            -RainWorldDir $env:PHASE6_FAKE_RW `
            -RWImGuiPluginDir $env:PHASE6_FAKE_IMGUI `
            -BuildRoot $buildRoot

          if (-not (Test-Path (Join-Path $buildRoot 'DryCycle.dll') -PathType Leaf)) {
            throw 'Synthetic backend output was not produced.'
          }
          if (-not (Test-Path (Join-Path $buildRoot 'DryCycle.DevTool.RWImGui.dll') -PathType Leaf)) {
            throw 'Synthetic frontend output was not produced.'
          }

          Write-Host 'Phase 6 full validator smoke test passed.'

      - name: Package source snapshot for real local compile validation
        uses: actions/upload-artifact@v4
        with:
          name: phase6-source-snapshot-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            Directory.Build.props
            DryCycle.sln
            src/**
            scripts/validate-devtool-phase6-local.ps1
            mod/modify/**
            mod/world/**

  restore-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare placeholder Rain World references for restore only
        shell: bash
        run: |
          set -euo pipefail
          rw="$RUNNER_TEMP/fake-rain-world"
          mkdir -p "$rw/BepInEx/core" "$rw/BepInEx/utils" "$rw/BepInEx/plugins" "$rw/RainWorld_Data/Managed"
          touch \
            "$rw/BepInEx/core/BepInEx.dll" \
            "$rw/BepInEx/core/MonoMod.RuntimeDetour.dll" \
            "$rw/BepInEx/core/MonoMod.Utils.dll" \
            "$rw/BepInEx/core/Mono.Cecil.dll" \
            "$rw/BepInEx/utils/PUBLIC-Assembly-CSharp.dll" \
            "$rw/BepInEx/plugins/HOOKS-Assembly-CSharp.dll" \
            "$rw/RainWorld_Data/Managed/Assembly-CSharp-firstpass.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.CoreModule.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.AssetBundleModule.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.AudioModule.dll" \
            "$rw/RainWorld_Data/Managed/UnityEngine.InputLegacyModule.dll" \
            "$rw/RainWorld_Data/Managed/Unity.Mathematics.dll"
          echo "PHASE6_RESTORE_RW=$rw" >> "$GITHUB_ENV"

      - name: Restore public NuGet build dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/DryCycle.csproj \
            -p:RainWorldDir="$PHASE6_RESTORE_RW" \
            -p:DeployToGame=false \
            --nologo

          out="$RUNNER_TEMP/phase6-nuget"
          mkdir -p "$out"
          for pattern in \
            "$HOME/.nuget/packages/polysharp" \
            "$HOME/.nuget/packages/microsoft.netframework.referenceassemblies" \
            "$HOME/.nuget/packages/microsoft.netframework.referenceassemblies.net48"; do
            if [ -e "$pattern" ]; then
              cp -a "$pattern" "$out/"
            fi
          done
          find "$out" -maxdepth 3 -type f | sort | head -100
          test -d "$out/polysharp"

      - name: Publish public NuGet restore cache
        uses: actions/upload-artifact@v4
        with:
          name: phase6-nuget-bootstrap-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/phase6-nuget/**
