name: R6 B5 B6 closeout
on:
  push:
    branches:
      - task14-r6-b1-final
permissions:
  contents: write
jobs:
  closeout:
    if: github.event.head_commit.message == 'Trigger R6 B5 B6 progress closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r6-b1-final
          fetch-depth: 0
      - name: Update progress records
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '' '## Continuation run — R6 B5/B6' '' '### Start state' '- Began from verified R6-B4 progress HEAD 30b5d9f4667397bdb20d81cd50c97f290a32384d.' '- R6 was still incomplete; Presentation and Social leaf identities remained on legacy DesertBatfly names.' '' '### Completed' '- R6-B5: moved DesertBatflySandBurst.cs to Presentation/DB_SandBurst.cs and renamed the production type to DB_SandBurst.' '- R6-B6: moved DesertBatflySocialBond.cs to Social/DB_SocialBond.cs and renamed production references to DB_SocialBond.' '' '### Important files' '- src/Creatures/DesertBatfly/Presentation/DB_SandBurst.cs' '- src/Creatures/DesertBatfly/Social/DB_SocialBond.cs' '- src/Creatures/DesertBatfly/DesertBatfly.cs' '- scripts/check-desertbatfly-r5-retention.sh' '' '### Validation' '- B5 behavior-preserving guard verified the new SandBurst implementation equals the old source after only identity substitution.' '- B6 behavior-preserving guard verified the new SocialBond implementation equals the old source after only identity substitution.' '- R5 retention audit passed after both successful batches.' '- R6 B1 retention audit passed after both successful batches.' '- B6 final GitHub Actions run 34151969749 succeeded.' '- git diff --check passed in successful migration runs.' '- Full Rain World/.NET Framework managed build and live-play validation remain unavailable here and are not claimed as passing.' '' '### Self-review findings and fixes' '- First B6 attempt failed before job creation because the temporary workflow YAML contained an invalid embedded heredoc; no production code changed.' '- Second B6 attempt performed the migration but exposed R5 guard path drift: DB_SocialBond was checked at the root instead of Social/DB_SocialBond.cs.' '- The guard path was corrected without removing or weakening assertions; the full migration and retention checks then passed.' '' '### Remaining Task14 requirements' '- R6 still needs TravelNavigation responsibility-aware migration; remaining Graphics/Core/Injury/Fear/Vengeance/Social/Roost identities; Threat/Signals/Environment domain migration; production Task09-Task13 naming cleanup; old-root/dead-code cleanup; and final R6 naming/path guard.' '- R7 performance/debug/full regression/final acceptance remains pending.' '' '### Blockers' '- Full managed build/tests require developer-local Rain World/BepInEx assemblies.' '- Final live behavior/performance acceptance requires Rain World.' '- These blockers do not prevent further source-level R6 work.' '' '### Recommended next hour' '- Inspect DesertBatflyGraphics.cs before any rename. If it remains a cohesive Presentation owner, migrate it with behavior-preserving source equivalence guards; otherwise choose a smaller KEEP/RENAME Injury/Threat/Signal leaf.' '- Do not mechanically rename/split DesertBatflyTravelNavigation.cs without responsibility review.' >> PROGRESS.md
          printf '%s\n' '' 'R6-B5/B6 update:' '- Presentation/DB_SandBurst.cs migrated from DesertBatflySandBurst with identity-only behavior-preserving changes.' '- Social/DB_SocialBond.cs migrated from DesertBatflySocialBond with identity-only behavior-preserving changes.' '- Existing R5/R6 retention guards passed after the successful migrations.' '- R6 remains in progress; no live Rain World acceptance is claimed.' >> docs/Discussion/Task_14_R6_DomainMigrationStatus.txt
          git diff --check
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add PROGRESS.md docs/Discussion/Task_14_R6_DomainMigrationStatus.txt
          git diff --cached --check
          git commit -m 'Update hourly progress through R6 B6'
          git push
