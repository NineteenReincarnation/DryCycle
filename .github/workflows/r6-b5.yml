name: R6 B6 SocialBond
on:
  push:
    branches:
      - task14-r6-b1-final
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message == 'Trigger corrected R6 B6 SocialBond migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r6-b1-final
          fetch-depth: 0
      - name: Migrate SocialBond and validate
        shell: bash
        run: |
          set -euo pipefail
          old=src/Creatures/DesertBatfly/DesertBatflySocialBond.cs
          new=src/Creatures/DesertBatfly/Social/DB_SocialBond.cs
          test -f "$old"
          mkdir -p "$(dirname "$new")"
          git show 0ff6c632c214c2cc46267b3a3dfb9ee27d82ba69:"$old" | sed 's/DesertBatflySocialBond/DB_SocialBond/g' > /tmp/expected.cs
          git mv "$old" "$new"
          python3 - <<'PY'
          from pathlib import Path
          for base in (Path('src'), Path('tests'), Path('scripts')):
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix not in {'.cs','.sh'}:
                      continue
                  text=p.read_text(encoding='utf-8')
                  out=text.replace('DesertBatflySocialBond','DB_SocialBond')
                  if out != text:
                      p.write_text(out,encoding='utf-8')
          PY
          cmp -s /tmp/expected.cs "$new"
          test ! -e "$old"
          ! grep -RIn --include='*.cs' 'DesertBatflySocialBond' src
          grep -q 'internal static class DB_SocialBond' "$new"
          grep -q 'DirectDeathWitnessRadius = 340f' "$new"
          grep -q 'StrengthenBond(target.abstractCreature.ID, gain)' "$new"
          grep -q 'BeginGrief(victim.abstractCreature.ID' "$new"
          grep -q 'guard++ < 32' "$new"
          bash scripts/check-desertbatfly-r5-retention.sh
          bash scripts/check-desertbatfly-r6-b1.sh
          git diff --check
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add -A
          git diff --cached --check
          git commit -m 'R6 B6 migrate SocialBond identity'
          git push
