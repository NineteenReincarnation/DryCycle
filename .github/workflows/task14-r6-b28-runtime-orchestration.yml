name: Task14 R6 B28 Runtime orchestration extraction

on:
  push:
    branches: [ task14-r6-b1-final ]

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[r6-b28-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r6-b1-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract species runtime orchestration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          creature = Path('src/Creatures/DesertBatfly/DesertBatfly.cs')
          text = creature.read_text(encoding='utf-8')
          text = text.replace('    private int socialSampleTicks;\n', '', 1)
          text = text.replace(
              '    internal readonly DB_SandSpitRuntime SandSpit;\n',
              '    internal readonly DB_SandSpitRuntime SandSpit;\n    internal readonly DB_Runtime Runtime;\n', 1)
          text = text.replace(
              '        SandSpit = new DB_SandSpitRuntime(this);\n',
              '        SandSpit = new DB_SandSpitRuntime(this);\n        Runtime = new DB_Runtime(this);\n', 1)

          start = text.index('    public override void Update(bool eu)')
          end = text.index('    public override void Stun(int ticks)')
          replacement = '''    public override void Update(bool eu)
    {
        Vector2 previousFlightVelocity = Runtime.BeforeVanillaUpdate();
        if (room == null)
        {
            base.Update(eu);
            return;
        }

        Room currentRoom = room;
        FliesRoomAI original = currentRoom.fliesRoomAi;
        var colony = DB_SwarmRoom.For(currentRoom);
        currentRoom.fliesRoomAi = colony.Hive;
        colony.Hive.AddFly(this);
        runningVanillaUpdate = true;
        try
        {
            base.Update(eu);
        }
        finally
        {
            runningVanillaUpdate = false;
            currentRoom.fliesRoomAi = original;
        }

        Runtime.AfterVanillaUpdate(eu, previousFlightVelocity);
    }

'''
          text = text[:start] + replacement + text[end:]
          creature.write_text(text, encoding='utf-8')

          runtime = Path('src/Creatures/DesertBatfly/Runtime/DB_Runtime.cs')
          runtime.write_text('''using UnityEngine;

namespace DryCycle.Creatures.DesertBatfly;

/// <summary>
/// Species-level realized update orchestration around the native Fly update boundary.
/// Rain World lifecycle/base.Update stays on DB_Creature/DesertBatfly; this runtime only
/// sequences already-owned domain ticks before and after that native boundary.
/// </summary>
internal sealed class DB_Runtime
{
    private readonly DesertBatfly bat;
    private int socialSampleTicks;

    internal DB_Runtime(DesertBatfly bat)
    {
        this.bat = bat;
    }

    internal Vector2 BeforeVanillaUpdate()
    {
        bat.Injury.Tick();
        Vector2 previousFlightVelocity = bat.mainBodyChunk?.vel ?? Vector2.zero;
        bat.SandSpit.PreUpdate();

        if (!bat.dead)
        {
            bat.DesertState.TickTrauma();
            bat.DesertState.TickGrief();
            if (++socialSampleTicks >= 180)
            {
                socialSampleTicks = 0;
                DB_SocialBond.SampleChain(bat);
            }
        }

        if (bat.room == null)
            return previousFlightVelocity;

        bat.SandSpit.UpdateHeldStruggle();
        bat.DesertState.Thirst = Mathf.Clamp01(
            bat.DesertState.Thirst + (bat.dead ? 0f : DB_Tuning.ThirstPerTick));
        if (bat.DesertState.Cooldown > 0) bat.DesertState.Cooldown--;
        bat.DesertAI.TickMemory();
        if (!bat.dead)
            DesertBatflyIntimidation.UpdateState(bat);

        return previousFlightVelocity;
    }

    internal void AfterVanillaUpdate(bool eu, Vector2 previousFlightVelocity)
    {
        // Vengeance state/fear is refreshed before native Fly.Update so the R3 arbiter sees
        // current facts. Movement itself remains owned by DB_VengeanceExecutor/FlightMotor.
        bool extremeVengeance = !bat.dead && DesertBatflyIntimidation.IsExtremeVengeanceActive(bat);
        if (extremeVengeance) bat.DesertAI.CancelAttack();

        if (bat.room == null) return;
        bat.Emergence.Update(eu);
        if (!extremeVengeance)
            bat.DesertAI.Combat.AfterPhysics(eu);
        DB_FlightMotor.ApplyPostPhysics(bat, previousFlightVelocity);
    }
}
''', encoding='utf-8')
          PY
      - name: Validate Runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          creature=src/Creatures/DesertBatfly/DesertBatfly.cs
          runtime=src/Creatures/DesertBatfly/Runtime/DB_Runtime.cs
          test -f "$runtime"
          grep -q 'internal sealed class DB_Runtime' "$runtime"
          grep -q 'internal readonly DB_Runtime Runtime' "$creature"
          grep -q 'Runtime = new DB_Runtime(this)' "$creature"
          grep -q 'Runtime.BeforeVanillaUpdate()' "$creature"
          grep -q 'Runtime.AfterVanillaUpdate(eu, previousFlightVelocity)' "$creature"
          grep -q 'base.Update(eu)' "$creature"
          ! grep -q 'base.Update' "$runtime"
          grep -q 'currentRoom.fliesRoomAi = colony.Hive' "$creature"
          grep -q 'currentRoom.fliesRoomAi = original' "$creature"
          for token in 'TickTrauma' 'TickGrief' 'DB_SocialBond.SampleChain' 'DB_Tuning.ThirstPerTick' 'DesertBatflyIntimidation.UpdateState' 'Combat.AfterPhysics' 'DB_FlightMotor.ApplyPostPhysics'; do
            grep -q "$token" "$runtime"
            ! grep -q "$token" "$creature"
          done
          ! grep -n 'mainBodyChunk.vel[[:space:]]*=' "$runtime"
          grep -q 'DB_SandBurst.Emit' src/Creatures/DesertBatfly/Combat/DB_SandSpitRuntime.cs
          grep -q '^            bat,$' src/Creatures/DesertBatfly/Combat/DB_SandSpitRuntime.cs
          git grep -q 'DCDesertBatflyV1' -- src tests
          git grep -q 'DCDesertBatflyThreatV1' -- src tests
          git grep -q 'DCBATCOLONY09<svB>' -- src tests
          git grep -q 'DESERTSWARMROOM' -- src tests
          bash scripts/check-desertbatfly-r5-retention.sh
          bash scripts/check-desertbatfly-r6-b1.sh
          git diff --check
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/task14-r6-b28-runtime-orchestration.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R6 B28 extract Runtime orchestration [r6-b28-done]'
          git push origin HEAD:task14-r6-b1-final
