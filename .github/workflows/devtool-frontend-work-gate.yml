name: DevTool Frontend Work Gate
on:
  push:
    paths:
      - '.github/workflows/devtool-frontend-work-gate.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/devtool-frontend-stable-frame
      - name: Apply visibility work gates
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/DevUI/DevTool/RWImGui/BridgePlugin.cs')
          s = p.read_text(encoding='utf-8')
          old = '''                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.FontSettings))
                        FontSettingsWindow.Draw(io.DisplaySize);
                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.Overlay))
                        DevToolOverlay.Draw(snapshot);
                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.SceneWorkspace))
                        SceneWorkspaceWindow.Draw(snapshot, io.DisplaySize);
                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.ScenePlacement))
                        ScenePlacementWindow.Draw(snapshot, io.DisplaySize);
                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.ActionToast))
                        ActionToastOverlay.Draw(snapshot, io.DisplaySize);'''
          new = '''                    // Gate secondary surfaces before entering their timer scopes. Besides avoiding
                    // needless managed/native calls on stable frames, this keeps frontend P95 honest:
                    // unsupported/hidden frames must not dilute a surface's samples with near-zero returns.
                    if (snapshot.Hydrated && snapshot.ToolMode != EditorToolMode.Map)
                    {
                        using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.FontSettings))
                            FontSettingsWindow.Draw(io.DisplaySize);
                    }
                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.Overlay))
                        DevToolOverlay.Draw(snapshot);
                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.SceneWorkspace))
                        SceneWorkspaceWindow.Draw(snapshot, io.DisplaySize);
                    if (!snapshot.FocusMode && ScenePlacementWindow.Supports(snapshot.ToolMode))
                    {
                        using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.ScenePlacement))
                            ScenePlacementWindow.Draw(snapshot, io.DisplaySize);
                    }
                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.ActionToast))
                        ActionToastOverlay.Draw(snapshot, io.DisplaySize);'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/devtool-frontend-work-gate.yml').unlink()
      - name: Validate frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "DevToolFrontendPerformance" src/DevUI/DevTool/Core src/DevUI/DevTool/Runtime 2>/dev/null
          grep -q "snapshot.Hydrated && snapshot.ToolMode != EditorToolMode.Map" src/DevUI/DevTool/RWImGui/BridgePlugin.cs
          grep -q "ScenePlacementWindow.Supports(snapshot.ToolMode)" src/DevUI/DevTool/RWImGui/BridgePlugin.cs
          test ! -e .github/workflows/devtool-frontend-work-gate.yml
      - name: Commit work gate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Gate inactive RWImGui secondary surfaces'
          git push origin HEAD:perf/devtool-frontend-stable-frame