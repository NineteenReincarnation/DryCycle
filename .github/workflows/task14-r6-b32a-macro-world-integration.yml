name: Task14 R6 B32a macro World and Integration consolidation

on:
  push:
    branches: [ task14-r6-b1-final ]

permissions:
  contents: write

jobs:
  consolidate:
    if: "!contains(github.event.head_commit.message, '[r6-b32a-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r6-b1-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Consolidate macro domains
        shell: bash
        run: |
          set -euo pipefail
          root=src/Creatures/DesertBatfly
          mkdir -p "$root/World"

          for dir in Colony Environment Travel; do
            for f in "$root/$dir"/*.cs; do
              [ -e "$f" ] || continue
              target="$root/World/$(basename "$f")"
              test ! -e "$target"
              git mv "$f" "$target"
            done
          done

          for dir in RainWorld Sandbox Warp; do
            for f in "$root/Integration/$dir"/*.cs; do
              [ -e "$f" ] || continue
              target="$root/Integration/$(basename "$f")"
              test ! -e "$target"
              git mv "$f" "$target"
            done
          done

          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'src/Creatures/DesertBatfly/Integration/RainWorld/': 'src/Creatures/DesertBatfly/Integration/',
              'src/Creatures/DesertBatfly/Integration/Sandbox/': 'src/Creatures/DesertBatfly/Integration/',
              'src/Creatures/DesertBatfly/Integration/Warp/': 'src/Creatures/DesertBatfly/Integration/',
              'src/Creatures/DesertBatfly/Environment/': 'src/Creatures/DesertBatfly/World/',
              'src/Creatures/DesertBatfly/Colony/': 'src/Creatures/DesertBatfly/World/',
              'src/Creatures/DesertBatfly/Travel/': 'src/Creatures/DesertBatfly/World/',
          }
          for name in ['scripts/check-desertbatfly-r5-retention.sh', 'scripts/check-desertbatfly-r6-b1.sh']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  s = s.replace(old, new)
              s = s.replace('src/Creatures/DesertBatfly/Environmental src/Creatures/DesertBatfly/Environment', 'src/Creatures/DesertBatfly/World')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate macro consolidation
        shell: bash
        run: |
          set -euo pipefail
          root=src/Creatures/DesertBatfly
          for old in Colony Environment Travel; do test ! -d "$root/$old" || test -z "$(find "$root/$old" -type f -print -quit)"; done
          for old in RainWorld Sandbox Warp; do test ! -d "$root/Integration/$old" || test -z "$(find "$root/Integration/$old" -type f -print -quit)"; done

          for f in \
            "$root/World/DB_ColonyRuntime.cs" \
            "$root/World/DB_ColonyState.cs" \
            "$root/World/DB_MigrationPolicy.cs" \
            "$root/World/DB_SwarmRoom.cs" \
            "$root/World/DB_EnvironmentRuntime.cs" \
            "$root/World/DB_EnvironmentRoomRuntime.cs" \
            "$root/World/DB_EnvironmentalPolicy.cs" \
            "$root/World/DB_WeatherEcology.cs" \
            "$root/World/DB_TravelRuntime.cs" \
            "$root/World/DB_TravelIntent.cs" \
            "$root/World/DB_WorldRoutePlanner.cs" \
            "$root/World/DB_RefugePolicy.cs" \
            "$root/Integration/DB_RainWorldHooks.cs" \
            "$root/Integration/DB_RuntimePatch.cs" \
            "$root/Integration/DB_Sandbox.cs" \
            "$root/Integration/DB_WarpCompatibility.cs"; do test -f "$f"; done

          git diff --cached --quiet || true
          bash scripts/check-desertbatfly-r5-retention.sh
          bash scripts/check-desertbatfly-r6-b1.sh
          git grep -q 'DCDesertBatflyV1' -- src tests
          git grep -q 'DCDesertBatflyThreatV1' -- src tests
          git grep -q 'DCBATCOLONY09<svB>' -- src tests
          git grep -q 'DESERTSWARMROOM' -- src tests
          git diff --check

          # This batch is path-only for production code: all moved .cs blobs must be unchanged.
          git diff --summary | grep -E 'rename src/Creatures/DesertBatfly/(Colony|Environment|Travel|Integration/.+)'
          if git diff --numstat -- src/Creatures/DesertBatfly | awk '$1 != "0" || $2 != "0" { bad=1 } END { exit bad }'; then :; else
            echo 'Production DesertBatfly source changed during path-only B32a.' >&2
            exit 1
          fi

      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/task14-r6-b32a-macro-world-integration.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R6 B32a consolidate World and Integration [r6-b32a-done]'
          git push origin HEAD:task14-r6-b1-final
