name: DesertBatfly R6 Task-Term Guard

on:
  push:
    branches:
      - task14-r6-b1-final
    paths:
      - 'src/Creatures/DesertBatfly/**'
      - '.github/workflows/desertbatfly-r6-task-term-guard.yml'
  pull_request:
    paths:
      - 'src/Creatures/DesertBatfly/**'
      - '.github/workflows/desertbatfly-r6-task-term-guard.yml'
  workflow_dispatch:

jobs:
  production-task-term-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject TaskXX terminology in production DesertBatfly code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('src/Creatures/DesertBatfly')
          pattern = re.compile(r'\bTask\d+\b', re.IGNORECASE)
          failures = []

          for path in sorted(root.rglob('*.cs')):
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if pattern.search(line):
                      failures.append((path.as_posix(), line_no, line.strip()))

          if failures:
              print('Task-number terminology is forbidden in production DesertBatfly code:')
              for path, line_no, line in failures:
                  print(f'{path}:{line_no}: {line}')
              sys.exit(1)

          print('OK: production DesertBatfly code contains no TaskXX terminology.')
          PY
