name: Task14 R6 B29 perception integrity fix

on:
  push:
    branches: [ task14-r6-b1-final ]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[r6-b29-integrity]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r6-b1-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair migrated perception ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          perception = Path('src/Creatures/DesertBatfly/Perception/DB_CreaturePerception.cs')
          p = perception.read_text(encoding='utf-8')
          marker = '    internal Creature Danger { get; private set; }\n'
          insert = (
              '    internal Creature Danger { get; private set; }\n'
              '    internal bool IsScanFrame => scan == 0;\n'
          )
          if marker not in p:
              raise SystemExit('Perception Danger marker missing')
          p = p.replace(marker, insert, 1)
          reset_marker = (
              '    internal void Reset()\n'
              '    {\n'
              '        Danger = null;\n'
              '        scan = pursuit = 0;\n'
              '    }\n'
          )
          reset_replacement = reset_marker + '\n    internal void ClearPursuit() => pursuit = 0;\n'
          if reset_marker not in p:
              raise SystemExit('Perception Reset marker missing')
          p = p.replace(reset_marker, reset_replacement, 1)
          perception.write_text(p, encoding='utf-8')

          ai = Path('src/Creatures/DesertBatfly/DesertBatflyAI.cs')
          a = ai.read_text(encoding='utf-8')
          replacements = {
              '        pursuit = 0;\n': '        perception.ClearPursuit();\n',
              '        Target = null;\n': '        combat.ClearTarget();\n',
              '        if (scan != 0 || Random.value >\n': '        if (!perception.IsScanFrame || Random.value >\n',
          }
          for old, new in replacements.items():
              if old not in a:
                  raise SystemExit('AI ownership marker missing: ' + old.strip())
              a = a.replace(old, new, 1)
          ai.write_text(a, encoding='utf-8')
          PY
      - name: Validate repaired ownership
        shell: bash
        run: |
          set -euo pipefail
          ai=src/Creatures/DesertBatfly/DesertBatflyAI.cs
          perception=src/Creatures/DesertBatfly/Perception/DB_CreaturePerception.cs
          grep -q 'internal bool IsScanFrame => scan == 0;' "$perception"
          grep -q 'internal void ClearPursuit() => pursuit = 0;' "$perception"
          grep -q 'perception.ClearPursuit();' "$ai"
          grep -q '!perception.IsScanFrame' "$ai"
          grep -q 'combat.ClearTarget();' "$ai"
          ! grep -n -E '\bscan\b|\bpursuit\b' "$ai"
          ! grep -n 'Target[[:space:]]*=' "$ai"
          bash scripts/check-desertbatfly-r5-retention.sh
          bash scripts/check-desertbatfly-r6-b1.sh
          git diff --check
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/task14-r6-b29-integrity-fix.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R6 B29 repair perception ownership leaks [r6-b29-integrity]'
          git push origin HEAD:task14-r6-b1-final
