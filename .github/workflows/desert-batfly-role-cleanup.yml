name: Final Desert Batfly social-role cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desert-batfly-role-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove rejected Task 02 runtime seams
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_required(text, old, new, label, minimum=1):
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{label}: expected at least {minimum} occurrence(s), found {count}')
              return text.replace(old, new)

          # DesertBatflyAI: remove the compatibility object and every no-op call.
          path = 'src/Creatures/DesertBatfly/DesertBatflyAI.cs'
          text = read(path)
          text = replace_required(text, '    internal readonly DesertBatflySocialRoles Roles;\n', '', 'AI Roles field')
          text = replace_required(text, '        Roles = new DesertBatflySocialRoles(fly);\n', '', 'AI Roles construction')
          for old in [
              '        Roles.Reset();\n',
              '        Roles.CheckSuppression();\n',
              '            Roles.CheckSuppression();\n',
              '        Roles?.CheckSuppression();\n',
              '            bat.DesertAI.Roles.CheckSuppression();\n',
              '        Roles.BeginVisibleScan();\n',
              '            Roles.ObserveVisible(creature, distance, predator);\n',
              '        Roles.EndVisibleScan(DesertSwarmRoom.For(fly.room).Flock);\n',
              '        if (danger != null) Roles.CheckSuppression();\n',
              '        if (Roles.WatchesInsteadOfInitiating && memory <= 0 && retaliationCharges == 0) return;\n',
          ]:
              text = text.replace(old, '')
          text = text.replace(
              '        var flock = DesertSwarmRoom.For(fly.room).Flock;\n        Roles.Evaluate(flock);\n        Roles.BiasOrdinaryFlight(flock);\n\n',
              '')
          text = replace_required(text, 'Orbit(Roles.ObserveRadius, 90f)', 'Orbit(150f, 90f)', 'ordinary observe radius')
          text = replace_required(text, 'fly.Personality.ObserveDuration * Roles.ObserveDurationScale', 'fly.Personality.ObserveDuration', 'ordinary observe duration')
          text = replace_required(text, 'fly.Personality.FakeDiveChance + Roles.FakeDiveBonus', 'fly.Personality.FakeDiveChance', 'ordinary fake-dive chance')
          text = replace_required(text, 'observeThreshold * socialMotivationScale * Roles.HarassThresholdScale', 'observeThreshold * socialMotivationScale', 'ordinary harass threshold')
          if 'Roles' in text or 'DesertBatflySocialRoles' in text:
              raise SystemExit('DesertBatflyAI still contains rejected role compatibility references')
          write(path, text)

          # DesertBatfly lifecycle: remove role ticks/checks/resets.
          path = 'src/Creatures/DesertBatfly/DesertBatfly.cs'
          text = read(path)
          before = text
          text = re.sub(r'^\s*DesertAI(?:\?|)\.Roles\.(?:Tick|CheckSuppression|Reset)\(\);\n', '', text, flags=re.M)
          if text == before:
              raise SystemExit('DesertBatfly.cs: no role lifecycle calls were removed')
          if '.Roles' in text:
              raise SystemExit('DesertBatfly.cs still references .Roles')
          write(path, text)

          # Injury: delete obsolete role-specific injury gates and use the real fear name.
          path = 'src/Creatures/DesertBatfly/DesertBatflyInjury.cs'
          text = read(path)
          pattern = re.compile(
              r'\n    internal bool BlocksRole\(ExpressedSocialRole role\) =>.*?\n    internal float WingAmplitude',
              re.S)
          text, count = pattern.subn('\n    internal float WingAmplitude', text, count=1)
          if count != 1:
              raise SystemExit(f'Injury role block removal expected 1 block, found {count}')
          text = replace_required(text, 'DesertBatflyIntimidation.BlocksSocialRoles(bat)', 'DesertBatflyIntimidation.HasActiveFearSuppression(bat)', 'injury fear gate')
          if 'ExpressedSocialRole' in text or 'BlocksRole' in text or 'RoleBlockReason' in text:
              raise SystemExit('DesertBatflyInjury still contains Task 02 role API')
          write(path, text)

          # Flock snapshot: remove the dead role-count compatibility surface.
          path = 'src/Creatures/DesertBatfly/DesertSwarmRoom.cs'
          text = read(path)
          text = re.sub(
              r'\n    // Temporary source-compatibility surface for the existing AI Observatory\..*?\n    internal int ExpressedRoleCount => 0;\n',
              '\n', text, count=1, flags=re.S)
          text = replace_required(text, '        int active,\n        int roles,\n        float panic,', '        int active,\n        float panic,', 'flock constructor role argument')
          text = replace_required(
              text,
              '            count,\n            0,\n            count == 0 ? 0f : (float)panic / count,',
              '            count,\n            count == 0 ? 0f : (float)panic / count,',
              'flock constructor call role argument')
          text = text.replace(
              '// Value-only room snapshot.  It is now a general flock/environment snapshot,\n// not a social-role budget.  It deliberately never reads DesertBatfly.Roles.\n',
              '// Value-only room snapshot for ordinary flock/environment state.\n')
          text = replace_required(text, 'DesertBatflyIntimidation.BlocksSocialRoles(bat)', 'DesertBatflyIntimidation.HasActiveFearSuppression(bat)', 'flock fear gate')
          if 'ExpressedRoleCount' in text or 'DesertBatfly.Roles' in text:
              raise SystemExit('DesertSwarmRoom still contains Task 02 compatibility state')
          write(path, text)

          # Intimidation: rename the generic fear gate and distinguish vengeance participation
          # from the rejected Sentinel/Bully/Opportunist system.
          path = 'src/Creatures/DesertBatfly/DesertBatflyIntimidation.cs'
          text = read(path)
          text = replace_required(text, 'private enum SocialRole { None, TrueAvenger, Follower }', 'private enum VengeanceParticipation { None, TrueAvenger, Follower }', 'vengeance enum')
          text = replace_required(text, '        internal SocialRole Role;\n', '        internal VengeanceParticipation Participation;\n', 'vengeance state field')
          text = text.replace('SocialRole.', 'VengeanceParticipation.')
          text = re.sub(r'\b([A-Za-z_][A-Za-z0-9_]*)\.Role\b', r'\1.Participation', text)
          text = replace_required(text, 'internal static bool BlocksSocialRoles(DesertBatfly bat)', 'internal static bool HasActiveFearSuppression(DesertBatfly bat)', 'fear gate rename')
          text = text.replace('// Read-only: role checks must never create a morale state, especially for corpses.', '// Read-only: fear checks must never create a morale state, especially for corpses.')
          leftovers = [token for token in ('SocialRole', 'BlocksSocialRoles', '.Role') if token in text]
          if leftovers:
              raise SystemExit(f'Intimidation still contains ambiguous role names: {leftovers}')
          write(path, text)

          # AI Observatory source must expose the real fear gate name only.
          path = 'src/Debug/AIDebugger/Sources/DesertBatflyDebugSource.cs'
          text = read(path)
          text = replace_required(text, 'DesertBatflyIntimidation.BlocksSocialRoles(bat)', 'DesertBatflyIntimidation.HasActiveFearSuppression(bat)', 'debug fear call')
          text = text.replace('"DesertBatflyIntimidation.BlocksSocialRoles"', '"DesertBatflyIntimidation.HasActiveFearSuppression"')
          text = text.replace(
              '// Desert Batfly Observatory adapter.  Social Roles were rejected and therefore\n// are deliberately absent from this diagnostic surface: the debugger reports\n// real gameplay state (personality, injury, social memory, AI and movement)\n// rather than keeping a dead Task 02 concept visually alive.\n',
              '// Desert Batfly Observatory adapter for current gameplay state: personality,\n// injury, social memory, AI and movement.\n')
          if 'BlocksSocialRoles' in text:
              raise SystemExit('DesertBatflyDebugSource still exposes the old fear-gate name')
          write(path, text)

          # Remove dead Task 02 localization keys from both English and Chinese dictionaries.
          path = 'src/Debug/AIDebugger/AIDebugLocalization.cs'
          text = read(path)
          dead_keys = [
              'section.social_role', 'field.role', 'field.expressed_role', 'field.suppression',
              'field.sentinel_score', 'field.bully_score', 'field.opportunist_score',
              'field.commitment', 'field.role_cooldown', 'field.role_evaluation',
              'field.alert_confidence', 'field.opportunity_ticks', 'field.opportunist_recovery',
              'field.flock_roles', 'decision.bully_injury', 'decision.social_role',
              'decision.sentinel', 'decision.bully', 'decision.opportunist'
          ]
          lines = []
          removed = 0
          for line in text.splitlines(True):
              if any(f'["{key}"]' in line for key in dead_keys):
                  removed += 1
                  continue
              lines.append(line)
          if removed < len(dead_keys) * 2:
              raise SystemExit(f'AIDebugLocalization removed only {removed} Task 02 localization lines')
          text = ''.join(lines)
          write(path, text)

          # Extended Observatory localization: remove obsolete role events/reasons and
          # rename the generic social overlay setting.
          path = 'src/Debug/AIDebugger/AIDebugExtendedLocalization.cs'
          text = read(path)
          text = replace_required(text, '["settings.social"] = new("Social / role", "社交 / 角色"),', '["settings.social"] = new("Social", "社交"),', 'social overlay label')
          dead_fragments = [
              '"RoleEntered"', '"RoleExit"', '"RoleEvaluation"', '"RoleEvaluationBlocked"',
              '"RoleSustain"', '"SentinelAlarm"', '"OpportunistEarlyReturn"',
              '"StoredRole"', '"ExpressedRole"', '"OpportunistRecovery"',
              'raw.StartsWith("role cooldown"', '"no score passed threshold + 0.12 dominance lead"',
              '"watch role blocked by existing target"', '"commitment expired"',
              '"commitment/score ended expression"', '"role visible"'
          ]
          lines = []
          removed = 0
          for line in text.splitlines(True):
              if any(fragment in line for fragment in dead_fragments):
                  removed += 1
                  continue
              lines.append(line)
          if removed < 12:
              raise SystemExit(f'AIDebugExtendedLocalization removed only {removed} obsolete role lines')
          text = ''.join(lines)
          write(path, text)

          # Tests now protect structural absence rather than keeping the dead types alive.
          path = 'tests/DesertBatfly/Program.cs'
          text = read(path)
          text = replace_required(text, '        RunRoleDistribution();\n', '''        Check(mod.GetType("DryCycle.Creatures.DesertBatfly.DesertBatflySocialRoles", false) == null,\n            "rejected social-role runtime class is physically removed");\n        Check(mod.GetType("DryCycle.Creatures.DesertBatfly.DesertBatflyRoleScores", false) == null,\n            "rejected social-role score type is physically removed");\n        Check(mod.GetType("DryCycle.Creatures.DesertBatfly.ExpressedSocialRole", false) == null,\n            "rejected social-role enum is physically removed");\n        Console.WriteLine("Social Roles: REJECTED Task 02 runtime types are physically absent.");\n''', 'role regression entry point')
          write(path, text)

          # Update the discussion record so future work does not recreate a compatibility seam.
          path = 'src/Creatures/DesertBatfly/DiscussionStatus.txt'
          text = read(path)
          old = '''代码迁移状态：\n- 角色运行时行为已经失效化：所有 role score 为 0，选择结果永久为 None，所有角色行为修正为中性值。\n- Sentinel/Opportunist 的 visible scan 与普通飞行 bias 已改为无操作，不再写 localGoal 或速度。\n- 旧的类型/方法名称目前只允许作为迁移兼容层存在，用于逐步拆除 AI Observatory、Injury、FlockSnapshot 等旧调用点；兼容层不得拥有游戏行为权。\n- 回归测试已改成“否决保护”：验证 10,000 个 Personality 均产生 0 个显性角色，并验证旧构造器/阈值不能重新激活角色。\n- Task_02_EmergentSocialRoles.txt 与 docs/DesertBatfly-Emergent-Social-Roles.md 只保留为否决记录，不再是可执行功能规范。\n'''
          new = '''代码迁移状态：\n- Task 02 的运行时类型与兼容层已经完成结构性删除；不再保留 DesertBatflySocialRoles、DesertBatflyRoleScores 或 ExpressedSocialRole。\n- DesertBatflyAI 不再持有 Roles 对象，也不再执行 role tick / scan / suppression / evaluation / movement bias。\n- Injury、FlockSnapshot 与 AI Observatory 已解除 Task 02 类型和术语依赖；普通恐惧门使用真实语义命名。\n- 回归测试改为“结构删除保护”：直接验证被否决的运行时类型不存在，避免为了测试而重新保留兼容类型。\n- Task_02_EmergentSocialRoles.txt 与 docs/DesertBatfly-Emergent-Social-Roles.md 只保留为否决记录，不再是可执行功能规范。\n'''
          text = replace_required(text, old, new, 'DiscussionStatus migration record')
          write(path, text)

          # Delete compatibility/runtime files and their obsolete test source.
          for dead in [
              'src/Creatures/DesertBatfly/DesertBatflySocialRoles.cs',
              'src/Creatures/DesertBatfly/DesertBatflyRoleScores.cs',
              'tests/DesertBatfly/Program.SocialRoles.cs',
          ]:
              p = Path(dead)
              if not p.exists():
                  raise SystemExit(f'expected cleanup target missing: {dead}')
              p.unlink()

          # Structural guard: historical rejection documents may mention Task 02, but
          # compiled source/tests must contain none of the rejected runtime vocabulary.
          forbidden = re.compile(
              r'DesertBatflySocialRoles|DesertBatflyRoleScores|ExpressedSocialRole|BlocksSocialRoles|ExpressedRoleCount|\\bSentinel\\b|\\bBully\\b|\\bOpportunist\\b|\\bSocialRole\\b')
          offenders = []
          for root in ('src', 'tests'):
              for p in Path(root).rglob('*.cs'):
                  match = forbidden.search(p.read_text(encoding='utf-8'))
                  if match:
                      offenders.append(f'{p}: {match.group(0)}')
          if offenders:
              raise SystemExit('Rejected Task 02 symbols remain in compiled code:\n' + '\n'.join(offenders))

          debug_text = '\n'.join(
              p.read_text(encoding='utf-8')
              for p in Path('src/Debug/AIDebugger').rglob('*.cs'))
          for token in ('RoleEntered', 'RoleEvaluation', 'SentinelAlarm', 'OpportunistEarlyReturn',
                        'StoredRole', 'ExpressedRole', 'Social / role', '社交 / 角色'):
              if token in debug_text:
                  raise SystemExit(f'AI Observatory still contains obsolete Task 02 token: {token}')
          PY

      - name: Show cleanup diff and structural checks
        shell: bash
        run: |
          git diff --check
          git status --short
          echo '--- Remaining rejected role tokens in compiled code (must be empty) ---'
          grep -RInE 'DesertBatflySocialRoles|DesertBatflyRoleScores|ExpressedSocialRole|BlocksSocialRoles|ExpressedRoleCount|\bSentinel\b|\bBully\b|\bOpportunist\b|\bSocialRole\b' src tests --include='*.cs' && exit 1 || true

      - name: Commit cleanup to main and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/desert-batfly-role-cleanup.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'Orrhisk'
          git config user.email '164201860+NineteenReincarnation@users.noreply.github.com'
          git add -A
          git commit -m 'Fully remove rejected Desert Batfly social roles'
          git push origin HEAD:main
