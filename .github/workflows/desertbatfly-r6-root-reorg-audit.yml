name: DesertBatfly R6 Root Reorg Audit

on:
  push:
    branches:
      - task14-r6-b1-final
    paths:
      - '.github/workflows/desertbatfly-r6-root-reorg-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map legacy root responsibilities and callsites
        shell: bash
        run: |
          set -euo pipefail
          echo '=== branch ==='
          git log -1 --oneline
          echo '=== Intimidation method index ==='
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/Creatures/DesertBatfly/DesertBatflyIntimidation.cs')
          lines = path.read_text(encoding='utf-8').splitlines()
          pat = re.compile(r'^\s*(?:internal|private|public)\s+(?:static\s+)?(?:[\w<>,?.\[\]]+\s+)+(?P<name>[A-Za-z_]\w*)\s*\(')
          for i, line in enumerate(lines, 1):
              m = pat.match(line)
              if m:
                  print(f'{i:4}: {m.group("name")} :: {line.strip()}')
          PY
          echo '=== Intimidation callsites ==='
          git grep -n 'DesertBatflyIntimidation' -- 'src/**/*.cs' 'tests/**/*.cs' || true
          echo '=== DesertBatflyAI callsites ==='
          git grep -n 'DesertBatflyAI' -- 'src/**/*.cs' 'tests/**/*.cs' || true
          echo '=== root DesertBatfly type callsites count ==='
          git grep -n -E '\bDesertBatfly\b' -- 'src/**/*.cs' 'tests/**/*.cs' | wc -l
          echo '=== direct Intimidation state API tokens ==='
          git grep -n -E 'IsExtremeVengeanceActive|TryGetVengeanceTarget|HasActiveFearSuppression|ExecuteVengeanceOwned|Broadcast(PlayerKill|PredatorKill|PredatorCapture)|PersistentTraumaStrength|AddTrauma|IsSupportedLethalThreat|Forget\(' -- 'src/Creatures/DesertBatfly/**/*.cs' 'tests/DesertBatfly/**/*.cs' || true
          echo '=== root files ==='
          find src/Creatures/DesertBatfly -maxdepth 1 -type f -name '*.cs' -printf '%f\n' | sort
