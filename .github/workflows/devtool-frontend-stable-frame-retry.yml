name: DevTool Frontend Stable Frame Retry
on:
  push:
    paths:
      - '.github/workflows/devtool-frontend-stable-frame-retry.yml'
permissions:
  contents: write
jobs:
  patch-and-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/devtool-frontend-stable-frame
          fetch-depth: 0

      - name: Apply lifecycle and allocation fixes
        shell: python
        run: |
          from pathlib import Path

          snap = Path('src/DevUI/DevTool/RWImGui/FloatingWindowSnap.cs')
          s = snap.read_text(encoding='utf-8')
          s = s.replace(
              '        Guides.Clear();\n        if (frame >= nextStaleAuditFrame)',
              '        Guides.Clear();\n        PruneStaleInteractiveState();\n        if (frame >= nextStaleAuditFrame)',
              1)
          s = s.replace('        ImGuiIOPtr io = frameContext.Io;\n', '', 1)

          marker = '\n    private static void DetectResizeEdges('
          assert marker in s
          helper = '''
          
          private static bool IsWindowRecentForInteractiveState(string id)
          {
              return !string.IsNullOrEmpty(id) &&
                     Windows.TryGetValue(id, out WindowState state) &&
                     state.Initialized && state.LastSeenFrame >= frame - 2;
          }
          
          private static void PruneStaleInteractiveState()
          {
              if (Selected.Count > 0)
              {
                  StaleKeys.Clear();
                  foreach (string id in Selected)
                  {
                      if (!IsWindowRecentForInteractiveState(id)) StaleKeys.Add(id);
                  }
                  for (int i = 0; i < StaleKeys.Count; i++) Selected.Remove(StaleKeys[i]);
              }
          
              if (GroupDragOrigins.Count > 0)
              {
                  StaleKeys.Clear();
                  foreach (KeyValuePair<string, Num.Vector2> pair in GroupDragOrigins)
                  {
                      if (!IsWindowRecentForInteractiveState(pair.Key)) StaleKeys.Add(pair.Key);
                  }
                  for (int i = 0; i < StaleKeys.Count; i++) GroupDragOrigins.Remove(StaleKeys[i]);
          
                  if (groupDragging && GroupDragOrigins.Count < 2)
                  {
                      groupDragging = false;
                      groupDragDelta = Num.Vector2.Zero;
                      GroupDragOrigins.Clear();
                  }
              }
              StaleKeys.Clear();
          }
          '''
          s = s.replace(marker, helper + marker, 1)

          old = '                if (Windows.TryGetValue(id, out WindowState state) && state.Initialized)\n                    GroupDragOrigins[id] = state.Position;'
          new = '                if (IsWindowLive(id) && Windows.TryGetValue(id, out WindowState state))\n                    GroupDragOrigins[id] = state.Position;'
          assert old in s
          s = s.replace(old, new, 1)

          group_end = '''            foreach (string id in Selected)
              {
                  if (IsWindowLive(id) && Windows.TryGetValue(id, out WindowState state))
                      GroupDragOrigins[id] = state.Position;
              }
          }'''
          group_end_new = group_end[:-1] + '''
          
              if (GroupDragOrigins.Count < 2)
              {
                  groupDragging = false;
                  GroupDragOrigins.Clear();
              }
          }'''
          assert group_end in s
          s = s.replace(group_end, group_end_new, 1)
          snap.write_text(s, encoding='utf-8')

          font = Path('src/DevUI/DevTool/RWImGui/FontSettingsWindow.cs')
          s = font.read_text(encoding='utf-8')
          s = s.replace(
              'internal static class FontSettingsWindow\n{\n',
              '''internal static class FontSettingsWindow
          {
              private static bool fontStatusProjectionValid;
              private static bool projectedFontStatusChinese;
              private static string projectedFontName = string.Empty;
              private static int projectedActualWeight = int.MinValue;
              private static int projectedWeightVariants = int.MinValue;
              private static string projectedFontStatus = string.Empty;
              private static string projectedResolvedWeightStatus = string.Empty;
              private static string projectedFamilyWeightsStatus = string.Empty;
          ''',
              1)

          old = '''        string friendlyFace = DevToolFontCatalog.FriendlyFaceName(fontName);
          ImGui.TextDisabled(DevToolUiSettings.T("当前字体：", "Font: ") +
                             (string.IsNullOrEmpty(friendlyFace) ? DevToolUiSettings.T("默认", "Default") : friendlyFace));
          ImGui.TextDisabled(DevToolUiSettings.T("实际字重：", "Resolved weight: ") + actualWeight);'''
          new = '''        EnsureFontStatusProjection(fontName, actualWeight, weightVariants);
          ImGui.TextDisabled(projectedFontStatus);
          ImGui.TextDisabled(projectedResolvedWeightStatus);'''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace(
              '            ImGui.TextDisabled(DevToolUiSettings.T("当前字体族字重：", "Family weights: ") + Math.Max(1, weightVariants));',
              '            ImGui.TextDisabled(projectedFamilyWeightsStatus);',
              1)

          marker = '    private static void DrawChineseFontSelector()\n'
          assert marker in s
          helper = '''    private static void EnsureFontStatusProjection(string fontName, int actualWeight, int weightVariants)
          {
              bool chinese = DevToolUiSettings.IsChinese;
              string stableFontName = fontName ?? string.Empty;
              if (fontStatusProjectionValid &&
                  projectedFontStatusChinese == chinese &&
                  projectedActualWeight == actualWeight &&
                  projectedWeightVariants == weightVariants &&
                  string.Equals(projectedFontName, stableFontName, StringComparison.Ordinal))
                  return;
          
              projectedFontStatusChinese = chinese;
              projectedFontName = stableFontName;
              projectedActualWeight = actualWeight;
              projectedWeightVariants = weightVariants;
          
              string friendlyFace = DevToolFontCatalog.FriendlyFaceName(stableFontName);
              projectedFontStatus = DevToolUiSettings.T("当前字体：", "Font: ") +
                                    (string.IsNullOrEmpty(friendlyFace) ? DevToolUiSettings.T("默认", "Default") : friendlyFace);
              projectedResolvedWeightStatus = DevToolUiSettings.T("实际字重：", "Resolved weight: ") + actualWeight;
              projectedFamilyWeightsStatus = DevToolUiSettings.T("当前字体族字重：", "Family weights: ") + Math.Max(1, weightVariants);
              fontStatusProjectionValid = true;
          }
          
          '''
          s = s.replace(marker, helper + marker, 1)
          font.write_text(s, encoding='utf-8')

      - name: Guard architecture and stable-frame invariants
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate-devtool-final-architecture.sh
          ! git diff --name-only | grep -E '^src/DevUI/DevTool/(Core|Presentation|Compatibility|Extensions|Runtime)/'
          grep -q 'PruneStaleInteractiveState();' src/DevUI/DevTool/RWImGui/FloatingWindowSnap.cs
          grep -q 'state.LastSeenFrame >= frame - 2' src/DevUI/DevTool/RWImGui/FloatingWindowSnap.cs
          grep -q 'EnsureFontStatusProjection(fontName, actualWeight, weightVariants);' src/DevUI/DevTool/RWImGui/FontSettingsWindow.cs

      - name: Commit fixes and remove temporary runners
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/devtool-frontend-stable-frame-fix.yml
          rm -f .github/workflows/devtool-frontend-stable-frame-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/DevUI/DevTool/RWImGui .github/workflows
          git commit -m 'Preserve interaction lifetime and cache font status'
          git push origin HEAD:perf/devtool-frontend-stable-frame
