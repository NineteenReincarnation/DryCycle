name: DevTool Frontend Stable Frame Final
on:
  push:
    paths:
      - '.github/workflows/devtool-frontend-stable-frame-final.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/devtool-frontend-stable-frame
          fetch-depth: 0

      - name: Apply floating-window stable-frame cleanup
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/DevUI/DevTool/RWImGui/FloatingWindowSnap.cs')
          s = p.read_text(encoding='utf-8')

          begin_old = '        Guides.Clear();\n        if (frame >= nextStaleAuditFrame)'
          assert begin_old in s
          s = s.replace(begin_old,
              '        Guides.Clear();\n        PruneStaleInteractiveState();\n        if (frame >= nextStaleAuditFrame)', 1)
          s = s.replace('        ImGuiIOPtr io = frameContext.Io;\n', '', 1)

          marker = '\n    private static void DetectResizeEdges('
          assert marker in s
          helper = '''
          
          private static bool IsWindowRecentForInteractiveState(string id)
          {
              return !string.IsNullOrEmpty(id) &&
                     Windows.TryGetValue(id, out WindowState state) &&
                     state.Initialized && state.LastSeenFrame >= frame - 2;
          }
          
          private static void PruneStaleInteractiveState()
          {
              if (Selected.Count > 0)
              {
                  StaleKeys.Clear();
                  foreach (string id in Selected)
                  {
                      if (!IsWindowRecentForInteractiveState(id)) StaleKeys.Add(id);
                  }
                  for (int i = 0; i < StaleKeys.Count; i++) Selected.Remove(StaleKeys[i]);
              }
          
              if (GroupDragOrigins.Count > 0)
              {
                  StaleKeys.Clear();
                  foreach (KeyValuePair<string, Num.Vector2> pair in GroupDragOrigins)
                  {
                      if (!IsWindowRecentForInteractiveState(pair.Key)) StaleKeys.Add(pair.Key);
                  }
                  for (int i = 0; i < StaleKeys.Count; i++) GroupDragOrigins.Remove(StaleKeys[i]);
                  if (groupDragging && GroupDragOrigins.Count < 2)
                  {
                      groupDragging = false;
                      groupDragDelta = Num.Vector2.Zero;
                      GroupDragOrigins.Clear();
                  }
              }
              StaleKeys.Clear();
          }
          '''
          s = s.replace(marker, helper + marker, 1)

          old = '                if (Windows.TryGetValue(id, out WindowState state) && state.Initialized)\n                    GroupDragOrigins[id] = state.Position;'
          assert old in s
          s = s.replace(old,
              '                if (IsWindowLive(id) && Windows.TryGetValue(id, out WindowState state))\n                    GroupDragOrigins[id] = state.Position;', 1)

          tail = '                    GroupDragOrigins[id] = state.Position;\n            }\n        }\n\n        if (groupDragging)'
          assert tail in s
          s = s.replace(tail,
              '                    GroupDragOrigins[id] = state.Position;\n            }\n\n            if (GroupDragOrigins.Count < 2)\n            {\n                groupDragging = false;\n                GroupDragOrigins.Clear();\n            }\n        }\n\n        if (groupDragging)', 1)
          p.write_text(s, encoding='utf-8')

      - name: Run guards
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate-devtool-final-architecture.sh
          ! git diff --name-only | grep -E '^src/DevUI/DevTool/(Core|Presentation|Compatibility|Extensions|Runtime)/'
          grep -q 'PruneStaleInteractiveState();' src/DevUI/DevTool/RWImGui/FloatingWindowSnap.cs
          grep -q 'state.LastSeenFrame >= frame - 2' src/DevUI/DevTool/RWImGui/FloatingWindowSnap.cs
          grep -q 'EnsureFontStatusProjection(fontName, actualWeight, weightVariants);' src/DevUI/DevTool/RWImGui/FontSettingsWindow.cs

      - name: Commit cleanup and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/devtool-frontend-stable-frame-fix.yml
          rm -f .github/workflows/devtool-frontend-stable-frame-retry.yml
          rm -f .github/workflows/devtool-frontend-stable-frame-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/DevUI/DevTool/RWImGui .github/workflows
          git commit -m 'Preserve floating-window interaction lifetime'
          git push origin HEAD:perf/devtool-frontend-stable-frame
