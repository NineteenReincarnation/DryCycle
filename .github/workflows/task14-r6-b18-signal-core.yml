name: Task14 R6 B18 SignalCore split

on:
  push:
    branches: [ task14-r6-b1-final ]

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[r6-b18-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r6-b1-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Split SignalCore by data authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/Creatures/DesertBatfly/Signals/DesertBatflySignalCore.cs')
          text = src.read_text(encoding='utf-8')
          packet_mark = 'internal sealed class DesertBatflySignalPacket'
          influence_mark = 'internal readonly struct DesertBatflySignalInfluence'
          pi = text.index(packet_mark)
          ii = text.index(influence_mark)
          prefix_end = text.index('internal enum DesertBatflySignalKind')
          common = text[:prefix_end]
          type_header = text[:pi]
          packet_body = text[pi:ii]
          type_tail = text[ii:]
          Path('src/Creatures/DesertBatfly/Signals/DB_SignalPacket.cs').write_text(common + packet_body, encoding='utf-8')
          Path('src/Creatures/DesertBatfly/Signals/DB_SignalTypes.cs').write_text(type_header + type_tail, encoding='utf-8')
          src.unlink()

          replacements = {
              'DesertBatflySignalKind': 'DB_SignalKind',
              'DesertBatflySignalPerception': 'DB_SignalPerception',
              'DesertBatflySignalPacket': 'DB_SignalPacket',
              'DesertBatflySignalInfluence': 'DB_SignalInfluence',
              'DesertBatflySignalDisplayState': 'DB_SignalDisplayState',
              'DesertBatflySignalDebugState': 'DB_SignalDebugState',
          }
          for root in (Path('src'), Path('tests'), Path('scripts')):
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.cs','.sh','.py','.md'}:
                      continue
                  value = path.read_text(encoding='utf-8')
                  new = value
                  for old, replacement in replacements.items():
                      new = new.replace(old, replacement)
                  if new != value:
                      path.write_text(new, encoding='utf-8')
          PY
      - name: Validate Signal data contracts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/Creatures/DesertBatfly/Signals/DesertBatflySignalCore.cs
          test -f src/Creatures/DesertBatfly/Signals/DB_SignalPacket.cs
          test -f src/Creatures/DesertBatfly/Signals/DB_SignalTypes.cs
          if git grep -n -E 'DesertBatflySignalKind|DesertBatflySignalPerception|DesertBatflySignalPacket|DesertBatflySignalInfluence|DesertBatflySignalDisplayState|DesertBatflySignalDebugState' -- src tests scripts; then
            echo 'Old SignalCore type identity remains.' >&2
            exit 1
          fi
          grep -q 'class DB_SignalPacket' src/Creatures/DesertBatfly/Signals/DB_SignalPacket.cs
          grep -q 'enum DB_SignalKind' src/Creatures/DesertBatfly/Signals/DB_SignalTypes.cs
          grep -q 'struct DB_SignalInfluence' src/Creatures/DesertBatfly/Signals/DB_SignalTypes.cs
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('src/Creatures/DesertBatfly/Signals/DB_SignalTypes.cs').read_text(encoding='utf-8')
          m = re.search(r'enum\s+DB_SignalKind\s*\{(.*?)\}', text, re.S)
          if not m:
              raise SystemExit('DB_SignalKind enum missing')
          values = [x.strip().split('=')[0].strip() for x in m.group(1).split(',') if x.strip()]
          expected = ['AlarmFlutter','DistressCall','RallySignal','RoostCall','HarassSignal','SafeSignal']
          if values != expected:
              raise SystemExit(f'Signal kind contract changed: {values}')
          PY
          bash scripts/check-desertbatfly-r5-retention.sh
          bash scripts/check-desertbatfly-r6-b1.sh
          git diff --check
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/task14-r6-b18-signal-core.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R6 B18 split SignalCore data contracts [r6-b18-done]'
          git push origin HEAD:task14-r6-b1-final
