name: DevTool Work Gate
on:
  push:
    paths:
      - '.github/workflows/devtool-work-gate.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/devtool-frontend-stable-frame
      - name: Apply visibility work gates
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/DevUI/DevTool/RWImGui/BridgePlugin.cs')
          s=p.read_text()
          old='''                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.SceneWorkspace))\n                        SceneWorkspaceWindow.Draw(snapshot, io.DisplaySize);\n                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.ScenePlacement))\n                        ScenePlacementWindow.Draw(snapshot, io.DisplaySize);'''
          new='''                    // Gate structurally inactive Scene surfaces before entering their timing scopes.\n                    // The windows retain their own defensive guards, but stable frames in Focus mode,\n                    // unsupported tools, or Left placement should not pay measurement/call overhead.\n                    bool sceneSurfaceSupported = !snapshot.FocusMode && ScenePlacementWindow.Supports(snapshot.ToolMode);\n                    if (sceneSurfaceSupported && DevToolUiSettings.SceneInCenter)\n                    {\n                        using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.SceneWorkspace))\n                            SceneWorkspaceWindow.Draw(snapshot, io.DisplaySize);\n                    }\n                    if (sceneSurfaceSupported)\n                    {\n                        using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.ScenePlacement))\n                            ScenePlacementWindow.Draw(snapshot, io.DisplaySize);\n                    }'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1))
      - name: Guard frozen architecture boundaries
        shell: bash
        run: |
          set -euo pipefail
          git diff -- src/DevUI/DevTool/RWImGui/BridgePlugin.cs
          ! git diff --name-only | grep -E '^src/DevUI/DevTool/(Core|Presentation|Compatibility|Extensions)/'
          grep -q 'sceneSurfaceSupported' src/DevUI/DevTool/RWImGui/BridgePlugin.cs
          grep -q 'SceneWorkspaceWindow.Draw' src/DevUI/DevTool/RWImGui/BridgePlugin.cs
          grep -q 'ScenePlacementWindow.Draw' src/DevUI/DevTool/RWImGui/BridgePlugin.cs
      - name: Commit patch and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/devtool-work-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/DevUI/DevTool/RWImGui/BridgePlugin.cs .github/workflows/devtool-work-gate.yml
          git commit -m 'Gate inactive DevTool scene surfaces'
          git push origin HEAD:perf/devtool-frontend-stable-frame