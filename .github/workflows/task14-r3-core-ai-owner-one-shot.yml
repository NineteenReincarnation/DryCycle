name: Task14 R3 core AI owner one-shot

on:
  push:
    branches:
      - task14-r3-arbiter

permissions:
  contents: write

jobs:
  apply-r3-core-ai-owner:
    if: github.event.head_commit.message == 'Trigger R3 core AI owner migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r3-arbiter
          fetch-depth: 0

      - name: Apply guarded core AI owner migration
        run: python scripts/task14_r3_core_ai_owner_apply.py

      - name: Validate core AI owner migration
        run: |
          git diff --check
          test ! -e scripts/task14_r3_core_ai_owner_apply.py
          test ! -e .github/workflows/task14-r3-core-ai-owner-one-shot.yml
          grep -q 'RefreshDecisionState' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          grep -q 'ExecuteCombatOwned' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          grep -q 'DB_CoreDecisionExecutor.TryExecute' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          grep -q 'DesertBatflyThreatRuntime.RefreshState' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          ! grep -q 'DesertBatflyThreatRuntime.Update(desert)' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          grep -q 'R3-CLOSED-08' docs/Discussion/Task_14_R3_FrameArbiterStatus.txt

      - name: Commit core AI owner migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Gate core DesertBatfly AI behind R3 arbiter'
          git push origin HEAD:task14-r3-arbiter
