name: DevTool Frontend Finalization Pass
on:
  push:
    paths:
      - '.github/workflows/devtool-frontend-finalize-pass.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/devtool-frontend-stable-frame
          fetch-depth: 0
      - name: Apply frame-context and stable-frame hot-path pass
        shell: python
        run: |
          from pathlib import Path

          # BridgePlugin: construct one frame context, share it with frontend surfaces, and retain
          # the CJK font selection until the family/weight preference actually changes.
          p = Path('src/DevUI/DevTool/RWImGui/BridgePlugin.cs')
          s = p.read_text(encoding='utf-8')

          old = '''    private static ImFontPtr cjkFont;\n    private static string resolvedFontName = string.Empty;\n    private static int resolvedFontWeight = DevToolUiSettings.DefaultFontWeight;\n    private static int resolvedFontWeightVariantCount = 1;'''
          new = '''    private static ImFontPtr cjkFont;\n    private static string resolvedFontName = string.Empty;\n    private static int resolvedFontWeight = DevToolUiSettings.DefaultFontWeight;\n    private static int resolvedFontWeightVariantCount = 1;\n    private static bool cjkSelectionValid;\n    private static string projectedCjkFamily = string.Empty;\n    private static int projectedCjkWeight = int.MinValue;'''
          assert old in s, 'BridgePlugin font field anchor changed'
          s = s.replace(old, new, 1)

          old = '''            ImGuiIOPtr io = ImGui.GetIO();\n\n            // Rain World's developer cursor remains authoritative.'''
          new = '''            ImGuiIOPtr io = ImGui.GetIO();\n            DevToolUiFrameContext frameContext = new(io);\n\n            // Rain World's developer cursor remains authoritative.'''
          assert old in s, 'BridgePlugin frame-context anchor changed'
          s = s.replace(old, new, 1)

          s = s.replace('FloatingWindowSnap.BeginFrame(io.DisplaySize);', 'FloatingWindowSnap.BeginFrame(frameContext);', 1)
          s = s.replace('FontSettingsWindow.Draw(io.DisplaySize);', 'FontSettingsWindow.Draw(frameContext.DisplaySize);', 1)
          s = s.replace('DevToolOverlay.Draw(snapshot);', 'DevToolOverlay.Draw(snapshot, frameContext);', 1)
          s = s.replace('SceneWorkspaceWindow.Draw(snapshot, io.DisplaySize);', 'SceneWorkspaceWindow.Draw(snapshot, frameContext.DisplaySize);', 1)
          s = s.replace('ScenePlacementWindow.Draw(snapshot, io.DisplaySize);', 'ScenePlacementWindow.Draw(snapshot, frameContext.DisplaySize);', 1)
          s = s.replace('ActionToastOverlay.Draw(snapshot, io.DisplaySize);', 'ActionToastOverlay.Draw(snapshot, frameContext);', 1)

          old = '''        string preferredFamily = DevToolUiSettings.ChineseFontFamily;\n        bool preferredAvailable = false;'''
          new = '''        string preferredFamily = DevToolUiSettings.ChineseFontFamily ?? string.Empty;\n        int preferredWeight = DevToolUiSettings.FontWeight;\n        if (cjkSelectionValid &&\n            projectedCjkWeight == preferredWeight &&\n            string.Equals(projectedCjkFamily, preferredFamily, StringComparison.OrdinalIgnoreCase))\n            return;\n\n        projectedCjkFamily = preferredFamily;\n        projectedCjkWeight = preferredWeight;\n        cjkSelectionValid = true;\n\n        bool preferredAvailable = false;'''
          assert old in s, 'BridgePlugin CJK selection anchor changed'
          s = s.replace(old, new, 1)
          s = s.replace('Math.Abs(candidate.Weight - DevToolUiSettings.FontWeight)', 'Math.Abs(candidate.Weight - preferredWeight)', 1)
          p.write_text(s, encoding='utf-8')

          # Overlay: reuse the already-captured IO/display state instead of re-querying ImGui.
          p = Path('src/DevUI/DevTool/RWImGui/DevToolOverlay.cs')
          s = p.read_text(encoding='utf-8')
          old = '''    internal static void Draw(EditorPresentationSnapshot snapshot)\n    {\n        ImGuiIOPtr io = ImGui.GetIO();\n        Num.Vector2 display = io.DisplaySize;\n        if (display.X < 1f) display.X = 1366f;\n        if (display.Y < 1f) display.Y = 768f;'''
          new = '''    internal static void Draw(EditorPresentationSnapshot snapshot, DevToolUiFrameContext frameContext)\n    {\n        ImGuiIOPtr io = frameContext.Io;\n        Num.Vector2 display = frameContext.DisplaySize;'''
          assert old in s, 'DevToolOverlay Draw anchor changed'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Toast: share frame context for display/text-input/key-edge state. Modifier queries remain
          # lazy and only run on actual key-down edges, preserving Command/Ctrl behavior.
          p = Path('src/DevUI/DevTool/RWImGui/ActionToastOverlay.cs')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'internal static void Draw(EditorPresentationSnapshot snapshot, Num.Vector2 display)',
              'internal static void Draw(EditorPresentationSnapshot snapshot, DevToolUiFrameContext frameContext)',
              1)
          s = s.replace(
              '''    {\n        // ActionToastOverlay is already part of the guaranteed per-frame frontend render chain.''',
              '''    {\n        Num.Vector2 display = frameContext.DisplaySize;\n\n        // ActionToastOverlay is already part of the guaranteed per-frame frontend render chain.''',
              1)
          s = s.replace('ObserveShortcuts(snapshot);', 'ObserveShortcuts(snapshot, frameContext);', 1)
          s = s.replace(
              'private static void ObserveShortcuts(EditorPresentationSnapshot snapshot)',
              'private static void ObserveShortcuts(EditorPresentationSnapshot snapshot, DevToolUiFrameContext frameContext)',
              1)
          s = s.replace('if (!global::UnityEngine.Input.anyKeyDown) return;', 'if (!frameContext.AnyKeyDown) return;', 1)
          old = '''        ImGuiIOPtr io = ImGui.GetIO();\n        if (io.WantTextInput || EditorInputRouter.WantsTextInput) return;'''
          new = '''        if (frameContext.WantTextInput || EditorInputRouter.WantsTextInput) return;'''
          assert old in s, 'ActionToast IO anchor changed'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # FloatingWindowSnap: centralize one-frame input state, remove per-window IsMouseDown calls,
          # and make stale-state cleanup a low-frequency audit. Hit tests remain event-driven only.
          p = Path('src/DevUI/DevTool/RWImGui/FloatingWindowSnap.cs')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'private const float GeometryEpsilon = 0.25f;',
              'private const float GeometryEpsilon = 0.25f;\n    private const int StaleAuditIntervalFrames = 60;',
              1)
          old = '''    private static Num.Vector2 displaySize;\n    private static int frame;\n    private static int nextGroupId = 1;'''
          new = '''    private static Num.Vector2 displaySize;\n    private static int frame;\n    private static int nextGroupId = 1;\n    private static int nextStaleAuditFrame;\n    private static bool leftMouseDownThisFrame;'''
          assert old in s, 'FloatingWindowSnap state anchor changed'
          s = s.replace(old, new, 1)

          old = '''    internal static void BeginFrame(Num.Vector2 currentDisplaySize)\n    {\n        frame++;\n        displaySize = currentDisplaySize;\n        if (displaySize.X < 1f) displaySize.X = 1366f;\n        if (displaySize.Y < 1f) displaySize.Y = 768f;\n\n        Guides.Clear();\n        RemoveStaleWindows();\n\n        ImGuiIOPtr io = ImGui.GetIO();\n        bool leftDown = ImGui.IsMouseDown(ImGuiMouseButton.Left);'''
          new = '''    internal static void BeginFrame(DevToolUiFrameContext frameContext)\n    {\n        frame++;\n        displaySize = frameContext.DisplaySize;\n\n        Guides.Clear();\n        if (frame >= nextStaleAuditFrame)\n        {\n            RemoveStaleWindows();\n            nextStaleAuditFrame = frame + StaleAuditIntervalFrames;\n        }\n\n        ImGuiIOPtr io = frameContext.Io;\n        bool leftDown = frameContext.LeftMouseDown;\n        leftMouseDownThisFrame = leftDown;'''
          assert old in s, 'FloatingWindowSnap BeginFrame anchor changed'
          s = s.replace(old, new, 1)

          old = '''        if (!io.WantTextInput && io.KeyCtrl && !io.KeyShift && ImGui.IsKeyPressed(ImGuiKey.G))\n            CreateGroupFromSelection();'''
          new = '''        if (frameContext.GroupShortcutPressed)\n            CreateGroupFromSelection();'''
          assert old in s, 'FloatingWindowSnap group shortcut anchor changed'
          s = s.replace(old, new, 1)

          s = s.replace('if (io.KeyShift && ImGui.IsMouseClicked(ImGuiMouseButton.Left))', 'if (frameContext.KeyShift && frameContext.LeftMouseClicked)', 1)
          s = s.replace('TryFindWindowAtPoint(io.MousePos, selectedOnly: false, titleOnly: false, out string hit)', 'TryFindWindowAtPoint(frameContext.MousePosition, selectedOnly: false, titleOnly: false, out string hit)', 1)
          s = s.replace('if (!io.KeyCtrl) Selected.Clear();', 'if (!frameContext.KeyCtrl) Selected.Clear();', 1)
          s = s.replace('marqueeAdditive = io.KeyCtrl;', 'marqueeAdditive = frameContext.KeyCtrl;', 1)
          s = s.replace('marqueeStart = io.MousePos;', 'marqueeStart = frameContext.MousePosition;', 1)
          s = s.replace('marqueeCurrent = io.MousePos;', 'marqueeCurrent = frameContext.MousePosition;', 1)
          s = s.replace('marqueeCurrent = io.MousePos;', 'marqueeCurrent = frameContext.MousePosition;', 1)
          s = s.replace('if (ImGui.IsMouseReleased(ImGuiMouseButton.Left) || !leftDown)', 'if (frameContext.LeftMouseReleased || !leftDown)', 1)

          old = '''        if (!io.KeyShift && !groupDragging && ImGui.IsMouseClicked(ImGuiMouseButton.Left) &&\n            TryFindWindowAtPoint(io.MousePos, selectedOnly: false, titleOnly: true, out string groupHit) &&'''
          new = '''        if (!frameContext.KeyShift && !groupDragging && frameContext.LeftMouseClicked &&\n            TryFindWindowAtPoint(frameContext.MousePosition, selectedOnly: false, titleOnly: true, out string groupHit) &&'''
          assert old in s, 'FloatingWindowSnap group hit-test anchor changed'
          s = s.replace(old, new, 1)

          old = '''        if (!io.KeyShift && !groupDragging && Selected.Count > 1 &&\n            ImGui.IsMouseClicked(ImGuiMouseButton.Left) &&\n            TryFindWindowAtPoint(io.MousePos, selectedOnly: true, titleOnly: true, out _))'''
          new = '''        if (!frameContext.KeyShift && !groupDragging && Selected.Count > 1 &&\n            frameContext.LeftMouseClicked &&\n            TryFindWindowAtPoint(frameContext.MousePosition, selectedOnly: true, titleOnly: true, out _))'''
          assert old in s, 'FloatingWindowSnap selection drag anchor changed'
          s = s.replace(old, new, 1)
          s = s.replace('groupDragStartMouse = io.MousePos;', 'groupDragStartMouse = frameContext.MousePosition;', 1)
          s = s.replace('groupDragDelta = io.MousePos - groupDragStartMouse;', 'groupDragDelta = frameContext.MousePosition - groupDragStartMouse;', 1)
          s = s.replace('bool mouseDown = ImGui.IsMouseDown(ImGuiMouseButton.Left);', 'bool mouseDown = leftMouseDownThisFrame;', 1)
          p.write_text(s, encoding='utf-8')

      - name: Validate frontend-only boundaries and hot-path invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff -- src/DevUI/DevTool/RWImGui
          ! git diff --name-only | grep -E '^src/DevUI/DevTool/(Core|Presentation|Compatibility|Extensions|Runtime)/'
          grep -q 'DevToolUiFrameContext frameContext = new(io);' src/DevUI/DevTool/RWImGui/BridgePlugin.cs
          grep -q 'cjkSelectionValid' src/DevUI/DevTool/RWImGui/BridgePlugin.cs
          grep -q 'FloatingWindowSnap.BeginFrame(frameContext)' src/DevUI/DevTool/RWImGui/BridgePlugin.cs
          grep -q 'internal static void BeginFrame(DevToolUiFrameContext frameContext)' src/DevUI/DevTool/RWImGui/FloatingWindowSnap.cs
          grep -q 'StaleAuditIntervalFrames = 60' src/DevUI/DevTool/RWImGui/FloatingWindowSnap.cs
          ! grep -q 'bool mouseDown = ImGui.IsMouseDown(ImGuiMouseButton.Left);' src/DevUI/DevTool/RWImGui/FloatingWindowSnap.cs
          grep -q 'internal static void Draw(EditorPresentationSnapshot snapshot, DevToolUiFrameContext frameContext)' src/DevUI/DevTool/RWImGui/ActionToastOverlay.cs
          grep -q 'internal static void Draw(EditorPresentationSnapshot snapshot, DevToolUiFrameContext frameContext)' src/DevUI/DevTool/RWImGui/DevToolOverlay.cs
      - name: Commit finalization pass and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/devtool-frontend-finalize-pass.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/DevUI/DevTool/RWImGui .github/workflows/devtool-frontend-finalize-pass.yml
          git commit -m 'Optimize frontend stable-frame input and font selection'
          git push origin HEAD:perf/devtool-frontend-stable-frame
