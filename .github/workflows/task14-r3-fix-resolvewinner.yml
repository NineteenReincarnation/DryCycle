name: Task14 R3 ResolveWinner ambiguity fix

on:
  push:
    branches:
      - task14-r3-arbiter

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Trigger R3 ResolveWinner ambiguity fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r3-arbiter
          fetch-depth: 0
      - name: Fix guarded overload ambiguity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/Creatures/DesertBatfly/Runtime/DB_BehaviorArbiter.cs')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('DB_BehaviorProposal winner = ResolveWinner(\n', 'DB_BehaviorProposal winner = ResolveWinnerCore(\n'),
              ('=> ResolveWinner(proposals, DB_BehaviorOwner.None, null, null);', '=> ResolveWinnerCore(proposals, DB_BehaviorOwner.None, null, null);'),
              ('private static DB_BehaviorProposal ResolveWinner(\n', 'private static DB_BehaviorProposal ResolveWinnerCore(\n'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected one match for {old!r}, got {s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          Path('.github/workflows/task14-r3-fix-resolvewinner.yml').unlink()
          PY
          git diff --check
          grep -q 'private static DB_BehaviorProposal ResolveWinnerCore' src/Creatures/DesertBatfly/Runtime/DB_BehaviorArbiter.cs
          test "$(grep -c 'internal static DB_BehaviorProposal ResolveWinner(' src/Creatures/DesertBatfly/Runtime/DB_BehaviorArbiter.cs)" -eq 1
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix R3 ResolveWinner reflection ambiguity'
          git push origin HEAD:task14-r3-arbiter
