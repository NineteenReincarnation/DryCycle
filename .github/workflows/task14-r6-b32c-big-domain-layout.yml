name: Task14 R6 B32c big-domain layout

on:
  push:
    branches: [ task14-r6-b1-final ]

permissions:
  contents: write

jobs:
  reorganize:
    if: "!contains(github.event.head_commit.message, '[r6-b32c-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r6-b1-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build big-domain layout
        shell: bash
        run: |
          set -euo pipefail
          root=src/Creatures/DesertBatfly
          mkdir -p "$root/Behavior" "$root/Core"

          for dir in Combat Injury Perception Roost Signals Social Threat ThreatSignature; do
            test -d "$root/$dir"
            test ! -e "$root/Behavior/$dir"
            git mv "$root/$dir" "$root/Behavior/$dir"
          done

          test -d "$root/Runtime"
          test ! -e "$root/Core/Runtime"
          git mv "$root/Runtime" "$root/Core/Runtime"

          python3 - <<'PY'
          from pathlib import Path
          mapping = {
              'src/Creatures/DesertBatfly/Combat/': 'src/Creatures/DesertBatfly/Behavior/Combat/',
              'src/Creatures/DesertBatfly/Injury/': 'src/Creatures/DesertBatfly/Behavior/Injury/',
              'src/Creatures/DesertBatfly/Perception/': 'src/Creatures/DesertBatfly/Behavior/Perception/',
              'src/Creatures/DesertBatfly/Roost/': 'src/Creatures/DesertBatfly/Behavior/Roost/',
              'src/Creatures/DesertBatfly/Signals/': 'src/Creatures/DesertBatfly/Behavior/Signals/',
              'src/Creatures/DesertBatfly/Social/': 'src/Creatures/DesertBatfly/Behavior/Social/',
              'src/Creatures/DesertBatfly/Threat/': 'src/Creatures/DesertBatfly/Behavior/Threat/',
              'src/Creatures/DesertBatfly/ThreatSignature/': 'src/Creatures/DesertBatfly/Behavior/ThreatSignature/',
              'src/Creatures/DesertBatfly/Runtime/': 'src/Creatures/DesertBatfly/Core/Runtime/',
          }
          for name in ['scripts/check-desertbatfly-r5-retention.sh', 'scripts/check-desertbatfly-r6-b1.sh']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate big-domain layout
        shell: bash
        run: |
          set -euo pipefail
          root=src/Creatures/DesertBatfly

          # First-level project domains.
          for dir in Core Behavior World Presentation Integration Debug; do test -d "$root/$dir"; done

          # Behavior keeps meaningful subdomains instead of flattening them.
          for dir in Combat Injury Perception Roost Signals Social Threat ThreatSignature; do
            test -d "$root/Behavior/$dir"
            test ! -d "$root/$dir"
          done

          # Runtime is infrastructure under Core, not another root-level domain.
          test -d "$root/Core/Runtime"
          test ! -d "$root/Runtime"
          test -f "$root/Core/Runtime/DB_Runtime.cs"
          test -f "$root/Core/Runtime/DB_FlightMotor.cs"

          # World keeps semantic subdomains.
          for dir in Colony Environment Travel; do test -d "$root/World/$dir"; done

          # Integration remains intentionally flat because DB_ filenames already distinguish roles.
          test -f "$root/Integration/DB_RainWorldHooks.cs"
          test -f "$root/Integration/DB_RuntimePatch.cs"
          test -f "$root/Integration/DB_Sandbox.cs"
          test -f "$root/Integration/DB_WarpCompatibility.cs"

          bash scripts/check-desertbatfly-r5-retention.sh
          bash scripts/check-desertbatfly-r6-b1.sh

          git grep -q 'DCDesertBatflyV1' -- src tests
          git grep -q 'DCDesertBatflyThreatV1' -- src tests
          git grep -q 'DCBATCOLONY09<svB>' -- src tests
          git grep -q 'DESERTSWARMROOM' -- src tests
          git diff --check

          # B32c production source is strictly path-only.
          if git diff --cached --numstat -- src/Creatures/DesertBatfly | awk '$1 != "0" || $2 != "0" { bad=1 } END { exit bad }'; then :; else
            echo 'Production DesertBatfly source changed during path-only B32c.' >&2
            exit 1
          fi
          git diff --cached --summary | grep -q 'rename src/Creatures/DesertBatfly/Combat/'
          git diff --cached --summary | grep -q 'rename src/Creatures/DesertBatfly/Runtime/'

      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/task14-r6-b32c-big-domain-layout.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R6 B32c organize big domains with semantic subfolders [r6-b32c-done]'
          git push origin HEAD:task14-r6-b1-final
