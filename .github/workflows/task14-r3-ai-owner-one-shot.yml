name: Task14 R3 AI owner one-shot

on:
  push:
    branches:
      - task14-r3-arbiter

permissions:
  contents: write

jobs:
  apply-r3-ai-owner:
    if: github.event.head_commit.message == 'Trigger R3 AI owner migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r3-arbiter
          fetch-depth: 0

      - name: Apply guarded R3 AI owner migration
        run: python scripts/task14_r3_ai_owner_apply.py

      - name: Validate R3 ordinary single-owner structure
        run: |
          git diff --check
          test ! -e scripts/task14_r3_ai_owner_apply.py
          test ! -e scripts/task14_r3_ai_owner_trigger.txt
          test ! -e .github/workflows/task14-r3-ai-owner-one-shot.yml
          grep -q 'internal void RefreshDecisionState()' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          grep -q 'ExecuteImmediateDangerOwned' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          grep -q 'ExecuteFearOwned' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          grep -q 'ExecuteCombatOwned' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          grep -q 'ExecuteRoostOwned' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          grep -q 'SteerOwned' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          ! grep -q 'private void ScanWeapons' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          ! grep -q 'desert.DesertAI.Update();' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          grep -q 'DesertBatflyThreatRuntime.RefreshState(desert)' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          grep -q 'ExecuteNativeOwned' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          grep -q 'DB_ImmediateDangerExecutor.TryExecute' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          grep -q 'DB_FearExecutor.TryExecute' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          grep -q 'DB_CombatExecutor.TryExecute' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          grep -q 'DB_RoostExecutor.TryExecute' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          grep -q 'ApplyOwnedTacticalModifier' src/Creatures/DesertBatfly/ThreatSignature/DesertBatflyThreatRuntime.cs
          grep -q 'PrimaryOwner=Combat' src/Creatures/DesertBatfly/Runtime/DB_CombatExecutor.cs
          grep -q 'R3-CLOSED-01' docs/Discussion/Task_14_R3_FrameArbiterStatus.txt

      - name: Commit R3 AI owner migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Gate DesertBatfly AI locomotion behind R3 arbiter'
          git push origin HEAD:task14-r3-arbiter
