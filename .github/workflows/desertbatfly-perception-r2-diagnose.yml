name: DesertBatfly Perception R2 Diagnose

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/check-desertbatfly-function-retention.sh'
      - '.github/workflows/desertbatfly-perception-r2-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace function retention
        shell: bash
        run: bash -x scripts/check-desertbatfly-function-retention.sh
