name: Fix creature catalog popup sizing

on:
  push:
    paths:
      - '.github/workflows/fix-creature-catalog-popup-size.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stabilize creature catalog popup sizing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/DevUI/DevTool/RWImGui/WorldCreatureCatalogPicker.cs')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()

          def find_line(value):
              hits = [i for i, line in enumerate(lines) if line == value]
              if len(hits) != 1:
                  raise SystemExit(f'expected one line {value!r}, found {len(hits)}')
              return hits[0]

          search_state = '    private static readonly Dictionary<string, string> searchByPicker = new(StringComparer.Ordinal);'
          i = find_line(search_state)
          lines.insert(i + 1, '    private static readonly Dictionary<string, Num.Vector2> pickerSizeByPopup = new(StringComparer.Ordinal);')

          shutdown_clear = '        searchByPicker.Clear();'
          i = find_line(shutdown_clear)
          lines.insert(i + 1, '        pickerSizeByPopup.Clear();')

          size_start = find_line('        ImGuiIOPtr io = ImGui.GetIO();')
          popup_begin = find_line('        if (!ImGui.BeginPopup(popupId)) return false;')
          size_block = [
              '        ImGuiIOPtr io = ImGui.GetIO();',
              '        Num.Vector2 desired = new(',
              '            Math.Min(900f, Math.Max(560f, io.DisplaySize.X * 0.58f)),',
              '            Math.Min(720f, Math.Max(430f, io.DisplaySize.Y * 0.72f)));',
              '        Num.Vector2 minSize = new(',
              '            Math.Min(520f, Math.Max(280f, io.DisplaySize.X - 24f)),',
              '            Math.Min(360f, Math.Max(220f, io.DisplaySize.Y - 24f)));',
              '        Num.Vector2 maxSize = new(',
              '            Math.Max(520f, io.DisplaySize.X - 20f),',
              '            Math.Max(360f, io.DisplaySize.Y - 20f));',
              '        Num.Vector2 requestedSize = pickerSizeByPopup.TryGetValue(popupId, out Num.Vector2 rememberedSize)',
              '            ? ClampPickerSize(rememberedSize, minSize, maxSize)',
              '            : ClampPickerSize(desired, minSize, maxSize);',
              '',
              '        // Keep the outer popup size authoritative. A fill-remaining child inside an auto-fit popup',
              '        // otherwise creates a parent/child feedback loop that progressively shrinks the window.',
              '        ImGui.SetNextWindowSize(requestedSize, ImGuiCond.Always);',
              '        ImGui.SetNextWindowSizeConstraints(minSize, maxSize);',
              '',
              '        if (!ImGui.BeginPopup(popupId)) return false;',
              '        pickerSizeByPopup[popupId] = ClampPickerSize(ImGui.GetWindowSize(), minSize, maxSize);',
          ]
          lines[size_start:popup_begin + 1] = size_block

          child_line = '        if (ImGui.BeginChild("##CreatureCatalogScroll_" + widgetId, new Num.Vector2(0f, 0f), ImGuiChildFlags.None))'
          i = find_line(child_line)
          lines[i:i + 1] = [
              '        float scrollHeight = Math.Max(1f, ImGui.GetContentRegionAvail().Y);',
              '        if (ImGui.BeginChild("##CreatureCatalogScroll_" + widgetId, new Num.Vector2(0f, scrollHeight), ImGuiChildFlags.None))',
          ]

          filter_anchor = '    private static CreatureEntry[] GetFilteredEntries(SourceGroup group, string search, int revision)'
          i = find_line(filter_anchor)
          helper = [
              '    private static Num.Vector2 ClampPickerSize(Num.Vector2 value, Num.Vector2 min, Num.Vector2 max)',
              '    {',
              '        return new Num.Vector2(',
              '            Math.Max(min.X, Math.Min(max.X, value.X)),',
              '            Math.Max(min.Y, Math.Min(max.Y, value.Y)));',
              '    }',
              '',
          ]
          lines[i:i] = helper

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Verify popup sizing fix
        shell: bash
        run: |
          set -euo pipefail
          file='src/DevUI/DevTool/RWImGui/WorldCreatureCatalogPicker.cs'
          grep -Fq 'pickerSizeByPopup' "$file"
          grep -Fq 'ImGui.SetNextWindowSize(requestedSize, ImGuiCond.Always);' "$file"
          grep -Fq 'float scrollHeight = Math.Max(1f, ImGui.GetContentRegionAvail().Y);' "$file"
          grep -Fq 'private static Num.Vector2 ClampPickerSize' "$file"
          ! grep -Fq 'if (ImGui.BeginChild("##CreatureCatalogScroll_" + widgetId, new Num.Vector2(0f, 0f), ImGuiChildFlags.None))' "$file"

      - name: Commit fix directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-creature-catalog-popup-size.yml
          git add src/DevUI/DevTool/RWImGui/WorldCreatureCatalogPicker.cs
          git commit -m 'DevTool: stabilize creature catalog popup size'
          git pull --rebase origin main
          git push origin HEAD:main
