name: Fix creature catalog popup sizing

on:
  push:
    paths:
      - '.github/workflows/fix-creature-catalog-popup-size.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stabilize creature catalog popup sizing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/DevUI/DevTool/RWImGui/WorldCreatureCatalogPicker.cs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '    private static readonly Dictionary<string, string> searchByPicker = new(StringComparer.Ordinal);\n'
              '    private static readonly Dictionary<string, FilterCacheEntry> filterCache = new(StringComparer.OrdinalIgnoreCase);\n',
              '    private static readonly Dictionary<string, string> searchByPicker = new(StringComparer.Ordinal);\n'
              '    private static readonly Dictionary<string, Num.Vector2> pickerSizeByPopup = new(StringComparer.Ordinal);\n'
              '    private static readonly Dictionary<string, FilterCacheEntry> filterCache = new(StringComparer.OrdinalIgnoreCase);\n',
              'picker size state')

          replace_once(
              '        searchByPicker.Clear();\n'
              '        filterCache.Clear();\n',
              '        searchByPicker.Clear();\n'
              '        pickerSizeByPopup.Clear();\n'
              '        filterCache.Clear();\n',
              'picker size reset')

          old_size = '''        ImGuiIOPtr io = ImGui.GetIO();
        Num.Vector2 desired = new(
            Math.Min(900f, Math.Max(560f, io.DisplaySize.X * 0.58f)),
            Math.Min(720f, Math.Max(430f, io.DisplaySize.Y * 0.72f)));
        ImGui.SetNextWindowSize(desired, ImGuiCond.Appearing);
        ImGui.SetNextWindowSizeConstraints(
            new Num.Vector2(
                Math.Min(520f, Math.Max(280f, io.DisplaySize.X - 24f)),
                Math.Min(360f, Math.Max(220f, io.DisplaySize.Y - 24f))),
            new Num.Vector2(
                Math.Max(520f, io.DisplaySize.X - 20f),
                Math.Max(360f, io.DisplaySize.Y - 20f)));

        if (!ImGui.BeginPopup(popupId)) return false;
'''
          new_size = '''        ImGuiIOPtr io = ImGui.GetIO();
        Num.Vector2 desired = new(
            Math.Min(900f, Math.Max(560f, io.DisplaySize.X * 0.58f)),
            Math.Min(720f, Math.Max(430f, io.DisplaySize.Y * 0.72f)));
        Num.Vector2 minSize = new(
            Math.Min(520f, Math.Max(280f, io.DisplaySize.X - 24f)),
            Math.Min(360f, Math.Max(220f, io.DisplaySize.Y - 24f)));
        Num.Vector2 maxSize = new(
            Math.Max(520f, io.DisplaySize.X - 20f),
            Math.Max(360f, io.DisplaySize.Y - 20f));
        Num.Vector2 requestedSize = pickerSizeByPopup.TryGetValue(popupId, out Num.Vector2 rememberedSize)
            ? ClampPickerSize(rememberedSize, minSize, maxSize)
            : ClampPickerSize(desired, minSize, maxSize);

        // A popup whose final child consumes (0, 0) can feed its remaining content size back into
        // the outer auto-fit calculation. Re-submit the last accepted outer size every frame so
        // content overflow becomes scrolling instead of progressively shrinking the popup.
        ImGui.SetNextWindowSize(requestedSize, ImGuiCond.Always);
        ImGui.SetNextWindowSizeConstraints(minSize, maxSize);

        if (!ImGui.BeginPopup(popupId)) return false;
        pickerSizeByPopup[popupId] = ClampPickerSize(ImGui.GetWindowSize(), minSize, maxSize);
'''
          replace_once(old_size, new_size, 'popup size block')

          replace_once(
              '        ImGui.Spacing();\n'
              '        if (ImGui.BeginChild("##CreatureCatalogScroll_" + widgetId, new Num.Vector2(0f, 0f), ImGuiChildFlags.None))\n',
              '        ImGui.Spacing();\n'
              '        float scrollHeight = Math.Max(1f, ImGui.GetContentRegionAvail().Y);\n'
              '        if (ImGui.BeginChild("##CreatureCatalogScroll_" + widgetId, new Num.Vector2(0f, scrollHeight), ImGuiChildFlags.None))\n',
              'catalog scroll child')

          helper_anchor = '''    private static CreatureEntry[] GetFilteredEntries(SourceGroup group, string search, int revision)
'''
          helper = '''    private static Num.Vector2 ClampPickerSize(Num.Vector2 value, Num.Vector2 min, Num.Vector2 max)
    {
        return new Num.Vector2(
            Math.Max(min.X, Math.Min(max.X, value.X)),
            Math.Max(min.Y, Math.Min(max.Y, value.Y)));
    }

'''
          replace_once(helper_anchor, helper + helper_anchor, 'size clamp helper')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify popup sizing fix
        shell: bash
        run: |
          set -euo pipefail
          file='src/DevUI/DevTool/RWImGui/WorldCreatureCatalogPicker.cs'
          grep -Fq 'pickerSizeByPopup' "$file"
          grep -Fq 'ImGui.SetNextWindowSize(requestedSize, ImGuiCond.Always);' "$file"
          grep -Fq 'float scrollHeight = Math.Max(1f, ImGui.GetContentRegionAvail().Y);' "$file"
          grep -Fq 'private static Num.Vector2 ClampPickerSize' "$file"
          test "$(grep -Fc 'new Num.Vector2(0f, 0f), ImGuiChildFlags.None' "$file")" -eq 0

      - name: Commit fix directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-creature-catalog-popup-size.yml
          git add src/DevUI/DevTool/RWImGui/WorldCreatureCatalogPicker.cs
          git commit -m 'DevTool: stabilize creature catalog popup size'
          git pull --rebase origin main
          git push origin HEAD:main
