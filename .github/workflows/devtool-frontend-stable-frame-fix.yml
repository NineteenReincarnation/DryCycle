name: DevTool Frontend Stable Frame Fix
on:
  push:
    paths:
      - '.github/workflows/devtool-frontend-stable-frame-fix.yml'
permissions:
  contents: write
jobs:
  patch-and-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/devtool-frontend-stable-frame
          fetch-depth: 0

      - name: Fix retained selection lifetime and stable font strings
        shell: python
        run: |
          from pathlib import Path

          # FloatingWindowSnap: preserve the old two-frame interactive-state lifetime without
          # returning to an O(all windows) cleanup every frame. Selected/group-drag sets are tiny
          # and are the only state that must be exact before input is processed.
          p = Path('src/DevUI/DevTool/RWImGui/FloatingWindowSnap.cs')
          s = p.read_text(encoding='utf-8')

          old = '''        Guides.Clear();
          if (frame >= nextStaleAuditFrame)
          {
              RemoveStaleWindows();
              nextStaleAuditFrame = frame + StaleAuditIntervalFrames;
          }

          ImGuiIOPtr io = frameContext.Io;
          bool leftDown = frameContext.LeftMouseDown;'''
          new = '''        Guides.Clear();
          PruneStaleInteractiveState();
          if (frame >= nextStaleAuditFrame)
          {
              RemoveStaleWindows();
              nextStaleAuditFrame = frame + StaleAuditIntervalFrames;
          }

          bool leftDown = frameContext.LeftMouseDown;'''
          if old not in s:
              raise SystemExit('FloatingWindowSnap BeginFrame anchor changed')
          s = s.replace(old, new, 1)

          old = '''    private static bool IsWindowLive(string id)
          {
              return !string.IsNullOrEmpty(id) &&
                     Windows.TryGetValue(id, out WindowState state) &&
                     state.Initialized && state.LastSeenFrame >= frame - 1;
          }

          private static void DetectResizeEdges'''
          new = '''    private static bool IsWindowLive(string id)
          {
              return !string.IsNullOrEmpty(id) &&
                     Windows.TryGetValue(id, out WindowState state) &&
                     state.Initialized && state.LastSeenFrame >= frame - 1;
          }

          private static bool IsWindowRecentForInteractiveState(string id)
          {
              // Match the previous per-frame stale cleanup tolerance: a window may miss two frames
              // during a presentation transition before selection/drag state is released.
              return !string.IsNullOrEmpty(id) &&
                     Windows.TryGetValue(id, out WindowState state) &&
                     state.Initialized && state.LastSeenFrame >= frame - 2;
          }

          private static void PruneStaleInteractiveState()
          {
              if (Selected.Count > 0)
              {
                  StaleKeys.Clear();
                  foreach (string id in Selected)
                  {
                      if (!IsWindowRecentForInteractiveState(id)) StaleKeys.Add(id);
                  }
                  for (int i = 0; i < StaleKeys.Count; i++) Selected.Remove(StaleKeys[i]);
              }

              if (GroupDragOrigins.Count > 0)
              {
                  StaleKeys.Clear();
                  foreach (KeyValuePair<string, Num.Vector2> pair in GroupDragOrigins)
                  {
                      if (!IsWindowRecentForInteractiveState(pair.Key)) StaleKeys.Add(pair.Key);
                  }
                  for (int i = 0; i < StaleKeys.Count; i++) GroupDragOrigins.Remove(StaleKeys[i]);

                  if (groupDragging && GroupDragOrigins.Count < 2)
                  {
                      groupDragging = false;
                      groupDragDelta = Num.Vector2.Zero;
                      GroupDragOrigins.Clear();
                  }
              }

              StaleKeys.Clear();
          }

          private static void DetectResizeEdges'''
          if old not in s:
              raise SystemExit('FloatingWindowSnap helper anchor changed')
          s = s.replace(old, new, 1)

          old = '''            foreach (string id in Selected)
              {
                  if (Windows.TryGetValue(id, out WindowState state) && state.Initialized)
                      GroupDragOrigins[id] = state.Position;
              }'''
          new = '''            foreach (string id in Selected)
              {
                  if (IsWindowLive(id) && Windows.TryGetValue(id, out WindowState state))
                      GroupDragOrigins[id] = state.Position;
              }

              if (GroupDragOrigins.Count < 2)
              {
                  groupDragging = false;
                  GroupDragOrigins.Clear();
              }'''
          if old not in s:
              raise SystemExit('FloatingWindowSnap group origin anchor changed')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # FontSettingsWindow: cache stable display strings and FriendlyFaceName projection.
          # Font selection itself was already cached in BridgePlugin; this removes the remaining
          # obvious per-frame managed string construction for resolved-font status rows.
          p = Path('src/DevUI/DevTool/RWImGui/FontSettingsWindow.cs')
          s = p.read_text(encoding='utf-8')

          old = '''internal static class FontSettingsWindow
          {
              internal static void Draw(Num.Vector2 display)'''
          new = '''internal static class FontSettingsWindow
          {
              private static bool fontStatusProjectionValid;
              private static bool projectedFontStatusChinese;
              private static string projectedFontName = string.Empty;
              private static int projectedActualWeight = int.MinValue;
              private static int projectedWeightVariants = int.MinValue;
              private static string projectedFontStatus = string.Empty;
              private static string projectedResolvedWeightStatus = string.Empty;
              private static string projectedFamilyWeightsStatus = string.Empty;

              internal static void Draw(Num.Vector2 display)'''
          if old not in s:
              raise SystemExit('FontSettingsWindow class anchor changed')
          s = s.replace(old, new, 1)

          old = '''        string fontName = DevToolFrontend.ResolvedFontName;
          int actualWeight = DevToolFrontend.ResolvedFontWeight;
          int weightVariants = DevToolFrontend.ResolvedFontWeightVariantCount;
          string friendlyFace = DevToolFontCatalog.FriendlyFaceName(fontName);
          ImGui.TextDisabled(DevToolUiSettings.T("当前字体：", "Font: ") +
                             (string.IsNullOrEmpty(friendlyFace) ? DevToolUiSettings.T("默认", "Default") : friendlyFace));
          ImGui.TextDisabled(DevToolUiSettings.T("实际字重：", "Resolved weight: ") + actualWeight);'''
          new = '''        string fontName = DevToolFrontend.ResolvedFontName;
          int actualWeight = DevToolFrontend.ResolvedFontWeight;
          int weightVariants = DevToolFrontend.ResolvedFontWeightVariantCount;
          EnsureFontStatusProjection(fontName, actualWeight, weightVariants);
          ImGui.TextDisabled(projectedFontStatus);
          ImGui.TextDisabled(projectedResolvedWeightStatus);'''
          if old not in s:
              raise SystemExit('FontSettingsWindow status anchor changed')
          s = s.replace(old, new, 1)

          old = '''            ImGui.TextDisabled(DevToolUiSettings.T("当前字体族字重：", "Family weights: ") + Math.Max(1, weightVariants));'''
          new = '''            ImGui.TextDisabled(projectedFamilyWeightsStatus);'''
          if old not in s:
              raise SystemExit('FontSettingsWindow family weights anchor changed')
          s = s.replace(old, new, 1)

          old = '''    private static void DrawChineseFontSelector()
          {'''
          new = '''    private static void EnsureFontStatusProjection(string fontName, int actualWeight, int weightVariants)
          {
              bool chinese = DevToolUiSettings.IsChinese;
              string stableFontName = fontName ?? string.Empty;
              if (fontStatusProjectionValid &&
                  projectedFontStatusChinese == chinese &&
                  projectedActualWeight == actualWeight &&
                  projectedWeightVariants == weightVariants &&
                  string.Equals(projectedFontName, stableFontName, StringComparison.Ordinal))
                  return;

              projectedFontStatusChinese = chinese;
              projectedFontName = stableFontName;
              projectedActualWeight = actualWeight;
              projectedWeightVariants = weightVariants;

              string friendlyFace = DevToolFontCatalog.FriendlyFaceName(stableFontName);
              projectedFontStatus = DevToolUiSettings.T("当前字体：", "Font: ") +
                                    (string.IsNullOrEmpty(friendlyFace)
                                        ? DevToolUiSettings.T("默认", "Default")
                                        : friendlyFace);
              projectedResolvedWeightStatus = DevToolUiSettings.T("实际字重：", "Resolved weight: ") + actualWeight;
              projectedFamilyWeightsStatus = DevToolUiSettings.T("当前字体族字重：", "Family weights: ") + Math.Max(1, weightVariants);
              fontStatusProjectionValid = true;
          }

          private static void DrawChineseFontSelector()
          {'''
          if old not in s:
              raise SystemExit('FontSettingsWindow helper anchor changed')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Run final architecture guard
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate-devtool-final-architecture.sh

      - name: Validate stable-frame invariants
        shell: bash
        run: |
          set -euo pipefail
          ! git diff --name-only | grep -E '^src/DevUI/DevTool/(Core|Presentation|Compatibility|Extensions|Runtime)/'
          grep -q 'PruneStaleInteractiveState();' src/DevUI/DevTool/RWImGui/FloatingWindowSnap.cs
          grep -q 'state.LastSeenFrame >= frame - 2' src/DevUI/DevTool/RWImGui/FloatingWindowSnap.cs
          grep -q 'if (GroupDragOrigins.Count < 2)' src/DevUI/DevTool/RWImGui/FloatingWindowSnap.cs
          ! grep -q 'ImGuiIOPtr io = frameContext.Io;' src/DevUI/DevTool/RWImGui/FloatingWindowSnap.cs
          grep -q 'EnsureFontStatusProjection(fontName, actualWeight, weightVariants);' src/DevUI/DevTool/RWImGui/FontSettingsWindow.cs
          grep -q 'projectedFamilyWeightsStatus' src/DevUI/DevTool/RWImGui/FontSettingsWindow.cs

      - name: Commit fix and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/devtool-frontend-stable-frame-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/DevUI/DevTool/RWImGui .github/workflows/devtool-frontend-stable-frame-fix.yml
          git commit -m 'Preserve interaction lifetime and cache font status'
          git push origin HEAD:perf/devtool-frontend-stable-frame
