name: Task14 R3 Observatory rejected proposals one-shot

on:
  push:
    branches:
      - task14-r3-arbiter

permissions:
  contents: write

jobs:
  apply-r3-observatory-rejections:
    if: github.event.head_commit.message == 'Trigger R3 Observatory rejected proposals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r3-arbiter
          fetch-depth: 0

      - name: Apply guarded Observatory rejection presentation
        run: python scripts/task14_r3_observatory_rejections_apply.py

      - name: Validate R3 Observatory presentation
        run: |
          git diff --check
          test ! -e scripts/task14_r3_observatory_rejections_apply.py
          test ! -e .github/workflows/task14-r3-observatory-rejections-one-shot.yml
          test ! -e scripts/task14_r3_core_ai_owner_apply.py
          test ! -e .github/workflows/task14-r3-core-ai-owner-one-shot.yml
          grep -q 'BuildArbiterSection' src/Debug/AIDebugger/Sources/DesertBatflyDebugSource.cs
          grep -q 'DB_BehaviorArbiter.TryGetDebugState' src/Debug/AIDebugger/Sources/DesertBatflyDebugSource.cs
          grep -q 'field.arbiter_rejected' src/Debug/AIDebugger/AIDebugLocalization.cs
          grep -q 'R3-CLOSED-07' docs/Discussion/Task_14_R3_FrameArbiterStatus.txt

      - name: Commit Observatory rejected proposal presentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expose R3 rejected proposals in AI Observatory'
          git push origin HEAD:task14-r3-arbiter
