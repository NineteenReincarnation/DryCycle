name: Task14 R4 B4 Combat selection one-shot

on:
  push:
    branches:
      - task14-r4-b4-combat-selection

permissions:
  contents: write

jobs:
  apply-r4-b4:
    if: github.event.head_commit.message == 'Trigger R4 B4 combat selection extraction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r4-b4-combat-selection
          fetch-depth: 0

      - name: Apply guarded R4 B4 migration
        run: python scripts/task14_r4_b4_combat_selection_apply_v2.py

      - name: Validate R4 B4 contracts
        run: |
          git diff --check
          test ! -e scripts/task14_r4_b4_combat_selection_apply.py
          test ! -e scripts/task14_r4_b4_combat_selection_apply_v2.py
          test ! -e .github/workflows/task14-r4-b4-combat-selection-one-shot.yml
          grep -q 'internal Creature Target => combat.Target;' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          ! grep -q 'private bool CanHarass(Creature creature)' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          ! grep -q 'private Player FindSocialHarassTarget()' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          ! grep -q 'private void ArmRetaliation(Player player, float strength)' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          grep -q 'BeginCandidateScan' src/Creatures/DesertBatfly/Combat/DB_CombatRuntime.cs
          grep -q 'ConsiderCandidate' src/Creatures/DesertBatfly/Combat/DB_CombatRuntime.cs
          grep -q 'CompleteCandidateScan' src/Creatures/DesertBatfly/Combat/DB_CombatRuntime.cs
          grep -q 'PrepareSelection' src/Creatures/DesertBatfly/Combat/DB_CombatRuntime.cs
          grep -q 'ArmRetaliation' src/Creatures/DesertBatfly/Combat/DB_CombatRuntime.cs
          grep -q 'Revision: R4-B4' docs/Discussion/Task_14_R4_FlightMotorStatus.txt

      - name: Audit R4 direct writers and AI leftovers
        run: |
          echo '--- AI target/motivation leftovers ---'
          grep -nE 'CanHarass|FindSocialHarassTarget|ArmRetaliation|retaliationCharges|retaliationRecovery|private Creature attacker|private int memory' src/Creatures/DesertBatfly/DesertBatflyAI.cs || true
          echo '--- localGoal writers ---'
          grep -RIn --include='*.cs' -E 'localGoal[[:space:]]*(\+?=)' src/Creatures/DesertBatfly || true
          echo '--- sustained velocity writers ---'
          grep -RIn --include='*.cs' -E 'mainBodyChunk\.vel[[:space:]]*=' src/Creatures/DesertBatfly || true

      - name: Commit R4 B4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+NineteenReincarnation@users.noreply.github.com'
          git add -A
          git commit -m 'Move R4 combat selection into DB_CombatRuntime'
          git push origin HEAD:task14-r4-b4-combat-selection

# trigger v2
