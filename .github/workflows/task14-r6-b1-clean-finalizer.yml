name: Task14 R6 B1 clean finalizer

on:
  push:
    branches:
      - task14-r6-b1-clean

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r6-b1-clean
          fetch-depth: 0

      - name: Assert clean R5 source inventory
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            src/Creatures/DesertBatfly/DesertBatflyHooks.cs \
            src/Creatures/DesertBatfly/DesertBatflyRuntimePatch.cs \
            src/Creatures/DesertBatfly/DesertBatflySandbox.cs \
            src/Creatures/DesertBatfly/DesertBatflyWarpCompatibility.cs \
            src/Debug/AIDebugger/Sources/DesertBatflyDebugSource.cs \
            src/Debug/AIDebugger/Sources/DesertBatflyTask09DebugSource.cs \
            src/Debug/AIDebugger/Sources/DesertBatflyTask10DebugSource.cs \
            src/Debug/AIDebugger/Sources/DesertBatflyTask11DebugSource.cs \
            src/Debug/AIDebugger/Sources/DesertBatflyTask12DebugSource.cs \
            src/Debug/AIDebugger/Sources/DesertBatflyTask13DebugSource.cs; do
            test -f "$f"
          done

      - name: Move Integration and Observatory files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/Creatures/DesertBatfly/Integration/RainWorld \
                   src/Creatures/DesertBatfly/Integration/Sandbox \
                   src/Creatures/DesertBatfly/Integration/Warp
          git mv src/Creatures/DesertBatfly/DesertBatflyHooks.cs src/Creatures/DesertBatfly/Integration/RainWorld/DB_RainWorldHooks.cs
          git mv src/Creatures/DesertBatfly/DesertBatflyRuntimePatch.cs src/Creatures/DesertBatfly/Integration/RainWorld/DB_RuntimePatch.cs
          git mv src/Creatures/DesertBatfly/DesertBatflySandbox.cs src/Creatures/DesertBatfly/Integration/Sandbox/DB_Sandbox.cs
          git mv src/Creatures/DesertBatfly/DesertBatflyWarpCompatibility.cs src/Creatures/DesertBatfly/Integration/Warp/DB_WarpCompatibility.cs
          git mv src/Debug/AIDebugger/Sources/DesertBatflyDebugSource.cs src/Debug/AIDebugger/Sources/DB_ObservatorySource.cs
          git mv src/Debug/AIDebugger/Sources/DesertBatflyTask09DebugSource.cs src/Debug/AIDebugger/Sources/DB_TravelDebugSource.cs
          git mv src/Debug/AIDebugger/Sources/DesertBatflyTask10DebugSource.cs src/Debug/AIDebugger/Sources/DB_SocialDebugSource.cs
          git mv src/Debug/AIDebugger/Sources/DesertBatflyTask11DebugSource.cs src/Debug/AIDebugger/Sources/DB_ThreatDebugSource.cs
          git mv src/Debug/AIDebugger/Sources/DesertBatflyTask12DebugSource.cs src/Debug/AIDebugger/Sources/DB_SignalDebugSource.cs
          git mv src/Debug/AIDebugger/Sources/DesertBatflyTask13DebugSource.cs src/Debug/AIDebugger/Sources/DB_EnvironmentDebugSource.cs

      - name: Rename production and executable type references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          mappings = {
              'DesertBatflyHooks': 'DB_RainWorldHooks',
              'DesertBatflyRuntimePatch': 'DB_RuntimePatch',
              'DesertBatflySandbox': 'DB_Sandbox',
              'DesertBatflyWarpCompatibility': 'DB_WarpCompatibility',
              'DesertBatflyDebugSource': 'DB_ObservatorySource',
              'DesertBatflyTask09DebugSource': 'DB_TravelDebugSource',
              'DesertBatflyTask10DebugSource': 'DB_SocialDebugSource',
              'DesertBatflyTask11DebugSource': 'DB_ThreatDebugSource',
              'DesertBatflyTask12DebugSource': 'DB_SignalDebugSource',
              'DesertBatflyTask13DebugSource': 'DB_EnvironmentDebugSource',
          }
          for base in (Path('src'), Path('tests'), Path('scripts')):
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix not in {'.cs', '.sh'}:
                      continue
                  text = p.read_text(encoding='utf-8')
                  new = text
                  for old, replacement in mappings.items():
                      new = new.replace(old, replacement)
                  if new != text:
                      p.write_text(new, encoding='utf-8')

          # Replace only the development-era task labels that describe these renamed
          # Observatory adapter identities. R6's later naming sweep owns all remaining
          # production TaskXX text elsewhere.
          replacements = {
              'DB_TravelDebugSource.cs': [('Task 09','Travel / Colony'),('Task09','Travel')],
              'DB_SocialDebugSource.cs': [('Task 10','Social'),('Task10','Social'),('Task 09','Travel / Colony'),('Task09','Travel')],
              'DB_ThreatDebugSource.cs': [('Task 11','Threat'),('Task11','Threat'),('Task 10','Social'),('Task10','Social')],
              'DB_SignalDebugSource.cs': [('Task 12','Signal'),('Task12','Signal'),('Task 11','Threat'),('Task11','Threat')],
              'DB_EnvironmentDebugSource.cs': [('Task 13','Environment'),('Task13','Environment'),('Task 12','Signal'),('Task12','Signal'),('Task 09','Travel / Colony'),('Task09','Travel')],
          }
          root=Path('src/Debug/AIDebugger/Sources')
          for name, pairs in replacements.items():
              p=root/name
              text=p.read_text(encoding='utf-8')
              for old,new in pairs: text=text.replace(old,new)
              p.write_text(text,encoding='utf-8')

          p=Path('src/Creatures/DesertBatfly/Integration/RainWorld/DB_RuntimePatch.cs')
          p.write_text(p.read_text(encoding='utf-8').replace('Task09-13 domains must not use it.','internal behavior domains must not use it.'),encoding='utf-8')
          p=Path('src/Creatures/DesertBatfly/Integration/RainWorld/DB_RainWorldHooks.cs')
          p.write_text(p.read_text(encoding='utf-8').replace('// Only bridge nonvirtual vanilla entry points here.','// Only adapt nonvirtual vanilla entry points here.'),encoding='utf-8')

          # R5 executable source audit must follow the R6 Integration paths.
          p=Path('scripts/check-desertbatfly-r5-retention.sh')
          text=p.read_text(encoding='utf-8')
          for old,new in {
              'src/Creatures/DesertBatfly/DB_RuntimePatch.cs':'src/Creatures/DesertBatfly/Integration/RainWorld/DB_RuntimePatch.cs',
              'src/Creatures/DesertBatfly/DB_Sandbox.cs':'src/Creatures/DesertBatfly/Integration/Sandbox/DB_Sandbox.cs',
              'src/Creatures/DesertBatfly/DB_WarpCompatibility.cs':'src/Creatures/DesertBatfly/Integration/Warp/DB_WarpCompatibility.cs',
          }.items(): text=text.replace(old,new)
          p.write_text(text,encoding='utf-8')

          p=Path('tests/DesertBatfly/Program.RejectedTask02.cs')
          text=p.read_text(encoding='utf-8')
          if 'RunTask14R6();' not in text:
              needle='        RunTask14R5Retention();\n'
              if needle not in text: raise SystemExit('dispatcher insertion point missing')
              text=text.replace(needle,needle+'        RunTask14R6();\n')
          p.write_text(text,encoding='utf-8')
          PY

      - name: Add R6 B1 managed retention test
        shell: bash
        run: |
          cat > tests/DesertBatfly/Program.Task14R6.cs <<'EOF'
          using System;
          using System.Reflection;

          internal static partial class Program
          {
              private static void RunTask14R6()
              {
                  Type hooks = mod.GetType("DryCycle.Creatures.DesertBatfly.DB_RainWorldHooks", true);
                  Type runtimePatch = mod.GetType("DryCycle.Creatures.DesertBatfly.DB_RuntimePatch", true);
                  Type sandbox = mod.GetType("DryCycle.Creatures.DesertBatfly.DB_Sandbox", true);
                  Type warp = mod.GetType("DryCycle.Creatures.DesertBatfly.DB_WarpCompatibility", true);

                  Check(mod.GetType("DryCycle.Creatures.DesertBatfly.DesertBatflyHooks", false) == null &&
                        mod.GetType("DryCycle.Creatures.DesertBatfly.DesertBatflyRuntimePatch", false) == null &&
                        mod.GetType("DryCycle.Creatures.DesertBatfly.DesertBatflySandbox", false) == null &&
                        mod.GetType("DryCycle.Creatures.DesertBatfly.DesertBatflyWarpCompatibility", false) == null,
                      "R6 B1 retires old Integration type identities");

                  MethodInfo modsInit = hooks.GetMethod("RainWorld_OnModsInit", Flags);
                  Check(MethodCallOffset(modsInit, sandbox, "Enable") >= 0 &&
                        MethodCallOffset(modsInit, warp, "Enable") >= 0 &&
                        MethodCallOffset(hooks.GetMethod("Disable", Flags), sandbox, "Disable") >= 0 &&
                        MethodCallOffset(hooks.GetMethod("Disable", Flags), warp, "Disable") >= 0,
                      "R6 B1 preserves Sandbox/Warp lifecycle");
                  Check(MethodCallOffset(sandbox.GetMethod("Enable", Flags), runtimePatch, "Create") >= 0 &&
                        MethodCallOffset(sandbox.GetMethod("Enable", Flags), runtimePatch, "Patch") >= 0 &&
                        MethodCallOffset(warp.GetMethod("Enable", Flags), runtimePatch, "Create") >= 0 &&
                        MethodCallOffset(warp.GetMethod("Enable", Flags), runtimePatch, "Patch") >= 0,
                      "R6 B1 preserves RuntimePatch compatibility boundary");

                  Type observatory = mod.GetType("DryCycle.Debugging.AI.DB_ObservatorySource", true);
                  Type travel = mod.GetType("DryCycle.Debugging.AI.DB_TravelDebugSource", true);
                  Type social = mod.GetType("DryCycle.Debugging.AI.DB_SocialDebugSource", true);
                  Type threat = mod.GetType("DryCycle.Debugging.AI.DB_ThreatDebugSource", true);
                  Type signal = mod.GetType("DryCycle.Debugging.AI.DB_SignalDebugSource", true);
                  Type environment = mod.GetType("DryCycle.Debugging.AI.DB_EnvironmentDebugSource", true);
                  Check(travel.GetField("inner", Flags)?.FieldType == observatory &&
                        social.GetField("inner", Flags)?.FieldType == travel &&
                        threat.GetField("inner", Flags)?.FieldType == social &&
                        signal.GetField("inner", Flags)?.FieldType == threat &&
                        environment.GetField("inner", Flags)?.FieldType == signal,
                      "R6 B1 preserves Observatory enrichment order");
                  Console.WriteLine("Task14 R6 B1 retention checks pass.");
              }
          }
          EOF

      - name: Add R6 B1 source guard
        shell: bash
        run: |
          cat > scripts/check-desertbatfly-r6-b1.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          cd "$ROOT"
          ./scripts/check-desertbatfly-r5-retention.sh

          for f in \
            src/Creatures/DesertBatfly/Integration/RainWorld/DB_RainWorldHooks.cs \
            src/Creatures/DesertBatfly/Integration/RainWorld/DB_RuntimePatch.cs \
            src/Creatures/DesertBatfly/Integration/Sandbox/DB_Sandbox.cs \
            src/Creatures/DesertBatfly/Integration/Warp/DB_WarpCompatibility.cs \
            src/Debug/AIDebugger/Sources/DB_ObservatorySource.cs \
            src/Debug/AIDebugger/Sources/DB_TravelDebugSource.cs \
            src/Debug/AIDebugger/Sources/DB_SocialDebugSource.cs \
            src/Debug/AIDebugger/Sources/DB_ThreatDebugSource.cs \
            src/Debug/AIDebugger/Sources/DB_SignalDebugSource.cs \
            src/Debug/AIDebugger/Sources/DB_EnvironmentDebugSource.cs; do test -f "$f"; done

          ! grep -RIn --include='*.cs' -E 'DesertBatflyHooks|DesertBatflyRuntimePatch|DesertBatflySandbox|DesertBatflyWarpCompatibility|DesertBatflyTask(09|10|11|12|13)DebugSource|DesertBatflyDebugSource' src
          grep -q 'DB_RainWorldHooks.Enable()' src/Plugin.cs
          grep -q 'DB_RainWorldHooks.Disable()' src/Plugin.cs
          grep -q 'AIDebugRegistry.Register(new DB_EnvironmentDebugSource())' src/Creatures/DesertBatfly/Integration/RainWorld/DB_RainWorldHooks.cs
          grep -q 'Register(new DB_ObservatorySource())' src/Debug/AIDebugger/Core/AIDebugRegistry.cs
          grep -q 'private readonly DB_ObservatorySource inner = new();' src/Debug/AIDebugger/Sources/DB_TravelDebugSource.cs
          grep -q 'private readonly DB_TravelDebugSource inner = new();' src/Debug/AIDebugger/Sources/DB_SocialDebugSource.cs
          grep -q 'private readonly DB_SocialDebugSource inner = new();' src/Debug/AIDebugger/Sources/DB_ThreatDebugSource.cs
          grep -q 'private readonly DB_ThreatDebugSource inner = new();' src/Debug/AIDebugger/Sources/DB_SignalDebugSource.cs
          grep -q 'private readonly DB_SignalDebugSource inner = new();' src/Debug/AIDebugger/Sources/DB_EnvironmentDebugSource.cs
          echo 'R6 B1 source retention audit passed.'
          EOF
          chmod +x scripts/check-desertbatfly-r6-b1.sh

      - name: Write R6 status
        shell: bash
        run: |
          cat > docs/Discussion/Task_14_R6_DomainMigrationStatus.txt <<'EOF'
          Desert Batfly Task 14 — R6 Domain / Physical Migration Status
          Revision: R6-B1 / 2026-09-07
          Base: R5 code-side complete at e7bb53e32b367fec91805c180151a36a75b68816
          Status: 【R6 进行中 / B1 Integration + Observatory identity migration complete code-side】

          R6 changes physical ownership/file/type identity without changing gameplay semantics.
          Historical R0-R5 documents retain their historical names; executable guards follow R6 names.

          B1 moved Integration to:
          - Integration/RainWorld/DB_RainWorldHooks.cs
          - Integration/RainWorld/DB_RuntimePatch.cs
          - Integration/Sandbox/DB_Sandbox.cs
          - Integration/Warp/DB_WarpCompatibility.cs

          Observatory identity chain is now:
          DB_ObservatorySource -> DB_TravelDebugSource -> DB_SocialDebugSource ->
          DB_ThreatDebugSource -> DB_SignalDebugSource -> DB_EnvironmentDebugSource.

          Retention guarantees:
          - Plugin still enters the species hook lifecycle.
          - full Environment source remains species-registered; base source remains registry-registered.
          - Sandbox/Warp still use the same optional RuntimePatch mechanism and unchanged Harmony IDs.
          - R5 bridge/detour retention guard still passes under the R6 paths.
          - stable creature/save/world IDs are untouched.

          B1 does not claim all production TaskXX text is gone. That is a later R6 naming sweep.
          No Rain World live-play validation is claimed here.
          EOF

      - name: Validate R5 bridge-debt retention
        shell: bash
        run: ./scripts/check-desertbatfly-r5-retention.sh

      - name: Validate R6 production identity absence
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --include='*.cs' -E 'DesertBatflyHooks|DesertBatflyRuntimePatch|DesertBatflySandbox|DesertBatflyWarpCompatibility|DesertBatflyTask(09|10|11|12|13)DebugSource|DesertBatflyDebugSource' src

      - name: Validate R6 lifecycle wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DB_RainWorldHooks.Enable()' src/Plugin.cs
          grep -q 'DB_RainWorldHooks.Disable()' src/Plugin.cs
          grep -q 'AIDebugRegistry.Register(new DB_EnvironmentDebugSource())' src/Creatures/DesertBatfly/Integration/RainWorld/DB_RainWorldHooks.cs
          grep -q 'Register(new DB_ObservatorySource())' src/Debug/AIDebugger/Core/AIDebugRegistry.cs

      - name: Validate R6 Observatory enrichment chain
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'private readonly DB_ObservatorySource inner = new();' src/Debug/AIDebugger/Sources/DB_TravelDebugSource.cs
          grep -q 'private readonly DB_TravelDebugSource inner = new();' src/Debug/AIDebugger/Sources/DB_SocialDebugSource.cs
          grep -q 'private readonly DB_SocialDebugSource inner = new();' src/Debug/AIDebugger/Sources/DB_ThreatDebugSource.cs
          grep -q 'private readonly DB_ThreatDebugSource inner = new();' src/Debug/AIDebugger/Sources/DB_SignalDebugSource.cs
          grep -q 'private readonly DB_SignalDebugSource inner = new();' src/Debug/AIDebugger/Sources/DB_EnvironmentDebugSource.cs

      - name: Validate diff hygiene
        shell: bash
        run: git diff --check

      - name: Commit B1 and retire finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+NineteenReincarnation@users.noreply.github.com'
          git rm .github/workflows/task14-r6-b1-clean-finalizer.yml
          git add -A
          git commit -m 'R6 B1 migrate Integration and Observatory identities'
          git push origin HEAD:task14-r6-b1-clean
