name: DevTool Frontend Perf Bootstrap

on:
  push:
    branches:
      - perf/devtool-frontend-stable-frame

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/devtool-frontend-stable-frame
          fetch-depth: 0
      - name: Apply frontend performance instrumentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          rw = root / 'src/DevUI/DevTool/RWImGui'

          monitor = r'''using System;
          using System.Diagnostics;

          namespace DryCycle.DevUI.DevTool.RWImGui;

          /// <summary>
          /// Stable RWImGui frontend timing channels. These deliberately measure presentation work
          /// after the backend immutable snapshots have already been published, so frontend cost can
          /// be separated from DevUI/session/presentation production cost.
          /// </summary>
          internal enum DevToolFrontendPerformanceMetric
          {
              FrontendFrameTotal,
              UiModeSwitch,
              FontSettings,
              Overlay,
              SceneWorkspace,
              ScenePlacement,
              ActionToast,
              Count
          }

          internal readonly struct DevToolFrontendPerformanceStats
          {
              internal DevToolFrontendPerformanceStats(
                  int sampleCount,
                  double lastMilliseconds,
                  double averageMilliseconds,
                  double p95Milliseconds,
                  double maxMilliseconds)
              {
                  SampleCount = sampleCount;
                  LastMilliseconds = lastMilliseconds;
                  AverageMilliseconds = averageMilliseconds;
                  P95Milliseconds = p95Milliseconds;
                  MaxMilliseconds = maxMilliseconds;
              }

              internal int SampleCount { get; }
              internal double LastMilliseconds { get; }
              internal double AverageMilliseconds { get; }
              internal double P95Milliseconds { get; }
              internal double MaxMilliseconds { get; }
              internal bool HasSamples => SampleCount > 0;
          }

          /// <summary>
          /// Allocation-free-on-the-hot-path timing recorder for the RWImGui layer.
          ///
          /// This intentionally lives in the frontend assembly rather than extending the backend
          /// performance enum. Phase 6's dependency boundary remains one-way: backend knows nothing
          /// about RWImGui, while the frontend can correlate its own draw cost with backend metrics.
          /// </summary>
          internal static class DevToolFrontendPerformanceMonitor
          {
              internal readonly struct Scope : IDisposable
              {
                  private readonly DevToolFrontendPerformanceMetric metric;
                  private readonly long startTimestamp;
                  private readonly int generation;

                  internal Scope(DevToolFrontendPerformanceMetric metric, long startTimestamp, int generation)
                  {
                      this.metric = metric;
                      this.startTimestamp = startTimestamp;
                      this.generation = generation;
                  }

                  public void Dispose()
                  {
                      if (startTimestamp == 0L) return;
                      DevToolFrontendPerformanceMonitor.Record(metric, startTimestamp, generation);
                  }
              }

              private sealed class MetricSeries
              {
                  private readonly long[] samples = new long[SampleCapacity];
                  private readonly long[] percentileScratch = new long[SampleCapacity];
                  private int count;
                  private int next;

                  internal void Reset()
                  {
                      Array.Clear(samples, 0, samples.Length);
                      Array.Clear(percentileScratch, 0, percentileScratch.Length);
                      count = 0;
                      next = 0;
                  }

                  internal void Record(long elapsedTicks)
                  {
                      if (elapsedTicks < 0L) elapsedTicks = 0L;
                      samples[next] = elapsedTicks;
                      next++;
                      if (next == samples.Length) next = 0;
                      if (count < samples.Length) count++;
                  }

                  internal DevToolFrontendPerformanceStats Snapshot()
                  {
                      if (count == 0) return default;

                      long sum = 0L;
                      long max = 0L;
                      for (int i = 0; i < count; i++)
                      {
                          long value = samples[i];
                          percentileScratch[i] = value;
                          sum += value;
                          if (value > max) max = value;
                      }

                      Array.Sort(percentileScratch, 0, count);
                      int p95Index = Math.Max(0, Math.Min(count - 1, (int)Math.Ceiling(count * 0.95d) - 1));
                      int lastIndex = next == 0 ? samples.Length - 1 : next - 1;
                      long last = samples[lastIndex];

                      return new DevToolFrontendPerformanceStats(
                          count,
                          TicksToMilliseconds(last),
                          TicksToMilliseconds(sum / (double)count),
                          TicksToMilliseconds(percentileScratch[p95Index]),
                          TicksToMilliseconds(max));
                  }
              }

              private const int SampleCapacity = 240;
              private static readonly MetricSeries[] Series = CreateSeries();
              private static bool enabled;
              private static int generation = 1;

              internal static bool Enabled => enabled;
              internal static int RollingSampleCapacity => SampleCapacity;

              internal static void SetEnabled(bool value)
              {
                  if (value == enabled) return;

                  enabled = false;
                  generation++;
                  if (!value) return;

                  ResetStorage();
                  enabled = true;
              }

              internal static void Reset()
              {
                  bool resume = enabled;
                  enabled = false;
                  generation++;
                  ResetStorage();
                  enabled = resume;
              }

              internal static Scope Measure(DevToolFrontendPerformanceMetric metric)
              {
                  int index = (int)metric;
                  if (!enabled || index < 0 || index >= Series.Length)
                      return default;

                  return new Scope(metric, Stopwatch.GetTimestamp(), generation);
              }

              internal static DevToolFrontendPerformanceStats GetStats(DevToolFrontendPerformanceMetric metric)
              {
                  int index = (int)metric;
                  if (index < 0 || index >= Series.Length)
                      return default;

                  return Series[index].Snapshot();
              }

              private static void Record(
                  DevToolFrontendPerformanceMetric metric,
                  long startTimestamp,
                  int scopeGeneration)
              {
                  if (!enabled || scopeGeneration != generation) return;

                  int index = (int)metric;
                  if (index < 0 || index >= Series.Length) return;

                  Series[index].Record(Stopwatch.GetTimestamp() - startTimestamp);
              }

              private static MetricSeries[] CreateSeries()
              {
                  MetricSeries[] result = new MetricSeries[(int)DevToolFrontendPerformanceMetric.Count];
                  for (int i = 0; i < result.Length; i++)
                      result[i] = new MetricSeries();
                  return result;
              }

              private static void ResetStorage()
              {
                  for (int i = 0; i < Series.Length; i++)
                      Series[i].Reset();
              }

              private static double TicksToMilliseconds(long ticks) =>
                  ticks * 1000d / Stopwatch.Frequency;

              private static double TicksToMilliseconds(double ticks) =>
                  ticks * 1000d / Stopwatch.Frequency;
          }
          '''
          # Strip workflow indentation introduced solely for YAML readability.
          monitor = '\n'.join(line[10:] if line.startswith('          ') else line for line in monitor.splitlines()) + '\n'
          (rw / 'DevToolFrontendPerformanceMonitor.cs').write_text(monitor, encoding='utf-8')

          def replace(path, old, new):
              p = root / path
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'patch anchor missing in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'src/DevUI/DevTool/RWImGui/BridgePlugin.cs',
              '''        try\n        {\n            ImGuiIOPtr io = ImGui.GetIO();''',
              '''        using DevToolFrontendPerformanceMonitor.Scope frontendFrameScope =\n            DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.FrontendFrameTotal);\n\n        try\n        {\n            ImGuiIOPtr io = ImGui.GetIO();''')

          replace(
              'src/DevUI/DevTool/RWImGui/BridgePlugin.cs',
              '''                UiModeSwitch.Draw();\n\n                if (!EditorUiModeState.UseVanilla)\n                {\n                    FontSettingsWindow.Draw(io.DisplaySize);\n                    DevToolOverlay.Draw(snapshot);\n                    SceneWorkspaceWindow.Draw(snapshot, io.DisplaySize);\n                    ScenePlacementWindow.Draw(snapshot, io.DisplaySize);\n                    ActionToastOverlay.Draw(snapshot, io.DisplaySize);\n                }''',
              '''                using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.UiModeSwitch))\n                    UiModeSwitch.Draw();\n\n                if (!EditorUiModeState.UseVanilla)\n                {\n                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.FontSettings))\n                        FontSettingsWindow.Draw(io.DisplaySize);\n                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.Overlay))\n                        DevToolOverlay.Draw(snapshot);\n                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.SceneWorkspace))\n                        SceneWorkspaceWindow.Draw(snapshot, io.DisplaySize);\n                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.ScenePlacement))\n                        ScenePlacementWindow.Draw(snapshot, io.DisplaySize);\n                    using (DevToolFrontendPerformanceMonitor.Measure(DevToolFrontendPerformanceMetric.ActionToast))\n                        ActionToastOverlay.Draw(snapshot, io.DisplaySize);\n                }''')

          replace(
              'src/DevUI/DevTool/RWImGui/ControlCenterWindow.cs',
              '''        if (DevToolWidgets.ActionButton(\n                profiling\n                    ? DevToolUiSettings.T("监控中", "Monitoring")\n                    : DevToolUiSettings.T("开启", "Enable"),\n                "ControlCenterPerformance",\n                profiling ? DevToolButtonTone.Primary : DevToolButtonTone.Subtle))\n            DevToolPerformanceMonitor.SetEnabled(!profiling);''',
              '''        if (DevToolWidgets.ActionButton(\n                profiling\n                    ? DevToolUiSettings.T("监控中", "Monitoring")\n                    : DevToolUiSettings.T("开启", "Enable"),\n                "ControlCenterPerformance",\n                profiling ? DevToolButtonTone.Primary : DevToolButtonTone.Subtle))\n        {\n            bool enable = !profiling;\n            DevToolPerformanceMonitor.SetEnabled(enable);\n            DevToolFrontendPerformanceMonitor.SetEnabled(enable);\n        }''')

          perf = root / 'src/DevUI/DevTool/RWImGui/DevToolPerformanceWindow.cs'
          text = perf.read_text(encoding='utf-8')
          text = text.replace(
              '''    private static readonly DevToolPresentationChannel[] Channels =''',
              '''    private static readonly DevToolFrontendPerformanceMetric[] FrontendMetrics =\n    {\n        DevToolFrontendPerformanceMetric.FrontendFrameTotal,\n        DevToolFrontendPerformanceMetric.UiModeSwitch,\n        DevToolFrontendPerformanceMetric.FontSettings,\n        DevToolFrontendPerformanceMetric.Overlay,\n        DevToolFrontendPerformanceMetric.SceneWorkspace,\n        DevToolFrontendPerformanceMetric.ScenePlacement,\n        DevToolFrontendPerformanceMetric.ActionToast\n    };\n\n    private static readonly DevToolPresentationChannel[] Channels =''', 1)
          text = text.replace(
              '''    private static readonly Dictionary<DevToolPerformanceMetric, MetricReadback> MetricReadbacks = new();\n    private static readonly Dictionary<DevToolPresentationChannel, CacheReadback> CacheReadbacks = new();''',
              '''    private static readonly Dictionary<DevToolPerformanceMetric, MetricReadback> MetricReadbacks = new();\n    private static readonly Dictionary<DevToolFrontendPerformanceMetric, MetricReadback> FrontendMetricReadbacks = new();\n    private static readonly Dictionary<DevToolPresentationChannel, CacheReadback> CacheReadbacks = new();''', 1)
          text = text.replace(
              '''            DevToolPerformanceMonitor.Reset();\n            InvalidateReadback();''',
              '''            DevToolPerformanceMonitor.Reset();\n            DevToolFrontendPerformanceMonitor.Reset();\n            InvalidateReadback();''', 1)
          text = text.replace(
              '''            DevToolPerformanceMonitor.SetEnabled(false);\n            ImGui.End();''',
              '''            DevToolPerformanceMonitor.SetEnabled(false);\n            DevToolFrontendPerformanceMonitor.SetEnabled(false);\n            ImGui.End();''', 1)
          text = text.replace(
              '''        ImGui.Spacing();\n        DrawSection(DevToolUiSettings.T("数据发布耗时", "PRESENTATION TIME"));''',
              '''        ImGui.Spacing();\n        DrawSection(DevToolUiSettings.T("前端绘制耗时", "FRONTEND DRAW"));\n        DrawFrontendMetric(DevToolFrontendPerformanceMetric.FrontendFrameTotal, DevToolUiSettings.T("前端总帧", "Frontend total"));\n        DrawFrontendMetric(DevToolFrontendPerformanceMetric.UiModeSwitch, DevToolUiSettings.T("界面模式开关", "Mode switch"));\n        DrawFrontendMetric(DevToolFrontendPerformanceMetric.FontSettings, DevToolUiSettings.T("字体设置", "Font settings"));\n        DrawFrontendMetric(DevToolFrontendPerformanceMetric.Overlay, DevToolUiSettings.T("主 Overlay", "Main overlay"));\n        DrawFrontendMetric(DevToolFrontendPerformanceMetric.SceneWorkspace, DevToolUiSettings.T("场景工作区", "Scene workspace"));\n        DrawFrontendMetric(DevToolFrontendPerformanceMetric.ScenePlacement, DevToolUiSettings.T("场景放置", "Scene placement"));\n        DrawFrontendMetric(DevToolFrontendPerformanceMetric.ActionToast, DevToolUiSettings.T("操作提示", "Action toast"));\n\n        ImGui.Spacing();\n        DrawSection(DevToolUiSettings.T("数据发布耗时", "PRESENTATION TIME"));''', 1)
          ensure_anchor = '''        for (int i = 0; i < Channels.Length; i++)\n        {'''
          frontend_readback = '''        for (int i = 0; i < FrontendMetrics.Length; i++)\n        {\n            DevToolFrontendPerformanceMetric metric = FrontendMetrics[i];\n            DevToolFrontendPerformanceStats stats = DevToolFrontendPerformanceMonitor.GetStats(metric);\n            if (!FrontendMetricReadbacks.TryGetValue(metric, out MetricReadback display))\n            {\n                display = new MetricReadback();\n                FrontendMetricReadbacks.Add(metric, display);\n            }\n\n            display.HasSamples = stats.HasSamples;\n            if (!stats.HasSamples)\n            {\n                display.Last = display.Average = display.P95 = display.Max = "-";\n                continue;\n            }\n\n            display.Last = FormatMilliseconds(stats.LastMilliseconds);\n            display.Average = FormatMilliseconds(stats.AverageMilliseconds);\n            display.P95 = FormatMilliseconds(stats.P95Milliseconds);\n            display.Max = FormatMilliseconds(stats.MaxMilliseconds);\n        }\n\n'''
          if ensure_anchor not in text:
              raise SystemExit('frontend readback anchor missing')
          text = text.replace(ensure_anchor, frontend_readback + ensure_anchor, 1)
          draw_anchor = '''    private static void DrawCacheRow(DevToolPresentationChannel channel, string label)\n    {'''
          frontend_draw = '''    private static void DrawFrontendMetric(DevToolFrontendPerformanceMetric metric, string label)\n    {\n        ImGui.TextUnformatted(label);\n        if (!FrontendMetricReadbacks.TryGetValue(metric, out MetricReadback stats) || !stats.HasSamples)\n        {\n            DrawAt(LastColumn, "-");\n            DrawAt(AverageColumn, "-");\n            DrawAt(P95Column, "-");\n            DrawAt(MaxColumn, "-");\n            return;\n        }\n\n        DrawAt(LastColumn, stats.Last);\n        DrawAt(AverageColumn, stats.Average);\n        DrawAt(P95Column, stats.P95);\n        DrawAt(MaxColumn, stats.Max);\n    }\n\n'''
          if draw_anchor not in text:
              raise SystemExit('frontend draw anchor missing')
          text = text.replace(draw_anchor, frontend_draw + draw_anchor, 1)
          perf.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/devtool-frontend-perf-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DevUI/DevTool/RWImGui .github/workflows/devtool-frontend-perf-bootstrap.yml
          git commit -m "Add RWImGui frontend performance instrumentation"
          git push origin HEAD:perf/devtool-frontend-stable-frame
