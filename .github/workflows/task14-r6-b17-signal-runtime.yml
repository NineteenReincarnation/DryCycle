name: Task14 R6 B17 SignalRuntime identity

on:
  push:
    branches: [ task14-r6-b1-final ]

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[r6-b17-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r6-b1-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Move and rename SignalRuntime
        shell: bash
        run: |
          set -euo pipefail
          git mv src/Creatures/DesertBatfly/Signals/DesertBatflySignalRuntime.cs src/Creatures/DesertBatfly/Signals/DB_SignalRuntime.cs
          python3 - <<'PY'
          from pathlib import Path
          old = 'DesertBatflySignalRuntime'
          new = 'DB_SignalRuntime'
          for root in (Path('src'), Path('tests'), Path('scripts')):
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.cs','.sh','.py','.md'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  if old in text:
                      path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Validate SignalRuntime contract
        shell: bash
        run: |
          set -euo pipefail
          test -f src/Creatures/DesertBatfly/Signals/DB_SignalRuntime.cs
          test ! -e src/Creatures/DesertBatfly/Signals/DesertBatflySignalRuntime.cs
          if git grep -n 'DesertBatflySignalRuntime' -- src tests scripts; then
            echo 'Old SignalRuntime identity remains.' >&2
            exit 1
          fi
          grep -q 'class DB_SignalRuntime' src/Creatures/DesertBatfly/Signals/DB_SignalRuntime.cs
          for kind in AlarmFlutter DistressCall RallySignal RoostCall HarassSignal SafeSignal; do
            git grep -q "$kind" -- src/Creatures/DesertBatfly/Signals tests/DesertBatfly
          done
          # Task12 contract remains exactly six enum values in SignalCore.
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('src/Creatures/DesertBatfly/Signals/DesertBatflySignalCore.cs')
          text = p.read_text(encoding='utf-8')
          m = re.search(r'enum\s+DesertBatflySignalKind\s*\{(.*?)\}', text, re.S)
          if not m:
              raise SystemExit('Signal kind enum not found')
          values = [x.strip().split('=')[0].strip() for x in m.group(1).split(',') if x.strip()]
          expected = ['AlarmFlutter','DistressCall','RallySignal','RoostCall','HarassSignal','SafeSignal']
          if values != expected:
              raise SystemExit(f'Signal kind contract changed: {values}')
          PY
          git grep -q 'DCDesertBatflyV1' -- src tests
          git grep -q 'DCDesertBatflyThreatV1' -- src tests
          git grep -q 'DCBATCOLONY09<svB>' -- src tests
          git grep -q 'DESERTSWARMROOM' -- src tests
          bash scripts/check-desertbatfly-r5-retention.sh
          bash scripts/check-desertbatfly-r6-b1.sh
          git diff --check
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/task14-r6-b17-signal-runtime.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R6 B17 migrate SignalRuntime identity [r6-b17-done]'
          git push origin HEAD:task14-r6-b1-final
