name: Task14 R6 B3 Travel support migration

on:
  push:
    branches:
      - task14-r6-b1-final

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[r6-b3-travel-support]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r6-b1-final
          fetch-depth: 0

      - name: Assert B2 source state
        shell: bash
        run: |
          set -euo pipefail
          test -f src/Creatures/DesertBatfly/DesertBatflyRefuge.cs
          test -f src/Creatures/DesertBatfly/DesertBatflyWorldRoutePlanner.cs
          test -f src/Creatures/DesertBatfly/Colony/DB_ColonyRuntime.cs
          test -f scripts/check-desertbatfly-r5-retention.sh
          test -f scripts/check-desertbatfly-r6-b1.sh

      - name: Move Travel support files and rename identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/Creatures/DesertBatfly/Travel
          git mv src/Creatures/DesertBatfly/DesertBatflyRefuge.cs src/Creatures/DesertBatfly/Travel/DB_RefugePolicy.cs
          git mv src/Creatures/DesertBatfly/DesertBatflyWorldRoutePlanner.cs src/Creatures/DesertBatfly/Travel/DB_WorldRoutePlanner.cs
          python3 - <<'PY'
          from pathlib import Path
          mappings = {
              'DesertBatflyRefugeTarget': 'DB_RefugeTarget',
              'DesertBatflyRefuge': 'DB_RefugePolicy',
              'DesertBatflyWorldRoutePlanner': 'DB_WorldRoutePlanner',
              'DesertBatflyWorldRoute': 'DB_WorldRoute',
              'DesertBatflyTravelPurpose': 'DB_TravelPurpose',
          }
          for base in (Path('src'), Path('tests'), Path('scripts')):
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix not in {'.cs', '.sh'}:
                      continue
                  text = p.read_text(encoding='utf-8')
                  new = text
                  for old, replacement in mappings.items():
                      new = new.replace(old, replacement)
                  if new != text:
                      p.write_text(new, encoding='utf-8')
          PY

      - name: Validate existing architecture guards
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-desertbatfly-r5-retention.sh
          bash scripts/check-desertbatfly-r6-b1.sh

      - name: Validate Travel support migration
        shell: bash
        run: |
          set -euo pipefail
          test -f src/Creatures/DesertBatfly/Travel/DB_RefugePolicy.cs
          test -f src/Creatures/DesertBatfly/Travel/DB_WorldRoutePlanner.cs
          test ! -e src/Creatures/DesertBatfly/DesertBatflyRefuge.cs
          test ! -e src/Creatures/DesertBatfly/DesertBatflyWorldRoutePlanner.cs
          ! grep -RIn --include='*.cs' -E 'DesertBatflyRefuge(Target)?|DesertBatflyWorldRoute(Planner)?|DesertBatflyTravelPurpose' src
          grep -q 'internal static class DB_RefugePolicy' src/Creatures/DesertBatfly/Travel/DB_RefugePolicy.cs
          grep -q 'internal readonly struct DB_RefugeTarget' src/Creatures/DesertBatfly/Travel/DB_RefugePolicy.cs
          grep -q 'internal static class DB_WorldRoutePlanner' src/Creatures/DesertBatfly/Travel/DB_WorldRoutePlanner.cs
          grep -q 'internal readonly struct DB_WorldRoute' src/Creatures/DesertBatfly/Travel/DB_WorldRoutePlanner.cs
          grep -q 'internal enum DB_TravelPurpose' src/Creatures/DesertBatfly/Travel/DB_WorldRoutePlanner.cs
          grep -q 'RefugeMaxHops = 3' src/Creatures/DesertBatfly/Travel/DB_WorldRoutePlanner.cs
          grep -q 'MigrationMaxHops = 5' src/Creatures/DesertBatfly/Travel/DB_WorldRoutePlanner.cs
          grep -q 'MinimumRefugeQuality = 0.62f' src/Creatures/DesertBatfly/Travel/DB_RefugePolicy.cs
          grep -q 'SafetyMarginTicks = 600' src/Creatures/DesertBatfly/Travel/DB_RefugePolicy.cs
          grep -q 'DB_EnvironmentalPolicy.CanConsiderSandstormOutwardRefuge' src/Creatures/DesertBatfly/Travel/DB_RefugePolicy.cs
          grep -q 'DB_EnvironmentalPolicy.AcceptSandstormEmergencyRefuge' src/Creatures/DesertBatfly/Travel/DB_RefugePolicy.cs
          git diff --check

      - name: Commit migration and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/task14-r6-b3-travel-support.yml
          git add src tests scripts
          git commit -m 'R6 B3 migrate Travel support identities'
          git push origin HEAD:task14-r6-b1-final
