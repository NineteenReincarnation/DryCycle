name: DevTool Sound Vanilla Boundary Final

on:
  push:
    paths:
      - '.github/workflows/devtool-sound-vanilla-boundary-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified Sound vanilla boundary fixes
        shell: python
        run: |
          from pathlib import Path

          hook = Path('src/DevUI/DevTool/Compatibility/SoundPageConstructorOptimization.cs')
          text = hook.read_text(encoding='utf-8')
          old = '''    private static bool constructorPatchInstalled;\n    private static bool refreshHookInstalled;\n'''
          new = '''    private static bool constructorPatchInstalled;\n    private static bool refreshHookInstalled;\n    private static int legacyConstructionBypassDepth;\n'''
          if old not in text:
              raise SystemExit('hook fields anchor not found')
          text = text.replace(old, new, 1)

          needle = '''            constructorPatchInstalled = false;\n        }\n    }\n\n    private static void PatchConstructor'''
          replacement = '''            constructorPatchInstalled = false;\n        }\n\n        legacyConstructionBypassDepth = 0;\n    }\n\n    private static void PatchConstructor'''
          if needle not in text:
              raise SystemExit('hook disable tail anchor not found')
          text = text.replace(needle, replacement, 1)

          needle = '''    internal static void MaterializeLegacyFileButtons(DevInterface.SoundPage page)\n    {\n'''
          insert = '''    internal readonly struct LegacyConstructionScope : IDisposable\n    {\n        internal LegacyConstructionScope(bool enter)\n        {\n            if (enter) legacyConstructionBypassDepth++;\n        }\n\n        public void Dispose()\n        {\n            if (legacyConstructionBypassDepth > 0)\n                legacyConstructionBypassDepth--;\n        }\n    }\n\n    internal static LegacyConstructionScope EnterLegacyConstruction() => new(true);\n\n'''
          if needle not in text:
              raise SystemExit('legacy construction scope anchor not found')
          text = text.replace(needle, insert + needle, 1)

          old = '''        return enabled &&\n               EditorInputRouter.FrontendAttached &&\n'''
          new = '''        return enabled &&\n               legacyConstructionBypassDepth == 0 &&\n               EditorInputRouter.FrontendAttached &&\n'''
          if old not in text:
              raise SystemExit('optimized constructor predicate anchor not found')
          hook.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime = Path('src/DevUI/DevTool/Core/DevToolRuntime.cs')
          text = runtime.read_text(encoding='utf-8')
          old = '''        deferredViewRestorePending = false;\n        SetToolMode(deferredRestoreMode);\n        LegacyUiVisible = deferredRestoreLegacyUi;\n'''
          new = '''        deferredViewRestorePending = false;\n        if (deferredRestoreLegacyUi && deferredRestoreMode == EditorToolMode.Sound)\n        {\n            using SoundPageConstructorOptimization.LegacyConstructionScope legacyConstruction =\n                SoundPageConstructorOptimization.EnterLegacyConstruction();\n            SetToolMode(deferredRestoreMode);\n        }\n        else\n        {\n            SetToolMode(deferredRestoreMode);\n        }\n        LegacyUiVisible = deferredRestoreLegacyUi;\n'''
          if old not in text:
              raise SystemExit('deferred restore anchor not found')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')

          pipeline = Path('src/DevUI/DevTool/Sound/SoundActivationPipeline.cs')
          text = pipeline.read_text(encoding='utf-8')
          needle = '''        bool rebuiltFrontendOwnsPresentation =\n            EditorInputRouter.FrontendAttached &&\n            !EditorUiModeState.UseVanilla &&\n            !session.LegacyUiVisible;\n\n'''
          insert = '''        bool rebuiltFrontendOwnsPresentation =\n            EditorInputRouter.FrontendAttached &&\n            !EditorUiModeState.UseVanilla &&\n            !session.LegacyUiVisible;\n\n        // Vanilla/legacy sessions that entered Sound natively already paid the original constructor\n        // and own the original file list. Do not start a parallel rebuilt-UI activation behind them.\n        // If this exact page began activation while the rebuilt UI owned it and the user then exposes\n        // Legacy UI, allow that in-flight activation to finish so an initially empty shell can be\n        // populated safely.\n        if (!rebuiltFrontendOwnsPresentation &&\n            session.ToolMode == EditorToolMode.Sound &&\n            session.Owner.activePage is SoundPage legacySoundPage &&\n            !ReferenceEquals(requestedPage, legacySoundPage))\n            return;\n\n'''
          if needle not in text:
              raise SystemExit('activation vanilla-boundary anchor not found')
          pipeline.write_text(text.replace(needle, insert, 1), encoding='utf-8')

      - name: Commit and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/devtool-sound-vanilla-boundary-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DevUI/DevTool/Compatibility/SoundPageConstructorOptimization.cs src/DevUI/DevTool/Core/DevToolRuntime.cs src/DevUI/DevTool/Sound/SoundActivationPipeline.cs .github/workflows/devtool-sound-vanilla-boundary-final.yml
          git commit -m "DevTool Sound: preserve vanilla activation boundary"
          git push origin HEAD:main
