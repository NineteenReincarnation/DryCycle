name: Task14 R5 B2 environmental policy

on:
  push:
    branches:
      - task14-r5-b2-working

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Trigger R5 B2 environmental policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r5-b2-working
          fetch-depth: 0

      - name: Apply guarded migration
        run: python scripts/task14_r5_b2_apply.py

      - name: Validate direct policy architecture
        run: |
          git diff --check
          test ! -e scripts/task14_r5_b2_apply.py
          test ! -e .github/workflows/task14-r5-b2.yml
          test ! -e src/Creatures/DesertBatfly/Environmental/DesertBatflyEnvironmentalIntegration.cs
          test ! -e src/Creatures/DesertBatfly/Environmental/DesertBatflyEnvironmentalSocialBridge.cs
          test -e src/Creatures/DesertBatfly/Environmental/DB_EnvironmentalPolicy.cs
          ! grep -q 'MonoMod.RuntimeDetour' src/Creatures/DesertBatfly/Environmental/DB_EnvironmentalPolicy.cs
          ! grep -q 'DesertBatflyEnvironmentalIntegration' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          grep -q 'DB_EnvironmentalPolicy.CombatMotivation(fly)' src/Creatures/DesertBatfly/Combat/DB_CombatRuntime.cs
          grep -q 'DB_EnvironmentalPolicy.SocialDriveScale(bat)' src/Creatures/DesertBatfly/Social/DesertBatflySocialLife.cs
          grep -q 'DB_EnvironmentalPolicy.RoostChanceScale(fly)' src/Creatures/DesertBatfly/DesertBatflyAI.cs
          grep -q 'DB_EnvironmentalPolicy.FogNavigationFamiliarityScale' src/Creatures/DesertBatfly/Runtime/DB_FogGoalModifier.cs

      - name: Close HB-06 source guard
        run: |
          ! grep -RIn --include='*.cs' -A18 -B8 'ScanCreatures' src/Creatures/DesertBatfly/Environmental | grep -q 'DesertState.Thirst ='
          ! grep -RIn --include='*.cs' 'savedThirst\|decisionThirst' src/Creatures/DesertBatfly/Environmental

      - name: Audit remaining internal debt
        run: |
          echo '--- remaining RuntimeDetour imports ---'
          grep -RIl --include='*.cs' 'MonoMod.RuntimeDetour' src/Creatures/DesertBatfly | sort || true
          echo '--- remaining Bridge files ---'
          find src/Creatures/DesertBatfly -type f -name '*Bridge.cs' | sort || true

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+NineteenReincarnation@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Task13 detours with explicit environmental policy'
          git push origin HEAD:task14-r5-b2-working
