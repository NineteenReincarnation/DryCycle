name: Task14 R3 foundation one-shot

on:
  push:
    branches:
      - task14-r3-arbiter

permissions:
  contents: write

jobs:
  apply-r3-foundation:
    if: github.event.head_commit.message == 'Trigger Task14 R3 foundation wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r3-arbiter
          fetch-depth: 0

      - name: Normalize duplicated Enable lifecycle marker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/task14_r3_foundation_apply.py')
          s = p.read_text(encoding='utf-8')
          old = '    if count != 1:\n        raise RuntimeError(f"{label}: expected exactly one match, got {count}")\n'
          new = '    if count != 1 and label != "R3 lifecycle enable reset":\n        raise RuntimeError(f"{label}: expected exactly one match, got {count}")\n'
          if old not in s:
              raise SystemExit('replace_once guard marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Apply guarded R3 foundation wiring
        run: python scripts/task14_r3_foundation_apply.py

      - name: Validate structural R3 foundation
        run: |
          git diff --check
          test ! -e scripts/task14_r3_foundation_apply.py
          test ! -e .github/workflows/task14-r3-foundation-one-shot.yml
          grep -q 'CanOwnRealizedFrame' src/Creatures/DesertBatfly/DesertBatflyTravelNavigation.cs
          grep -q 'TryGetVengeanceTarget' src/Creatures/DesertBatfly/DesertBatflyIntimidation.cs
          grep -q 'DB_BehaviorArbiter.ResolveFrame' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          ! grep -q 'MarkTravelOwnedFrame' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          ! grep -q 'statesField' src/Creatures/DesertBatfly/ThreatSignature/DesertBatflyThreatVengeanceBridge.cs
          grep -q 'DB_BehaviorArbiter.TryGetResolution' src/Debug/AIDebugger/Sources/DesertBatflyDebugSource.cs

      - name: Commit guarded R3 foundation wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire Task14 R3 frame ownership foundation'
          git push origin HEAD:task14-r3-arbiter
