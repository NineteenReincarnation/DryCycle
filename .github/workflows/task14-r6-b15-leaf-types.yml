name: Task14 R6 B15 leaf type identities

on:
  push:
    branches: [ task14-r6-b1-final ]

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, '[r6-b15-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r6-b1-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace pending leaf C# identities
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'DesertBatflyEnvironmentalExposure': 'DB_EnvironmentExposure',
              'DesertBatflyEnvironmentalProfile': 'DB_EnvironmentProfile',
              'DesertBatflyEmergence': 'DB_Emergence',
              'DesertBatflyDefinition': 'DB_Definition',
          }

          roots = [Path('src'), Path('tests'), Path('scripts')]
          allowed_suffixes = {'.cs', '.sh', '.py'}
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in allowed_suffixes:
                      continue
                  text = path.read_text(encoding='utf-8')
                  new = text
                  for old, replacement in replacements.items():
                      new = new.replace(old, replacement)
                  if new != text:
                      path.write_text(new, encoding='utf-8')
                      changed.append(str(path))
          print('\n'.join(changed))
          PY

      - name: Validate identity migration and retained contracts
        shell: bash
        run: |
          set -euo pipefail

          if git grep -n -E 'DesertBatflyEnvironmentalExposure|DesertBatflyEnvironmentalProfile|DesertBatflyEmergence|DesertBatflyDefinition' -- src tests scripts; then
            echo 'Old leaf C# identity remains in executable source/test/script scope.' >&2
            exit 1
          fi

          grep -q 'class DB_EnvironmentExposure' src/Creatures/DesertBatfly/Environment/DB_EnvironmentExposure.cs
          grep -q 'class DB_EnvironmentProfile' src/Creatures/DesertBatfly/Environment/DB_EnvironmentProfile.cs
          grep -q 'class DB_Emergence' src/Creatures/DesertBatfly/Runtime/DB_Emergence.cs
          grep -q 'class DB_Definition' src/Creatures/DesertBatfly/Core/DB_Definition.cs

          grep -q '"DesertBatfly"' src/Creatures/DesertBatfly/Core/DB_Definition.cs
          git grep -q 'DCDesertBatflyV1' -- src tests
          git grep -q 'DCDesertBatflyThreatV1' -- src tests
          git grep -q 'DCBATCOLONY09<svB>' -- src tests
          git grep -q 'DESERTSWARMROOM' -- src tests

          bash scripts/check-desertbatfly-r5-retention.sh
          bash scripts/check-desertbatfly-r6-b1.sh
          git diff --check

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/task14-r6-b15-leaf-types.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R6 B15 finish pending leaf type identities [r6-b15-done]'
          git push origin HEAD:task14-r6-b1-final
