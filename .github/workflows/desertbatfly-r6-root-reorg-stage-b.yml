name: DesertBatfly R6 Root Reorg Stage B

on:
  push:
    branches:
      - task14-r6-b1-final
    paths:
      - '.github/workflows/desertbatfly-r6-root-reorg-stage-b.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Establish Vengeance domain boundary without state split
        shell: bash
        run: |
          set -euo pipefail
          fear='src/Creatures/DesertBatfly/Behavior/Fear/DB_FearRuntime.cs'
          vengeance='src/Creatures/DesertBatfly/Behavior/Vengeance/DB_VengeanceRuntime.cs'
          test -f "$fear"
          test ! -e "$vengeance"
          mkdir -p "$(dirname "$vengeance")"

          cat > "$vengeance" <<'CS'
          namespace DryCycle.Creatures.DesertBatfly;

          /// <summary>
          /// Formal Extreme Vengeance domain boundary.
          ///
          /// Fear and Vengeance intentionally still share one runtime state lifecycle during the
          /// behavior-preserving migration: fear collapse and persistent trauma must be able to
          /// cancel an armed vengeance state synchronously. External domains use this type for
          /// Vengeance facts/execution; DB_FearRuntime remains the shared-state owner until that
          /// coupling is extracted with dedicated state-contract tests.
          /// </summary>
          internal static class DB_VengeanceRuntime
          {
              internal static bool IsActive(DesertBatfly bat)
                  => DB_FearRuntime.IsExtremeVengeanceActive(bat);

              internal static bool IsAvenger(DesertBatfly bat)
                  => DB_FearRuntime.IsVengeanceAvenger(bat);

              internal static bool TryGetTarget(DesertBatfly bat, out Creature target)
                  => DB_FearRuntime.TryGetVengeanceTarget(bat, out target);

              internal static bool ExecuteOwned(DesertBatfly bat)
                  => DB_FearRuntime.ExecuteVengeanceOwned(bat);
          }
          CS

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'DB_FearRuntime.IsExtremeVengeanceActive': 'DB_VengeanceRuntime.IsActive',
              'DB_FearRuntime.IsVengeanceAvenger': 'DB_VengeanceRuntime.IsAvenger',
              'DB_FearRuntime.TryGetVengeanceTarget': 'DB_VengeanceRuntime.TryGetTarget',
              'DB_FearRuntime.ExecuteVengeanceOwned': 'DB_VengeanceRuntime.ExecuteOwned',
          }
          fear = Path('src/Creatures/DesertBatfly/Behavior/Fear/DB_FearRuntime.cs').resolve()
          changed = []
          for root in (Path('src'), Path('tests')):
              for path in root.rglob('*.cs'):
                  if path.resolve() == fear:
                      continue
                  text = path.read_text(encoding='utf-8')
                  updated = text
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
                      changed.append(path.as_posix())
          print('external Vengeance callsites migrated:', len(changed))
          for path in changed:
              print(path)
          PY

          # External modules must no longer use Fear as their Vengeance API.
          if git grep -n -E 'DB_FearRuntime\.(IsExtremeVengeanceActive|IsVengeanceAvenger|TryGetVengeanceTarget|ExecuteVengeanceOwned)' -- 'src/**/*.cs' 'tests/**/*.cs' | grep -v '^src/Creatures/DesertBatfly/Behavior/Fear/DB_FearRuntime.cs:'; then
            echo 'external Vengeance callsite still bypasses DB_VengeanceRuntime' >&2
            exit 1
          fi

          grep -q 'internal static class DB_VengeanceRuntime' "$vengeance"
          grep -q 'DB_VengeanceRuntime.ExecuteOwned' src/Creatures/DesertBatfly/Core/Runtime/DB_VengeanceExecutor.cs
          grep -q 'DB_VengeanceRuntime.IsActive' src/Creatures/DesertBatfly/Core/Runtime/DB_FrameContext.cs
          grep -q 'DB_VengeanceRuntime.TryGetTarget' src/Creatures/DesertBatfly/Core/Runtime/DB_FrameContext.cs
          grep -q 'DB_VengeanceRuntime.IsActive' src/Creatures/DesertBatfly/Core/Runtime/DB_Runtime.cs

          # Behavior-preserving invariants: shared Fear state and synchronous cancellation remain.
          grep -q 'ConditionalWeakTable<DesertBatfly, State> states' "$fear"
          grep -q 'memory.Strength >= VengeanceCollapseStrength' "$fear"
          grep -q 'PersistentTraumaStrength(bat, threat) >= DB_Tuning.TraumaSevere' "$fear"
          grep -q 'ClearVengeance(state);' "$fear"
          grep -q 'DB_BehaviorArbiter.IsPrimaryOwner(bat, DB_BehaviorOwner.Vengeance)' "$fear"
          grep -q 'ArmVengeanceGroup(' "$fear"
          grep -q 'DB_Tuning.SocialVengeanceGroupCap' "$fear"

          # Existing architecture/source retention checks must continue to pass.
          bash scripts/check-desertbatfly-r6-b1.sh

          # Production Task-era terminology remains forbidden.
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          patterns = (
              re.compile(r'\bTask\s*[-_]?\s*\d+\b', re.IGNORECASE),
              re.compile(r'\bTask-number\b', re.IGNORECASE),
          )
          bad = []
          for path in sorted(Path('src/Creatures/DesertBatfly').rglob('*.cs')):
              for no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if any(p.search(line) for p in patterns):
                      bad.append((path, no, line.strip()))
          if bad:
              for row in bad:
                  print(f'{row[0]}:{row[1]}: {row[2]}')
              sys.exit(1)
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'R6 B35b establish formal Vengeance runtime boundary [r6-b35b-done]'
          git push origin HEAD:task14-r6-b1-final
