name: Project principles reference sync

on:
  push:
    branches:
      - task14-r6-b1-final

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update references and stale Task14 wording
        shell: python
        run: |
          from pathlib import Path

          old_ref = "docs/项目原则/DryCycle_项目结构与代码原则.txt"
          new_ref = "docs/项目原则/DryCycle_项目结构与代码原则.md"

          text_exts = {
              ".md", ".txt", ".cs", ".csproj", ".sln", ".json",
              ".yml", ".yaml", ".sh", ".py", ".ps1"
          }

          changed = []
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if ".git" in path.parts or ".github" in path.parts:
                  continue
              if path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text.replace(old_ref, new_ref)
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="\n")
                  changed.append(str(path))

          task14 = Path("docs/Task/Task_14_DesertBatfly_ArchitectureRefactor.txt")
          text = task14.read_text(encoding="utf-8")
          old_block = """- 文件行数不是 Definition of Done；
          - 不设置 500/800/1200 行的强制拆分阈值；
          - 大文件只触发职责审查；
          - 拆分依据必须是职责、内聚、变更耦合、生命周期、可测试性和认知负担；
          - 禁止为了让文件变短制造大量 Part/Helper/Utils 碎片。"""
          new_block = """- 文件 KB、字节数和行数不参与架构判断，也不是 Review Trigger；
          - 不设置任何基于源码体积的拆分、合并或审查阈值；
          - 拆分依据只能是职责、内聚、变更耦合、生命周期、可测试性、状态/行为所有权和认知负担；
          - 高度内聚的完整领域实现不因文件较长而拆分；
          - 即使文件很短，只要存在多个独立修改理由，也必须审查职责边界；
          - 禁止为了让文件变短制造大量 Part/Helper/Utils 碎片。"""
          if old_block not in text:
              raise SystemExit("Task14 project-principle block did not match expected baseline")
          task14.write_text(text.replace(old_block, new_block, 1), encoding="utf-8", newline="\n")
          if str(task14) not in changed:
              changed.append(str(task14))

          print("Updated files:")
          for p in changed:
              print(" -", p)

      - name: Verify old reference is gone
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -F 'docs/项目原则/DryCycle_项目结构与代码原则.txt' -- ':!.github/workflows/project-principles-reference-sync.yml'; then
            echo 'Old project principles reference remains.' >&2
            exit 1
          fi

      - name: Commit synchronized references
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No reference changes required.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'docs: sync project principles references and architecture wording'
          git push origin HEAD:task14-r6-b1-final
