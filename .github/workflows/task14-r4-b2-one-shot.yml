name: Task14 R4 B2 one-shot

on:
  push:
    branches:
      - task14-r4-b2-working

permissions:
  contents: write

jobs:
  apply-r4-b2:
    if: github.event.head_commit.message == 'Trigger R4 B2 migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r4-b2-working
          fetch-depth: 0

      - name: Apply guarded R4 B2 migration
        run: python scripts/task14_r4_batch2_apply.py

      - name: Validate R4 B2 source contracts
        run: |
          git diff --check
          test ! -e scripts/task14_r4_batch2_apply.py
          test ! -e .github/workflows/task14-r4-b2-one-shot.yml
          grep -q 'internal static bool TryGuideNative' src/Creatures/DesertBatfly/Runtime/DB_FlightMotor.cs
          grep -q 'internal static bool TryRetarget' src/Creatures/DesertBatfly/Runtime/DB_FlightMotor.cs
          grep -q 'DB_FlightMotor.TryGuideNative(bat, DB_BehaviorOwner.Social' src/Creatures/DesertBatfly/Social/DesertBatflySocialLife.cs
          grep -q 'DB_FlightMotor.TrySteer' src/Creatures/DesertBatfly/DesertBatflyIntimidation.cs
          grep -q 'DB_FlightMotor.TryGuideNative' src/Creatures/DesertBatfly/ThreatSignature/DesertBatflyThreatTactics.cs
          grep -q 'DB_FlightMotor.TryRetarget' src/Creatures/DesertBatfly/ThreatSignature/DesertBatflyThreatRuntime.cs
          grep -q 'DB_FlightMotor.TryGuideNative(bat, DB_BehaviorOwner.Travel' src/Creatures/DesertBatfly/DesertBatflyTravelNavigation.cs
          grep -q 'DB_FlightMotor.TryGuideNative(bat, owner, nextGoal)' src/Creatures/DesertBatfly/Environmental/DesertBatflyEnvironmentalSurvivalBridge.cs
          grep -q 'NativeBurrow' src/Creatures/DesertBatfly/Runtime/DB_BehaviorProposal.cs
          grep -q 'NativeChain' src/Creatures/DesertBatfly/Runtime/DB_BehaviorProposal.cs
          grep -q 'Revision: R4-B2' docs/Discussion/Task_14_R4_FlightMotorStatus.txt
          grep -q 'TryGuideNative' tests/DesertBatfly/Program.Task14R4.cs
          grep -q 'TryRetarget' tests/DesertBatfly/Program.Task14R4.cs
          ! grep -RIn --include='*.cs' 'NominalFlightSpeed' src/Creatures/DesertBatfly

      - name: Audit remaining goal and sustained velocity writers
        run: |
          echo '--- direct localGoal assignment writers after R4 B2 ---'
          grep -RIn --include='*.cs' -E 'localGoal[[:space:]]*(\+?=)' src/Creatures/DesertBatfly || true
          echo '--- direct mainBodyChunk.vel assignment writers after R4 B2 ---'
          grep -RIn --include='*.cs' -E 'mainBodyChunk\.vel[[:space:]]*=' src/Creatures/DesertBatfly || true

      - name: Commit R4 B2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Converge R4 domain steering into FlightMotor'
          git push origin HEAD:task14-r4-b2-working
