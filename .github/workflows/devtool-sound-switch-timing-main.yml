name: DevTool Sound Switch Timing Main

on:
  push:
    paths:
      - '.github/workflows/devtool-sound-switch-timing-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Sound page switch timing
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/DevUI/DevTool/Core/DevToolRuntime.cs')
          text = path.read_text(encoding='utf-8')
          old = '''        LegacyUiPresentationController.Restore(Owner.activePage);\n        LegacyTransactions.Reset();\n        LegacyUiVisible = false;\n        Owner.SwitchPage(pageIndex);\n\n        // SwitchPage constructs a new concrete Page immediately and can cross document boundaries\n'''
          new = '''        LegacyUiPresentationController.Restore(Owner.activePage);\n        LegacyTransactions.Reset();\n        LegacyUiVisible = false;\n\n        long soundSwitchStarted = mode == EditorToolMode.Sound\n            ? System.Diagnostics.Stopwatch.GetTimestamp()\n            : 0L;\n        Owner.SwitchPage(pageIndex);\n        if (soundSwitchStarted != 0L)\n        {\n            double milliseconds =\n                (System.Diagnostics.Stopwatch.GetTimestamp() - soundSwitchStarted) * 1000d /\n                System.Diagnostics.Stopwatch.Frequency;\n            SoundActivationPipeline.RecordPageSwitch(milliseconds);\n        }\n\n        // SwitchPage constructs a new concrete Page immediately and can cross document boundaries\n'''
          if old not in text:
              raise SystemExit('SetToolMode switch anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/devtool-sound-switch-timing-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DevUI/DevTool/Core/DevToolRuntime.cs .github/workflows/devtool-sound-switch-timing-main.yml
          git commit -m "DevTool Sound: measure page switch constructor cost"
          git push origin HEAD:main
