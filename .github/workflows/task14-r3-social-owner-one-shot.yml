name: Task14 R3 Social owner one-shot

on:
  push:
    branches:
      - task14-r3-arbiter

permissions:
  contents: write

jobs:
  apply-r3-social-owner:
    if: github.event.head_commit.message == 'Trigger R3 Social owner migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task14-r3-arbiter
          fetch-depth: 0

      - name: Apply guarded R3 Social migration
        run: python scripts/task14_r3_social_owner_apply.py

      - name: Validate R3 Social ownership
        run: |
          git diff --check
          test ! -e scripts/task14_r3_social_owner_apply.py
          test ! -e .github/workflows/task14-r3-social-owner-one-shot.yml
          grep -q 'RefreshState' src/Creatures/DesertBatfly/Social/DesertBatflySocialLife.cs
          grep -q 'ApplyOwnedBehavior' src/Creatures/DesertBatfly/Social/DesertBatflySocialLife.cs
          grep -q 'DB_BehaviorOwner.Social' src/Creatures/DesertBatfly/Social/DesertBatflySocialLife.cs
          grep -q 'DesertBatflySocialLife.RefreshState' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          grep -q 'DB_SocialExecutor.TryExecute' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          ! grep -q 'DesertBatflySocialLife.Update(desert)' src/Creatures/DesertBatfly/DesertBatflyHooks.cs
          grep -q 'R3-CLOSED-05' docs/Discussion/Task_14_R3_FrameArbiterStatus.txt

      - name: Commit R3 Social migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Gate Social execution behind R3 arbiter'
          git push origin HEAD:task14-r3-arbiter
