name: DevTool Final Architecture Guard

on:
  pull_request:
    paths:
      - 'src/DevUI/DevTool/**'
      - 'src/Directory.Build.targets'
      - 'src/DryCycle.csproj'
      - 'scripts/validate-devtool-final-architecture.sh'
      - 'scripts/validate-devtool-page-view-boundaries.sh'
      - 'scripts/validate-devtool-frontend-build-contract.sh'
      - 'scripts/validate-devtool-native-factory-boundaries.sh'
      - 'scripts/validate-devtool-native-gizmo-boundaries.sh'
      - 'scripts/validate-devtool-native-sound-trigger-runtime.sh'
      - '.github/workflows/devtool-final-architecture-guard.yml'
  push:
    paths:
      - 'src/DevUI/DevTool/**'
      - 'src/Directory.Build.targets'
      - 'src/DryCycle.csproj'
      - 'scripts/validate-devtool-final-architecture.sh'
      - 'scripts/validate-devtool-page-view-boundaries.sh'
      - 'scripts/validate-devtool-frontend-build-contract.sh'
      - 'scripts/validate-devtool-native-factory-boundaries.sh'
      - 'scripts/validate-devtool-native-gizmo-boundaries.sh'
      - 'scripts/validate-devtool-native-sound-trigger-runtime.sh'
      - '.github/workflows/devtool-final-architecture-guard.yml'

jobs:
  architecture-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate final DevTool architecture boundaries
        shell: bash
        run: bash scripts/validate-devtool-final-architecture.sh
      - name: Validate DevTool page-view boundaries
        shell: bash
        run: bash scripts/validate-devtool-page-view-boundaries.sh
      - name: Validate DevTool RWImGui frontend build contract
        shell: bash
        run: bash scripts/validate-devtool-frontend-build-contract.sh
      - name: Validate DevTool Native Factory boundaries
        shell: bash
        run: bash scripts/validate-devtool-native-factory-boundaries.sh
      - name: Validate DevTool Native Gizmo boundaries
        shell: bash
        run: bash scripts/validate-devtool-native-gizmo-boundaries.sh
      - name: Validate DevTool Native Sound Trigger runtime boundaries
        shell: bash
        run: bash scripts/validate-devtool-native-sound-trigger-runtime.sh
