name: DesertBatfly R6 Function Retention

# Protect only durable gameplay/compatibility contracts. Historical private helper names,
# exact implementation topology and removed tests are intentionally not part of this guard.
on:
  push:
    branches:
      - main
    paths:
      - 'src/Creatures/DesertBatfly/**'
      - 'src/Plugin.cs'
      - 'scripts/check-desertbatfly-function-retention.sh'
      - '.github/workflows/desertbatfly-r6-function-retention.yml'
  pull_request:
    paths:
      - 'src/Creatures/DesertBatfly/**'
      - 'src/Plugin.cs'
      - 'scripts/check-desertbatfly-function-retention.sh'
      - '.github/workflows/desertbatfly-r6-function-retention.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Durable gameplay and compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-desertbatfly-function-retention.sh
