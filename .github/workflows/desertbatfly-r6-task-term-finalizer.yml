name: DesertBatfly R6 Task-Term Finalizer

on:
  push:
    branches:
      - task14-r6-b1-final
    paths:
      - '.github/workflows/desertbatfly-r6-task-term-finalizer.yml'

permissions:
  contents: write

jobs:
  finalize-task-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace remaining task-era terminology
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              'src/Creatures/DesertBatfly/Behavior/Injury/DB_Injury.cs': {
                  '// Task 04 tuning target: structural injury hits turning/lift much harder than straight speed.':
                  '// Structural injury tuning target: turning/lift degrade much harder than straight speed.',
              },
              'src/Creatures/DesertBatfly/Behavior/Injury/DB_InjuryRecovery.cs': {
                  '/// Cross-room travel remains Task09/DB_TravelRuntime authority.':
                  '/// Cross-room travel remains DB_TravelRuntime authority.',
                  '// Higher-priority preemption must not erase recovery state or Task09 intent.':
                  '// Higher-priority preemption must not erase recovery state or an active travel intent.',
              },
              'src/Creatures/DesertBatfly/Behavior/Perception/DB_VisibilityPolicy.cs': {
                  '/// Room.VisualContact remains the terrain authority. Task13/DryCycle weather contributes':
                  '/// Room.VisualContact remains the terrain authority. DryCycle weather contributes',
              },
              'src/Creatures/DesertBatfly/Behavior/ThreatSignature/DesertBatflyThreatRuntime.cs': {
                  'DesertBatflySocialLife.CancelForPriority(bat, "Task11 acute explosion");':
                  'DesertBatflySocialLife.CancelForPriority(bat, "acute explosion");',
                  '"Task11 acute explosion -> Task12 AlarmFlutter at real explosion center");':
                  '"acute explosion -> AlarmFlutter at real explosion center");',
                  'DesertBatflySocialLife.CancelForPriority(bat, "Task11 acute startle");':
                  'DesertBatflySocialLife.CancelForPriority(bat, "acute startle");',
                  '"Task11 firecracker/startle -> Task12 AlarmFlutter at real startle center");':
                  '"firecracker/startle -> AlarmFlutter at real startle center");',
                  'DesertBatflySocialLife.CancelForPriority(bat, "Task11 acute mass casualty");':
                  'DesertBatflySocialLife.CancelForPriority(bat, "acute mass casualty");',
                  '"Task11 mass casualty -> high urgency Task12 AlarmFlutter");':
                  '"mass casualty -> high urgency AlarmFlutter");',
                  'DesertBatflySocialLife.CancelForPriority(bat, "Task11 incoming projectile");':
                  'DesertBatflySocialLife.CancelForPriority(bat, "incoming projectile");',
                  'DesertBatflySocialLife.CancelForPriority(bat, "Task11 learned held-item caution");':
                  'DesertBatflySocialLife.CancelForPriority(bat, "learned held-item caution");',
                  'DesertBatflySocialLife.CancelForPriority(bat, "Task11 learned pursuit disengage");':
                  'DesertBatflySocialLife.CancelForPriority(bat, "learned pursuit disengage");',
              },
              'src/Creatures/DesertBatfly/Core/Runtime/DB_EnvironmentExecutor.cs': {
                  '/// R3 owned execution boundary for Task13 realized-room local survival. Task13 still never':
                  '/// R3 owned execution boundary for realized-room local environmental survival. This layer never',
              },
              'src/Creatures/DesertBatfly/Core/Runtime/DB_SocialExecutor.cs': {
                  '/// R3 execution boundary for Task10 neutral social locomotion and roost-join transitions.':
                  '/// R3 execution boundary for neutral social locomotion and roost-join transitions.',
              },
              'src/Creatures/DesertBatfly/Debug/DB_Trace.cs': {
                  'case "Task09Travel": return hasTravel ? travel.StatusReason : "Task 09 travel";':
                  'case "Travel": return hasTravel ? travel.StatusReason : "travel";',
                  '? "Task 10 neutral social interaction"':
                  '? "neutral social interaction"',
                  'case "Task09Travel": return hasTravel ? "Task 09 / " + travel.Purpose : "Task 09 Travel";':
                  'case "Travel": return hasTravel ? "Travel / " + travel.Purpose : "Travel";',
                  'if (hasSocial) return "Task 10 Social / " + social.Mode;':
                  'if (hasSocial) return "Social / " + social.Mode;',
              },
              'src/Creatures/DesertBatfly/DesertBatflyIntimidation.cs': {
                  '"direct Intimidation witness emits sole indirect Task12 Alarm generation");':
                  '"direct Intimidation witness emits sole indirect Alarm generation");',
                  '"Secondary/Chain fear no longer applies Trauma/Fear directly; Task12 Alarm perception owns indirect propagation");':
                  '"Secondary/Chain fear no longer applies Trauma/Fear directly; Alarm perception owns indirect propagation");',
                  '// Deliver synchronously before ArmVengeanceGroup scores followers so Task12 Rally':
                  '// Deliver synchronously before ArmVengeanceGroup scores followers so Rally',
                  'bat, threat, drive, "new Avenger armed -> immediate Task12 RallySignal");':
                  'bat, threat, drive, "new Avenger armed -> immediate RallySignal");',
                  '// R5: Task11 is a tactical modifier, not an internal RuntimeDetour. Vengeance owns':
                  '// R5: threat tactics are modifiers, not an internal RuntimeDetour. Vengeance owns',
              },
              'src/Creatures/DesertBatfly/World/Environment/DB_EnvironmentContracts.cs': {
                  '"calm / no Task13 influence");':
                  '"calm / no environmental influence");',
              },
              'src/Creatures/DesertBatfly/World/Environment/DB_WeatherEcology.cs': {
                  '// migration signal. High active Shelter lets Task09 consider a nearby clearer':
                  '// migration signal. High active Shelter lets travel consider a nearby clearer',
              },
          }

          changed = []
          for name, mapping in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in mapping.items():
                  count = text.count(old)
                  if count == 0:
                      raise SystemExit(f'missing expected text in {name}: {old}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(name)

          patterns = (
              re.compile(r'\bTask\s*[-_]?\s*\d+\b', re.IGNORECASE),
              re.compile(r'\bTask-number\b', re.IGNORECASE),
          )
          failures = []
          root = Path('src/Creatures/DesertBatfly')
          for path in sorted(root.rglob('*.cs')):
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      failures.append((path.as_posix(), line_no, line.strip()))
          if failures:
              for path, line_no, line in failures:
                  print(f'{path}:{line_no}: {line}')
              raise SystemExit('task-term finalizer left residual matches')

          print(f'changed {len(changed)} files; production regex matches = 0')
          PY
      - name: Commit final sweep and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/desertbatfly-r6-task-term-finalizer.yml
          git config user.name 'Orrhisk'
          git config user.email '164201860+NineteenReincarnation@users.noreply.github.com'
          git add src/Creatures/DesertBatfly .github/workflows/desertbatfly-r6-task-term-finalizer.yml
          git commit -m 'R6 B34 final production task-term sweep'
          git push origin HEAD:task14-r6-b1-final
