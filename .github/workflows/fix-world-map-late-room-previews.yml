name: Fix World Map late room previews

'on':
  push:
    paths:
      - '.github/workflows/fix-world-map-late-room-previews.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix retained room preview source tracking
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          scene_path = Path('src/DevUI/DevTool/RWImGui/WorldMapGpuScene.cs')
          scene = scene_path.read_text(encoding='utf-8')

          old_hash = '''                if (TryFindRoomPanel(page, room.RoomIndex, out RoomPanel panel))
                {
                    FAtlasElement element = panel.roomRep?.mapTex;
                    if (element != null)
                    {
                        hash = hash * 397 ^ (element.name?.GetHashCode() ?? 0);
                        Texture2D texture = element.atlas?.texture as Texture2D;
                        hash = hash * 397 ^ (texture != null ? texture.GetInstanceID() : 0);
                    }
                }
'''
          new_hash = '''                if (TryFindRoomPanel(page, room.RoomIndex, out RoomPanel panel))
                {
                    MapObject.RoomRepresentation rep = panel.roomRep;
                    FAtlasElement element = rep?.mapTex;
                    if (TryResolveRoomTextureAtlas(
                            element,
                            out Texture2D atlas,
                            out Rect sourceUv,
                            out float sourceWidth,
                            out float sourceHeight))
                    {
                        // Hash the same source that TryGetRoomQuad will actually render. MapTex can
                        // arrive or finish atlas setup after the immutable map snapshot was published.
                        hash = hash * 397 ^ 1;
                        hash = hash * 397 ^ (element.name?.GetHashCode() ?? 0);
                        hash = hash * 397 ^ atlas.GetInstanceID();
                        hash = hash * 397 ^ atlas.width;
                        hash = hash * 397 ^ atlas.height;
                        hash = hash * 397 ^ Mathf.RoundToInt(sourceWidth * 1000f);
                        hash = hash * 397 ^ Mathf.RoundToInt(sourceHeight * 1000f);
                        hash = hash * 397 ^ Mathf.RoundToInt(sourceUv.x * 1000000f);
                        hash = hash * 397 ^ Mathf.RoundToInt(sourceUv.y * 1000000f);
                        hash = hash * 397 ^ Mathf.RoundToInt(sourceUv.width * 1000000f);
                        hash = hash * 397 ^ Mathf.RoundToInt(sourceUv.height * 1000000f);
                    }
                    else if (rep?.texture != null)
                    {
                        // Some rooms expose their generated minimap through RoomRepresentation.texture
                        // before (or instead of) a usable Futile atlas element. Track that source too;
                        // otherwise a late texture never invalidates the retained room batch.
                        Texture2D direct = rep.texture;
                        hash = hash * 397 ^ 2;
                        hash = hash * 397 ^ direct.GetInstanceID();
                        hash = hash * 397 ^ direct.width;
                        hash = hash * 397 ^ direct.height;
                    }
                    else
                    {
                        hash = hash * 397;
                    }
                }
'''
          scene = replace_once(scene, old_hash, new_hash, 'WorldMapGpuScene source hash')

          old_quad = '''        FAtlasElement element = panel.roomRep.mapTex;
        if (element?.atlas?.texture is Texture2D atlas)
        {
            texture = atlas;
            uv = element.uvRect;
            widthTiles = Math.Max(1f, element.sourcePixelSize.x);
            heightTiles = Math.Max(1f, element.sourcePixelSize.y);
        }
        else if (panel.roomRep.texture != null)
        {
            texture = panel.roomRep.texture;
            widthTiles = Math.Max(1f, texture.width);
            heightTiles = Math.Max(1f, texture.height);
        }
'''
          new_quad = '''        FAtlasElement element = panel.roomRep.mapTex;
        if (TryResolveRoomTextureAtlas(
                element,
                out Texture2D atlas,
                out Rect atlasUv,
                out float atlasWidth,
                out float atlasHeight))
        {
            texture = atlas;
            uv = atlasUv;
            widthTiles = atlasWidth;
            heightTiles = atlasHeight;
        }
        else if (panel.roomRep.texture != null)
        {
            texture = panel.roomRep.texture;
            widthTiles = Math.Max(1f, texture.width);
            heightTiles = Math.Max(1f, texture.height);
        }
'''
          scene = replace_once(scene, old_quad, new_quad, 'WorldMapGpuScene room quad source')

          helper_anchor = '''    private static ChunkKey BaseKey(RoomQuad quad) =>
'''
          helper = '''    private static bool TryResolveRoomTextureAtlas(
        FAtlasElement element,
        out Texture2D texture,
        out Rect uv,
        out float width,
        out float height)
    {
        texture = null;
        uv = new Rect(0f, 0f, 1f, 1f);
        width = 0f;
        height = 0f;

        if (element?.atlas?.texture is not Texture2D atlas || atlas == null)
            return false;

        Rect candidateUv = element.uvRect;
        float uvWidth = Math.Abs(candidateUv.width);
        float uvHeight = Math.Abs(candidateUv.height);
        if (uvWidth <= 0.000001f || uvHeight <= 0.000001f)
            return false;

        float sampledWidth = uvWidth * Math.Max(1, atlas.width);
        float sampledHeight = uvHeight * Math.Max(1, atlas.height);
        if (sampledWidth < 0.5f || sampledHeight < 0.5f)
            return false;

        texture = atlas;
        uv = candidateUv;
        width = Math.Max(1f, element.sourcePixelSize.x > 0.5f ? element.sourcePixelSize.x : sampledWidth);
        height = Math.Max(1f, element.sourcePixelSize.y > 0.5f ? element.sourcePixelSize.y : sampledHeight);
        return true;
    }

'''
          scene = replace_once(scene, helper_anchor, helper + helper_anchor, 'WorldMapGpuScene atlas resolver')
          scene_path.write_text(scene, encoding='utf-8')

          optimizer_path = Path('src/DevUI/DevTool/RWImGui/WorldMapGpuRetainedOptimizerPlugin.cs')
          optimizer = optimizer_path.read_text(encoding='utf-8')
          optimizer = replace_once(
              optimizer,
              'using DryCycle.DevUI.DevTool.Map;\n',
              'using DryCycle.DevUI.DevTool.Map;\nusing UnityEngine;\n',
              'optimizer UnityEngine using')
          optimizer = replace_once(
              optimizer,
              'internal static class WorldMapGpuRetainedOptimizer\n{\n',
              'internal static class WorldMapGpuRetainedOptimizer\n{\n    private const int SourceAuditIntervalFrames = 15;\n\n',
              'optimizer audit constant')
          optimizer = replace_once(
              optimizer,
              '    private static int cachedSourceHash;\n    private static bool enabled;\n',
              '    private static int cachedSourceHash;\n    private static int nextSourceAuditFrame;\n    private static bool enabled;\n',
              'optimizer audit field')
          optimizer = replace_once(
              optimizer,
              '        cachedSourceHash = 0;\n        enabled = false;\n',
              '        cachedSourceHash = 0;\n        nextSourceAuditFrame = 0;\n        enabled = false;\n',
              'optimizer audit reset')

          start_marker = '    private static int ComputeRoomSourceHashHook(\n'
          end_marker = '    private static bool TryFindRoomPanelHook(\n'
          start = optimizer.find(start_marker)
          end = optimizer.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('optimizer source hash hook markers not found')
          new_hook = '''    private static int ComputeRoomSourceHashHook(
        OrigComputeRoomSourceHash orig,
        MapPage page,
        WorldMapGpuScene.FrameState frame)
    {
        if (!enabled || frame?.Snapshot?.Available != true)
            return orig(page, frame);

        EditorMapPresentationSnapshot snapshot = frame.Snapshot;
        int generation = WorldMapGpuCache.Generation;
        bool snapshotChanged = !ReferenceEquals(cachedSourceSnapshot, snapshot);
        bool generationChanged = cachedSourceGeneration != generation;
        bool auditDue = Time.frameCount >= nextSourceAuditFrame;

        if (!snapshotChanged && !generationChanged && !auditDue)
            return cachedSourceHash;

        // Stable frames stay O(1), but periodically ask the authoritative scene hash to audit live
        // RoomPanel texture state. MapTex and RoomRepresentation.texture are populated asynchronously
        // and can change without publishing a new map snapshot or bumping WorldMapGpuCache.Generation.
        // Without this audit, a room that missed its first texture-ready frame can stay invisible for
        // the rest of the Map session.
        int liveHash = orig(page, frame);
        unchecked
        {
            int hash = liveHash * 397 ^ generation;
            cachedSourceSnapshot = snapshot;
            cachedSourceGeneration = generation;
            cachedSourceHash = hash;
            nextSourceAuditFrame = Time.frameCount + SourceAuditIntervalFrames;
            return hash;
        }
    }

'''
          optimizer = optimizer[:start] + new_hook + optimizer[end:]
          optimizer_path.write_text(optimizer, encoding='utf-8')
          PY

      - name: Verify room preview recovery fix
        shell: bash
        run: |
          set -euo pipefail
          scene='src/DevUI/DevTool/RWImGui/WorldMapGpuScene.cs'
          optimizer='src/DevUI/DevTool/RWImGui/WorldMapGpuRetainedOptimizerPlugin.cs'

          grep -Fq 'private static bool TryResolveRoomTextureAtlas(' "$scene"
          grep -Fq 'hash = hash * 397 ^ direct.GetInstanceID();' "$scene"
          grep -Fq 'hash = hash * 397 ^ Mathf.RoundToInt(sourceUv.width * 1000000f);' "$scene"
          grep -Fq 'out float atlasWidth' "$scene"
          ! grep -Fq 'if (element?.atlas?.texture is Texture2D atlas)' "$scene"

          grep -Fq 'private const int SourceAuditIntervalFrames = 15;' "$optimizer"
          grep -Fq 'bool auditDue = Time.frameCount >= nextSourceAuditFrame;' "$optimizer"
          grep -Fq 'int liveHash = orig(page, frame);' "$optimizer"
          grep -Fq 'nextSourceAuditFrame = Time.frameCount + SourceAuditIntervalFrames;' "$optimizer"
          ! grep -Fq 'ReferenceEquals(cachedSourceSnapshot, snapshot) && cachedSourceGeneration == generation' "$optimizer"

      - name: Commit fix directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-world-map-late-room-previews.yml
          git add src/DevUI/DevTool/RWImGui/WorldMapGpuScene.cs \
                  src/DevUI/DevTool/RWImGui/WorldMapGpuRetainedOptimizerPlugin.cs
          git commit -m 'DevTool: recover late World Map room previews'
          git pull --rebase origin main
          git push origin HEAD:main
