name: CODEMAP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codemap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Regression tests
        shell: pwsh
        run: ./scripts/CodeMap.Tests.ps1

      - name: Validate changed CODEMAP scopes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $base = $env:BASE_SHA
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+
) {
              $base = 'EMPTY'
          }
          elseif (-not (git cat-file -e "$base^{commit}" 2>$null)) {
              git fetch --no-tags --depth=1 origin $base 2>$null
              if ($LASTEXITCODE -ne 0 -or -not (git cat-file -e "$base^{commit}" 2>$null)) {
                  $base = 'EMPTY'
              }
          }
          ./scripts/CodeMap.ps1 -Source Range -Base $base -Head $env:HEAD_SHA
