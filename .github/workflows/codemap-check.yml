name: CODEMAP

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regression tests
        shell: pwsh
        run: ./scripts/CodeMap.Tests.ps1

      - name: Validate changed CODEMAP scopes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if ($env:BASE_SHA -match '^0+$') {
              exit 0
          }
          ./scripts/CodeMap.ps1 -Source Range -Base $env:BASE_SHA -Head $env:HEAD_SHA
