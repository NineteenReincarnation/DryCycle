name: DryCycle Guard

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Guard/**'
      - '.github/workflows/guard.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Guard/**'
      - '.github/workflows/guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-compile:
    name: Build / Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and compile contracts
        shell: bash
        run: bash Guard/build-compile.sh
      - name: Parse local DevTool validator
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'Guard/tools/devtool-local.ps1'),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  devtool-architecture:
    name: DevTool Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash Guard/devtool-architecture.sh

  feature-specific:
    name: Feature-specific Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash Guard/feature-specific.sh
