name: DryCycle Guard

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Guard/**'
      - 'scripts/Test-MapRendering.ps1'
      - 'tests/WorldMapRenderIsolation.Tests/**'
      - 'tests/WorldMapRouting.Tests/**'
      - '.github/workflows/guard.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Guard/**'
      - 'scripts/Test-MapRendering.ps1'
      - 'tests/WorldMapRenderIsolation.Tests/**'
      - '.github/workflows/guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-safety:
    name: Build Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build safety contracts
        shell: bash
        run: bash Guard/build-safety.sh
      - name: Parse PowerShell validators
        shell: pwsh
        run: |
          $scripts = @(
            'Guard/tools/local-build.ps1',
            'scripts/Test-MapRendering.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script : $($_.Message)" }
              exit 1
            }
          }
