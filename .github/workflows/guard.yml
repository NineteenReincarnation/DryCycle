name: DryCycle Guard

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Guard/**'
      - '.github/workflows/guard.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Guard/**'
      - '.github/workflows/guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-safety:
    name: Build Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build safety contracts
        shell: bash
        run: bash Guard/build-safety.sh
      - name: Parse local build validator
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'Guard/tools/local-build.ps1'),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
