'''    /// <summary>Debug-only room-state peek. Never refreshes, prunes or creates domain state.</summary>
    internal static bool TryPeekTarget(Player target, out DB_FeedingTargetDebugState debug)
    {
        debug = default;
        Room room = target?.room;
        if (room == null || !rooms.TryGetValue(room, out RoomState state)) return false;
        bool hasSnapshot = false;
        PlayerDehydrationStage stage = default;
        for (int i=0;i<state.Targets.Count;i++)
        {
            TargetEntry entry=state.Targets[i];
            if (!ReferenceEquals(entry?.Player,target)) continue;
            stage=entry.Facts.Stage; hasSnapshot=true; break;
        }
        int reservations=0, attachReservations=0, attached=0, cloud=0;
        for (int i=0;i<state.Reservations.Count;i++)
        {
            Reservation r=state.Reservations[i];
            if (!ReferenceEquals(r.Target,target)) continue;
            reservations++;
            if (r.Role==DB_FeedingRole.Attach) { attachReservations++; if (r.Attached) attached++; }
            else if (r.Role==DB_FeedingRole.Cloud) cloud++;
        }
        if (!hasSnapshot && reservations==0) return false;
        int clock=room.game?.clock ?? 0;
        int age=state.TargetRefreshClock==int.MinValue ? int.MaxValue : Mathf.Max(0,clock-state.TargetRefreshClock);
        debug=new DB_FeedingTargetDebugState(target,stage,reservations,attachReservations,attached,cloud,age);
        return true;
    }

    internal static void MarkAttached(DB_Creature bat, bool attached)
    {''', 'feeding debug peek')
