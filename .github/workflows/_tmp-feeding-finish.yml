name: Temporary Desert Batfly Feeding Finalization

on:
  push:
    paths:
      - '.github/workflows/_tmp-feeding-finish.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final source patch
        shell: bash
        env:
          PATCH_B64: " B0U2VyaWFsLAogICAgICAgICAgICBjbG9jayk7CiAgICAgICAgaWYgKHJvbGwgPj0gZmFjdHMuUGlja3VwRmFpbHVyZUNoYW5jZSkKICAgICAgICB7CiAgICAgICAgICAgIG9yaWcoc2VsZiwgb2JqLCBncmFzcFVzZWQpOwogICAgICAgICAgICByZXR1cm47CiAgICAgICAgfSIiIi5yZXBsYWNlKCJBdHRlbX    "
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/feeding_patch.py
          python3 /tmp/feeding_patch.py

      - name: Run retained guards and syntax parse
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-desertbatfly-r5-retention.sh
          bash scripts/check-desertbatfly-r6-b1.sh
          bash scripts/check-desertbatfly-r7-performance.sh
          tmp="$(mktemp -d)"
          cat > "$tmp/P.csproj" <<'CSPROJ'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>disable</Nullable></PropertyGroup><ItemGroup><Reference Include="Microsoft.CodeAnalysis"><HintPath>$(MSBuildSDKsPath)/../Roslyn/bincore/Microsoft.CodeAnalysis.dll</HintPath></Reference><Reference Include="Microsoft.CodeAnalysis.CSharp"><HintPath>$(MSBuildSDKsPath)/../Roslyn/bincore/Microsoft.CodeAnalysis.CSharp.dll</HintPath></Reference></ItemGroup></Project>
          CSPROJ
          cat > "$tmp/Program.cs" <<'CS'
          using Microsoft.CodeAnalysis; using Microsoft.CodeAnalysis.CSharp;
          var files=Directory.EnumerateFiles("src/Creatures/DesertBatfly","*.cs",SearchOption.AllDirectories).Concat(new[]{"src/Thirst/PlayerDehydrationFacts.cs","src/Thirst/HydrationWeakness.cs"});
          var errors=new List<string>(); foreach(var path in files){var tree=CSharpSyntaxTree.ParseText(File.ReadAllText(path),new CSharpParseOptions(LanguageVersion.Preview),path);foreach(var d in tree.GetDiagnostics().Where(d=>d.Severity==DiagnosticSeverity.Error))errors.Add(d.ToString());}
          if(errors.Count>0){Console.Error.WriteLine(string.Join(Environment.NewLine,errors));Environment.Exit(1);} Console.WriteLine("Feeding finalization syntax parse passed.");
          CS
          dotnet run --project "$tmp/P.csproj"

      - name: Commit source and guard changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Orrhisk"
          git config user.email "164201860+NineteenReincarnation@users.noreply.github.com"
          git add src scripts
          git diff --cached --check
          git commit -m "Finalize aggregated dehydration feeding runtime"
          git push origin HEAD:main
