    private static void PromoteCloudReservations(RoomState state)
    {
        for (int t=0;t<state.Targets.Count;t++)
        {
            TargetEntry target=state.Targets[t];
            if (target?.Player==null || !target.Facts.FeedingEligible) continue;
            while (true)
            {
                int slot=FindFreeSlot(state,target.Player,DB_FeedingRole.Attach,target.Facts.Stage);
                if (slot<0) break;
                Reservation best=null; float motivation=-1f;
                for (int i=0;i<state.Reservations.Count;i++)
                {
                    Reservation r=state.Reservations[i];
                    if (!ReferenceEquals(r.Target,target.Player) || r.Role!=DB_FeedingRole.Cloud || r.Motivation<=motivation) continue;
                    best=r; motivation=r.Motivation;
                }
                if (best==null) break;
                best.Role=DB_FeedingRole.Attach; best.SlotIndex=slot; best.Attached=false;
            }
        }
    }

