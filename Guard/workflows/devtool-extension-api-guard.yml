name: DevTool Extension API Guard

on:
  pull_request:
    paths:
      - 'src/DevUI/DevTool/Extensions/**'
      - 'src/DevUI/DevTool/PHASE5.md'
      - 'scripts/validate-devtool-extension-api.sh'
      - '.github/workflows/devtool-extension-api-guard.yml'
  push:
    paths:
      - 'src/DevUI/DevTool/Extensions/**'
      - 'src/DevUI/DevTool/PHASE5.md'
      - 'scripts/validate-devtool-extension-api.sh'
      - '.github/workflows/devtool-extension-api-guard.yml'

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public extension boundary
        shell: bash
        run: bash scripts/validate-devtool-extension-api.sh
