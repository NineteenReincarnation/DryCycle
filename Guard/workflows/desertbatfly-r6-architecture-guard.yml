name: DesertBatfly R6 Architecture Guard

# R6 is now a living architecture guard. It protects durable boundaries and syntax,
# but deliberately does not freeze historical file layouts, task-era names, exact
# owner ordering, private helper names, or removed managed-test directories.
on:
  push:
    branches:
      - main
    paths:
      - 'src/Creatures/DesertBatfly/**'
      - 'src/Debug/AIDebugger/Sources/**'
      - 'scripts/check-desertbatfly-r6-b1.sh'
      - 'scripts/check-desertbatfly-internal-hook-cleanup.sh'
      - '.github/workflows/desertbatfly-r6-architecture-guard.yml'
  pull_request:
    paths:
      - 'src/Creatures/DesertBatfly/**'
      - 'src/Debug/AIDebugger/Sources/**'
      - 'scripts/check-desertbatfly-r6-b1.sh'
      - 'scripts/check-desertbatfly-internal-hook-cleanup.sh'
      - '.github/workflows/desertbatfly-r6-architecture-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Durable architecture boundaries
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-desertbatfly-r6-b1.sh
          bash scripts/check-desertbatfly-internal-hook-cleanup.sh

      - name: Roslyn syntax parse existing DesertBatfly sources
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cat > "$tmp/P.csproj" <<'CSPROJ'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>disable</Nullable></PropertyGroup><ItemGroup><Reference Include="Microsoft.CodeAnalysis"><HintPath>$(MSBuildSDKsPath)/../Roslyn/bincore/Microsoft.CodeAnalysis.dll</HintPath></Reference><Reference Include="Microsoft.CodeAnalysis.CSharp"><HintPath>$(MSBuildSDKsPath)/../Roslyn/bincore/Microsoft.CodeAnalysis.CSharp.dll</HintPath></Reference></ItemGroup></Project>
          CSPROJ
          cat > "$tmp/Program.cs" <<'CS'
          using Microsoft.CodeAnalysis;
          using Microsoft.CodeAnalysis.CSharp;
          var roots = new[] { "src/Creatures/DesertBatfly", "tests/DesertBatfly" };
          var errors = new List<string>();
          var parsed = 0;
          foreach (var root in roots)
          {
              if (!Directory.Exists(root)) continue;
              foreach (var path in Directory.EnumerateFiles(root, "*.cs", SearchOption.AllDirectories))
              {
                  parsed++;
                  var tree = CSharpSyntaxTree.ParseText(File.ReadAllText(path), new CSharpParseOptions(LanguageVersion.Preview), path);
                  foreach (var d in tree.GetDiagnostics().Where(d => d.Severity == DiagnosticSeverity.Error))
                      errors.Add(d.ToString());
              }
          }
          if (parsed == 0) errors.Add("No DesertBatfly C# source files were found.");
          if (errors.Count > 0)
          {
              Console.Error.WriteLine(string.Join(Environment.NewLine, errors));
              Environment.Exit(1);
          }
          Console.WriteLine($"R6 syntax guard passed for {parsed} existing source files.");
          CS
          dotnet run --project "$tmp/P.csproj"
